<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="core/ui.css">
</head>
<body>
<div class="app" id="app" x-data="sketch" :data-ready="ready && ''">
  <template x-part="nav"></template>
  <div class="stage" id="stage">
    <template x-part="view"></template><template x-part="loading"></template><template x-part="modes"></template>
    <div id="plan2d" aria-label="2D plan" x-show="mode === '2d'" x-cloak><p class="note">2D plan</p></div>
    <div id="documents" aria-label="Documents" x-show="mode === 'documents'" x-cloak><p class="note">Documents</p></div>
    <div id="design" aria-label="Cabinet" x-show="mode === 'cabinets'" x-cloak><p class="note">Cabinet: Materials, Groups, Columns, Components, Drawing, Notes</p></div>
    <template x-part="dock"></template><template x-part="sun"></template>
    <template x-part="help">
      <p>Turn: left button · move: right · zoom: the wheel.</p>
      <p><b>House</b> or a floor (top left): what the view shows; a floor's list picks one of its rooms.</p>
      <p><b>View</b> (the panel): the floors and the layers; a branch's name opens it. <b>Finish</b>: the floor or the room.</p>
    </template>
    <template x-part="corner"></template>
  </div>
  <template x-part="panel"><template x-part="layers"></template>
    <section x-show="tab === 'finish' && room?.furniture" x-cloak><h2>Furniture</h2><div class="lay">
      <label>Metal<select><option>—</option></select></label><label>Carcass board<select><option>—</option></select></label>
      <label>Front board<select><option>—</option></select></label><label>Worktop<select><option>—</option></select></label></div></section>
    <section x-show="tab === 'finish'" x-cloak><h2>Floor tiles</h2><div class="lay">
      <label>Tile<select><option>—</option></select></label>
      <div class="row"><label>Pattern<select><option>—</option></select></label><label>Direction<select><option>—</option></select></label></div>
      <div class="row"><label>Origin along (mm)<input type="number" step="1"></label><label>Origin across (mm)<input type="number" step="1"></label></div>
      <label>Grout<input type="color"></label></div></section>
  </template>
</div>
<script type="module" src="index.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</body>
</html>
