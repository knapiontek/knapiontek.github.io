<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test</title>
<style>
  body { font: 14px/1.45 system-ui, Arial, sans-serif; margin: 24px; color: #1f2523; }
  table { border-collapse: collapse; } td, th { text-align: left; vertical-align: top; padding: 6px 12px; border-bottom: 1px solid #e3e6e4; }
  .ok { color: #1d7a3a; font-weight: 700; } .no { color: #b3261e; font-weight: 700; } .wait { color: #8a8d88; }
  code { font-size: 12px; background: #f4f5f4; padding: 1px 4px; } li { margin: 2px 0; } [x-cloak] { display: none; }
</style>
</head>
<body x-data="tests">
<h1>Tests</h1>
<p>One test per module, at the module's own path: its public API on data of its own and on the project's data.</p>
<table><thead><tr><th>Test</th><th>Module</th><th>Result</th></tr></thead>
  <tbody><template x-for="r in rows">
    <tr><td><code x-text="'test/' + r.file"></code></td><td><code x-text="r.file"></code></td>
      <td><span x-show="!r.done" class="wait">running…</span>
        <template x-if="r.done"><div><span :class="r.ok ? 'ok' : 'no'" x-text="r.ok ? 'OK' : 'NOT OK'"></span> · <span x-text="r.passed.length + ' passed'"></span>
          <template x-if="r.error"><div><b x-text="r.error"></b></div></template>
          <template x-if="r.failed.length"><div>failed: <ul><template x-for="w in r.failed"><li x-text="w"></li></template></ul></div></template>
          <details><summary>what passed</summary><ul><template x-for="w in r.passed"><li x-text="w"></li></template></ul></details></div></template></td></tr>
  </template></tbody></table>

<script type="module" src="index.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</body>
</html>
