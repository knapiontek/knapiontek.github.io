<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../core/ui.css">
</head>
<body>
<div class="app" id="app" x-data="house" :data-ready="ready && ''">
  <template x-part="nav"></template>
  <div class="stage" id="stage">
    <template x-part="view"></template><template x-part="loading"></template>
    <div class="hud"><div id="context" aria-label="View menu"><template x-if="roomTag"><div class="menurow"><span class="roomtag"><span x-text="roomTag.name"></span>
      <a class="btnlink" :href="roomTag.href">Open</a><button aria-label="Unpick" @click="state.room = null">×</button></span></div></template></div></div>
    <template x-part="modes"></template><template x-part="plan"></template><template x-part="docs"></template>
    <template x-part="dock"></template><template x-part="pad"></template><template x-part="sun"></template>
    <template x-part="help">
      <div x-show="mode === '3d'"><p>Turn: left button, about the point under the cursor (an orange dot marks it while turning) · move: right · zoom: the wheel, toward the cursor.</p>
        <p><b>Walk</b>: the arrows walk and turn, A/D a step aside, Shift faster, PgUp/PgDn or a drag look, Space opens the nearest door, Esc ends.</p>
        <p><b>View</b> (the panel): the floors and the layers; an element shows when its floor and its kind are both on. Without the roof the highest floor shown is open: a click on its floor picks a room. A click on a door opens or closes it.</p>
        <p>In a room, the walls and the ceiling between the camera and the room hide; the floors do not apply there, only the elements.</p></div>
      <div x-show="mode === '2d'"><p>The plan of each floor as a CAD drawing: solid what lies under the cut, dashed what is over it, dash-dot where two rooms meet with no wall. The wheel zooms about the cursor, a drag moves the sheet. Below: the whole sheet again, the SVG to print.</p></div>
      <div x-show="mode === 'documents'"><p>The rooms with their areas, the doors with what is bought for them, the notes, the furniture as a tree, the Test (the checks of the data and of the model: OK, nothing to correct; a number, what to correct; i, to know). Shaded fields may be changed until a reload. Below: the XLSX with its formulas.</p></div>
    </template>
    <template x-part="corner"></template>
  </div>
  <template x-part="panel"><template x-part="layers"></template>
    <section x-show="tab === 'finish'" x-cloak><h2>Floor tiles</h2>
      <template x-if="!finish"><p class="note">Pick a room: a click on its floor in 3D, with the roof off.</p></template>
      <template x-if="finish && !finish.layout"><p class="note">No tiles here.</p></template>
      <template x-if="finish && finish.layout"><div class="lay">
        <label>Tile<select @change="setTiles(finish.layout.key, 'product', $event.target.value)"><template x-for="p in finish.layout.products" :key="p.k"><option :value="p.k" :selected="p.k === finish.layout.L.product" x-text="p.name"></option></template></select></label>
        <div class="row"><label>Pattern<select @change="setTiles(finish.layout.key, 'pattern', $event.target.value)"><template x-for="p in finish.layout.patterns" :key="p.k"><option :value="p.k" :selected="p.k === finish.layout.L.pattern" x-text="p.name"></option></template></select></label>
          <label>Direction<select @change="setTiles(finish.layout.key, 'dir', $event.target.value)"><template x-for="d in finish.layout.dirs" :key="d.k"><option :value="d.k" :selected="d.k === finish.layout.L.dir" x-text="d.name"></option></template></select></label></div>
        <div class="row"><label>Origin along (mm)<input type="number" step="1" :value="finish.layout.L.oa" @change="setTiles(finish.layout.key, 'oa', $event.target.value)"></label>
          <label>Origin across (mm)<input type="number" step="1" :value="finish.layout.L.ob" @change="setTiles(finish.layout.key, 'ob', $event.target.value)"></label></div>
        <div class="row"><label>Grout<input type="color" :value="finish.layout.L.grout" @change="setTiles(finish.layout.key, 'grout', $event.target.value)"></label>
          <label>&nbsp;<button class="btn ghost" @click="fitTiles(finish.layout.key)">Fit the origin</button></label></div>
        <template x-if="finish.layout.changed"><div class="btns"><button class="btn ghost" @click="setTiles(finish.layout.key, 'reset')">Back to the data</button></div></template>
      </div></template></section></template>
</div>
<script src="../core/load.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../core/geometry.js"></script>
<script src="../core/surface.js"></script>
<script src="../core/scene.js"></script>
<script src="../core/ui.js"></script>
<script src="../core/plan2d.js"></script>
<script src="../core/sheet.js"></script>
<script src="../core/tree.js"></script>
<script src="../core/library.js"></script>
<script src="model.js"></script>
<script src="../library/draw.js"></script>
<script src="../room/cabinets.js"></script>
<script src="../room/room.js"></script>
<script src="../room/tiles.js"></script>
<script src="../core/estimate.js"></script>
<script src="../room/docs.js"></script>
<script>
/* The main page: the whole house, or a part of it (?room=kitchen_6 or ?room=bathroom_7,bathroom_5) cut out of it, in 3D,
   2D and Documents (its last sheet: Test). Everything it shows comes from house.js and the library; nothing of this house is
   written here. The screen is the HTML above, of core/ui.js's pieces (Alpine.js); build(ui) makes the model and the scene. */
'use strict';
HOME.ui.page('house', {
  key: 'home-house', fresh: () => ({ mode: '3d', tab: null, layers: {}, zoom: 1, room: null }), valid: s => ['3d', '2d', 'documents'].includes(s.mode) && s.layers,
  modes: ['3d', '2d', 'documents'], tabs: { '3d': ['view', 'finish'], '2d': ['view'] },
  async load() { P = await build(this); },
  onMode: m => P.onMode(m), onLayers: () => P.apply(), menus: () => P.menus(),
  get layerBlocks() { return this.ready ? P.layerBlocks() : []; },
  get roomTag() { return this.ready ? P.roomTag() : null; },
  get finish() { return this.ready ? P.finish() : null; },
  setTiles(key, field, value) { P.setTiles(key, field, value); },
  fitTiles(key) { P.setTiles(key, 'fit'); }
});
let P = null;                              // the page built: what its screen asks of it
/* builds the page into ui (the page's Alpine part) */
async function build(ui) {
const state = ui.state;
const { $ } = HOME.ui;
const { prism, hRange, EPS } = HOME.geometry;
const { piecesOf } = HOME.surface;
const DEG = 180 / Math.PI;

const [DATA, LIB] = await Promise.all([HOME.load(HOME.load.file.house(), 'house', 3), HOME.library.load()]);
const MODEL = HOME.model.build(DATA), T = MODEL.T, HOUSE = MODEL.HOUSE, VIEW = T.setting(HOUSE, 'view').value;   // DATA: the site, the house in it
const { ROOF, WIDTH, RIDGE_TOP, FLOORS, ROOMS, ROOM, DOORS } = MODEL;
const level = F => F.offset[2], floorTop = F => level(F) + F.size[2];
const roomName = r => `${r.node.number}. ${r.node.name}`;
const MATERIALS = LIB.materials;
await LIB.loadTextures(Object.values(MATERIALS).flatMap(m => [m.image && m.image.key, m.wood && m.wood.decor]));

/* ================= THE PART SHOWN =================
   ?room= the ids of the rooms, by commas; none: the whole house */
const ASKED = (new URLSearchParams(location.search).get('room') || '').split(',').filter(Boolean);
const PART = ASKED.filter(id => ROOM[id]), WHOLE = !PART.length;
const PARTS = PART.map(MODEL.part);
const UNION = WHOLE ? null : [0, 1, 2, 3, 4, 5].map(k => (k % 2 ? Math.max : Math.min)(...PARTS.map(p => p.box[k])));
ui.title = WHOLE ? HOUSE.name : PART.map(id => roomName(ROOM[id])).join(', ');
ui.subtitle = WHOLE ? HOUSE.source : `${HOUSE.name} · ${[...new Set(PARTS.map(p => p.floor.name))].join(', ')}`;
document.title = WHOLE ? 'Home' : PART.map(id => ROOM[id].node.name).join(', ');

/* ================= THE ROOMS' FURNITURE =================
   the rooms shown that have files in room/ (house.js: files): placed by room/room.js; their looks join the library's */
const FURNISHED = (WHOLE ? ROOMS : PART.map(id => ROOM[id])).filter(r => (r.node.files || []).includes('cabinets'));
const FURNITURE = await Promise.all(FURNISHED.map(async r => {
  const roles = ['cabinets', 'scene'].concat(r.node.files.includes('docs') ? ['docs'] : []);
  const [cabinets, scene, docs] = await Promise.all(roles.map(role => HOME.load(HOME.load.file.room(r.id, role), role, 1)));
  /* the room as the room engine needs it: its zero and size, its floor area and the openings in its walls, in its own axes */
  const at = T.place(r.node), near = b => b[0] <= at[0] + r.node.size[0] + 300 && b[1] >= at[0] - 300 && b[2] <= at[1] + r.node.size[1] + 300 && b[3] >= at[1] - 300 && b[4] < at[2] + r.node.size[2] && b[5] > at[2];
  const node = { offset: at, size: r.node.size, area: r.node.area, openings: MODEL.OPENINGS.map(o => o.b).filter(near).map(b => b.map((v, k) => v - at[k >> 1])) };
  const prepared = HOME.room.prepare(node, { cabinets, scene }, { products: LIB.groups });
  return { room: r, prepared, docs: docs && HOME.docs.create({ cabinets: HOME.cabinets, model: prepared.model, tree: prepared.TREE, docs, appliances: prepared.appliances, library: LIB }) };
}));
for (const f of FURNITURE) Object.assign(MATERIALS, f.prepared.looks, f.prepared.scene.hardware.handles ? { handle: MATERIALS[f.prepared.scene.hardware.handles.default] } : {});
await LIB.loadTextures(FURNITURE.flatMap(f => f.prepared.textures));
const TILE_PRODUCTS = LIB.groups.tiles;
await LIB.loadTextures(Object.values(TILE_PRODUCTS).map(p => p.texture));
/* one room with furniture: the furniture's own layers too (its groups and its kinds of parts) */
const ROOM_LAYERS = !WHOLE && FURNITURE.length === 1 ? HOME.room.layers(FURNITURE[0].prepared) : {};

/* ================= SOLIDS =================
   The whole house: every solid, each door turning on its hinge. A part: the solids of its rooms, each wall, floor and
   ceiling an object of its own (a layer), a window or a door with the wall it sits in. */
const LAYER = HOME.ui.layerTree(Object.assign({}, VIEW.layers, ROOM_LAYERS));
const OBJECTS = [];                        // the part's objects that hide while the camera is beyond them: {layer, middle, normal}
const NORMAL = { '+x': [1, 0, 0], '-x': [-1, 0, 0], '+y': [0, 1, 0], '-y': [0, -1, 0], '+h': [0, 0, 1], '-h': [0, 0, -1] };
let STILL, LEAVES;                         // the cells that stand still; the doors drawn, each with the layers its leaf gets
if (WHOLE) {
  STILL = MODEL.CELLS.concat(MODEL.ROOF_CELLS, MODEL.STAIR_CELLS, MODEL.FIXTURES, MODEL.SITE_CELLS);
  LEAVES = DOORS.map(d => ({ door: d, layers: [] }));
} else {
  STILL = []; LEAVES = [];
  const seen = new Set(), signature = c => c.element + '|' + c.S.x1 + '|' + c.S.x2 + '|' + c.S.poly.join(' ');   // a wall two rooms share is drawn once
  for (const p of PARTS) for (const o of p.objects) {
    const layer = 'object:' + p.room.id + '/' + (o.host || o.id);
    if (!o.host) {
      const b = o.cells.map(c => { const ys = c.S.poly.map(q => q[0]), h = hRange(c.S); return [c.S.x1, c.S.x2, Math.min(...ys), Math.max(...ys), ...h]; });
      const middle = [0, 1, 2].map(k => (Math.min(...b.map(q => q[2 * k])) + Math.max(...b.map(q => q[2 * k + 1]))) / 2);
      OBJECTS.push({ layer, middle, normal: NORMAL[o.side] });
    }
    // a room ignores the floors: a solid split at a floor is one solid again (one line round it)
    for (const c of o.cells) if (!seen.has(signature(c))) { seen.add(signature(c)); STILL.push(Object.assign({}, c, { room: p.room.id, layers: c.layers.filter(k => !VIEW.floors.includes(k)).concat(layer) })); }
    if (o.leaf && !LEAVES.some(l => l.door === o.leaf)) LEAVES.push({ door: o.leaf, layers: [layer] });
  }
}


/* ================= SCENE ================= */
const LIGHT = WHOLE ? VIEW.light : Object.assign({}, VIEW.light, VIEW.light.inside, {
  sun: Object.assign({}, VIEW.light.sun, VIEW.light.inside.sun), sky: Object.assign({}, VIEW.light.sky, VIEW.light.inside.sky) });
const BODY = WHOLE ? [[ROOF.x[0], 0, level(FLOORS[0])], [ROOF.x[1], WIDTH, RIDGE_TOP]] : [[UNION[0], UNION[2], UNION[4]], [UNION[1], UNION[3], UNION[5]]];
const V = HOME.scene.create({ canvas: $('gl'), stage: $('stage'), materials: MATERIALS, textures: LIB.textures, light: LIGHT, edges: VIEW.edges,
  sunCentre: [0, 1, 2].map(k => (BODY[0][k] + BODY[1][k]) / 2) });
if (!WHOLE) V.renderer.physicallyCorrectLights = true;   // a room: the inside light and the lamps in physical units
for (const f of FURNITURE) {
  const own = PARTS.find(p => p.room === f.room), ceilings = own ? own.objects.filter(o => o.role === 'ceiling').map(o => 'object:' + f.room.id + '/' + o.id) : [];
  f.made = HOME.room.build(V, f.prepared, { materials: MATERIALS, layers: [f.room.floor.id, 'furniture'], ceilingLayers: ceilings, products: LIB.groups, textures: LIB.textures });
  STILL.push(...f.made.STATIC);
  for (const [k, m] of Object.entries(f.made.tiles.materials)) MATERIALS[k] ||= m;
  if (f.made.tiles.pieces.length) V.buildMeshes(f.made.tiles.pieces.map(p => Object.assign(p, { cell: Object.assign({}, p.cell, { layers: [f.room.floor.id].concat(p.cell.layers) }), group: [f.room.floor.id].concat(p.cell.layers).join('+') })));
}
const SOLIDS = WHOLE ? MODEL.SOLIDS.concat(...FURNITURE.map(f => f.made.STATIC)) : STILL;   // what the walk bumps into
const PIECES = piecesOf(STILL);
V.buildMeshes(PIECES); V.buildEdges(PIECES);
for (const l of LEAVES) {
  const cells = l.door.cells.map(c => Object.assign({}, c, { layers: c.layers.concat(l.layers) }));
  l.mover = V.mover({ pieces: piecesOf(cells), at: [l.door.axis[0], l.door.axis[1], 0], axis: [0, 0, 1], angle: l.door.angle * DEG });
}
V.addLight(); V.addCaps();

/* ================= THE FLOOR TILES =================
   house.js sets them (house/project.md): one layout for each node that sets tiles, over the rooms that take them from it.
   The viewer may change a layout's product, pattern, direction, origin and grout (kept in the browser, state.layouts:
   what differs from the data); each is laid and counted over all its rooms, drawn in the rooms shown */
const TILES = T.setting(HOUSE, 'tiles').value;
const SHOWN_ROOMS = new Set((WHOLE ? ROOMS : PART.map(id => ROOM[id])).map(r => r.id));
const PASSAGE_BOXES = MODEL.OPENINGS.filter(o => HOUSE.geometry.openingKinds[o.kind].passage).map(o => o.b);
if (!state.layouts) state.layouts = {};
const LAID = {};                           // key -> {L: the laying, P: the product, laid: its rooms, pieces, count, made: its meshes}
/* the laying of a layout: the data, then what the viewer changed; a changed product, pattern or direction fits the origin anew */
function laying(D) {
  const v = state.layouts[D.key] || {}, product = TILE_PRODUCTS[v.product] ? v.product : D.product, P = TILE_PRODUCTS[product];
  const changed = product !== D.product || (v.pattern && v.pattern !== (D.pattern || P.pattern)) || (v.dir && v.dir !== D.dir);
  return { product, pattern: v.pattern || D.pattern || P.pattern, dir: v.dir || D.dir, grout: v.grout || LIB.textures[P.texture].grout,
    oa: v.oa ?? (changed ? null : D.oa), ob: v.ob ?? (changed ? null : D.ob) };
}
function layTiles(D) {
  const L = laying(D), P = TILE_PRODUCTS[L.product], laid = HOME.tiles.rooms(D.rooms, PASSAGE_BOXES, level(D.floor));
  if (L.oa === null || L.ob === null) { Object.assign(L, HOME.tiles.fit(L, P, laid)); Object.assign(state.layouts[D.key] ||= {}, { oa: L.oa, ob: L.ob }); }
  const pieces = HOME.tiles.lay(L, P, laid, L.oa, L.ob), count = HOME.tiles.count(P, pieces);
  const old = LAID[D.key];
  if (old) V.removeMeshes(old.made);
  LAID[D.key] = { D, L, P, laid, pieces, count, made: V.buildMeshes(tilePieces(D, L, P, laid, pieces)) };
}
/* the pieces for core (room/tiles.js): the grout under the layout's rooms shown, the tiles over it; a small cut red while its layer is on */
function tilePieces(D, L, P, laid, pieces) {
  const T = LIB.textures[P.texture], h = level(D.floor), up = [0, 0, 1], cell = { layers: [D.floor.id].concat(TILES.layers) };
  const grout = laid.filter(r => SHOWN_ROOMS.has(r.id)).flatMap(r => r.rects).map(q => [[q[0], q[2], h + TILES.grout], [q[1], q[2], h + TILES.grout], [q[1], q[3], h + TILES.grout], [q[0], q[3], h + TILES.grout]]);
  const made = HOME.tiles.corePieces(L, P, T, pieces.filter(p => SHOWN_ROOMS.has(p.room)), grout, (x, y) => [x, y, h + TILES.top], up, cell, TILES.small);
  for (const [k, m] of Object.entries(made.materials)) MATERIALS[k] ||= m;
  return made.pieces;
}
const LAYOUTS = MODEL.LAYOUTS.filter(D => TILE_PRODUCTS[D.product]);
for (const D of LAYOUTS) layTiles(D);
const layoutOf = r => LAYOUTS.find(D => D.rooms.includes(r));
/* the room picked: a mark over its floor */
let MARK = [];
const MARK_MATERIAL = 'tiles:mark';
MATERIALS[MARK_MATERIAL] = { color: '#c8882f', opacity: 0.3 };
function markRoom() {
  V.removeMeshes(MARK); MARK = [];
  const r = ROOM[state.room];
  if (!r || !WHOLE) return;
  const h = level(r.floor) + TILES.mark, c = { layers: [r.floor.id] };
  MARK = V.buildMeshes(r.rects.map(q => ({ poly: [[q[0], q[2], h], [q[1], q[2], h], [q[1], q[3], h], [q[0], q[3], h]], n: [0, 0, 1], uv: v => [v[0], v[1]], cell: c, group: 'mark', material: MARK_MATERIAL })));
  for (const g of MARK) { g.mesh.castShadow = g.mesh.receiveShadow = false; g.mesh.visible = state.mode === '3d' && !!openFloor() && r.floor === openFloor(); }
  V.redraw();
}

/* ================= STATE, LAYERS ================= */
const { layerOn } = HOME.ui.layerSwitch(LAYER, () => state.layers);
const ROOM_VIEW = new Set(WHOLE ? [] : VIEW.floors);   // a room shows whatever the floors are switched to
const HANDLE = 'cup';                      // the handles drawn: cup or bar (each front has both)
const shown = layers => layers.every(k => k === 'cup' || k === 'bar' ? k === HANDLE : !LAYER[k] || ROOM_VIEW.has(k) || layerOn(k));
let HIDDEN = new Set();                    // the objects of a part the camera is beyond
const ghost = layers => layers.some(k => HIDDEN.has(k));
/* the open floor of the whole house: the highest floor shown with the roof off */
function openFloor() {
  if (!WHOLE || shown(ROOF.layers)) return null;
  const on = FLOORS.filter(F => layerOn(F.id));
  return on.length ? on[on.length - 1] : null;
}
function apply() {
  V.showPieces(shown, layerOn, ghost);
  for (const g of MARK) g.mesh.visible = state.mode === '3d' && !!openFloor() && ROOM[state.room] && ROOM[state.room].floor === openFloor();
  for (const f of FURNITURE) f.made.showDetails(layers => shown(layers) && !ghost(layers));
  V.redraw();
}
/* a part: the walls, the floor and the ceiling the camera is beyond hide, as it moves */
const MARGIN = 50;                         // mm beyond an object's middle before it hides
V.onFrame(() => {
  if (WHOLE) return false;
  const c = V.cameraAt(), now = new Set(OBJECTS.filter(o => o.normal.reduce((s, n, k) => s + n * (c[k] - o.middle[k]), 0) >= MARGIN).map(o => o.layer));
  if (now.size === HIDDEN.size && [...now].every(k => HIDDEN.has(k))) return false;
  HIDDEN = now; apply(); return true;
});

/* ================= 3D: cameras, sun, clicks, walk ================= */
const SUN = HOME.ui.sunStore(VIEW.light);
const placeSun = () => { V.placeSun(SUN.state); for (const f of FURNITURE) f.made.night(!!SUN.state.night); };
ui.sun = { rects: MODEL.FOOTPRINT, mark: PART.flatMap(id => ROOM[id].rects), sun: SUN.state, change: () => { SUN.save(); placeSun(); } };
/* the cameras: the house's and the open floor's; of a part, over it and from two corners, framed by its box */
function cameras() {
  if (WHOLE) {
    const F = openFloor(), own = F && T.setting(F, 'view.cameras');
    return VIEW.cameras.concat(own && own.from === F ? own.value.map(c => ({ name: c.name, eye: [c.eye[0], c.eye[1], c.eye[2] + level(F)], target: [c.target[0], c.target[1], c.target[2] + level(F)] })) : []);
  }
  const own = PART.length === 1 && FURNITURE.find(f => f.room.id === PART[0]);   // a room's own cameras (its scene)
  if (own && own.prepared.scene.cameras) {                  // in the room's axes
    const p = T.place(own.room.node), at = v => [v[0] + p[0], v[1] + p[1], v[2] + p[2]];
    return own.prepared.scene.cameras.map(c => ({ name: c.name, eye: at(c.eye), target: at(c.target) }));
  }
  const EYE = 1600, LOOK = 900;            // mm over the floor: a person's eyes; what they look at
  const floors = FLOORS.filter(F => PARTS.some(p => p.floor === F));
  return floors.flatMap(F => {
    const own = PARTS.filter(p => p.floor === F), [x1, x2, y1, y2] = [0, 1, 2, 3].map(k => (k % 2 ? Math.max : Math.min)(...own.map(p => p.box[k])));
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, size = Math.max(x2 - x1, y2 - y1), L = level(F);
    const above = { name: 'Above', eye: [cx, cy + 1, L + 2.4 * size], target: [cx, cy, L] };
    const corner = { name: 'Corner', eye: [x1 - 0.5 * size, y1 - 0.5 * size, L + EYE + 0.4 * size], target: [cx, cy, L + LOOK] };
    const opposite = { name: 'Opposite', eye: [x2 + 0.5 * size, y2 + 0.5 * size, L + EYE + 0.4 * size], target: [cx, cy, L + LOOK] };
    /* rooms on several floors: two views of each floor, named by it */
    return floors.length === 1 ? [above, corner, opposite] : [Object.assign(corner, { name: F.name }), Object.assign(above, { name: F.name + ' above' })];
  });
}
/* a click: a door opens or closes; on the open floor, its room is picked */
V.onClick(ray => {
  if (state.mode !== '3d') return;
  const m = V.moverAt(ray);
  if (m) return V.toggle(m);

    layTiles(D); apply();
    if (SHEET) SHEET.set(book());
  },
  /* below: the mode's actions */
  menus() {
    const walk = { name: 'Walk', cls: 'walk', pressed: ui.walking, go: () => (V.walk.on ? V.stopWalk() : V.startWalk()) };
    const go = c => ({ name: c.name, go: () => { V.stopWalk(); V.flyTo(c); } });
    return { '3d': [[walk], cameras().map(go)], '2d': [PLAN_MENU], documents: [HOME.sheet.menu(() => SHEET, (WHOLE ? 'house' : PART.join('-')) + '.xlsx'),
      WHOLE ? [] : FURNITURE.map(f => ({ name: 'Edit the cabinets', go: () => { location.href = '../room/cabinets.html?room=' + f.room.id; } }))] };
  }
};
}
</script>
