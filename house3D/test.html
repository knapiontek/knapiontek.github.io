<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testy domu</title>
<link rel="stylesheet" href="core/ui.css">
<style>
body{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 32px 16px;max-width:1100px}
.check ul{font-family:var(--f-mono);font-size:11.5px}
</style>
</head>
<body>
<h1>Testy domu</h1>
<p class="sub" id="summary">Liczenie…</p>
<div id="results"></div>
<script>window.addEventListener('error', e => { document.getElementById('summary').textContent = 'Błąd: ' + (e.message || 'nieznany') + ' (' + (e.filename || '').split('/').pop() + ':' + (e.lineno || '') + ')'; });</script>
<script src="house.js"></script>
<script src="core/geometry.js"></script>
<script src="core/ui.js"></script>
<script src="engine.js"></script>
<script src="test.js"></script>
<script>
(function () {
  const t0 = performance.now();
  const checks = TESTS.map(t => ({ name: t.name, items: t.run() }));
  const failed = checks.filter(c => c.items.length).length;
  document.getElementById('results').innerHTML = CORE.ui.checksHtml(checks);
  document.getElementById('summary').textContent = `${checks.length - failed} z ${checks.length} OK · ${Math.round(performance.now() - t0)} ms · dane: house.js, teraz`;
  document.title = (failed ? '✗ ' : '✓ ') + 'Testy domu';
})();
</script>
</body>
</html>
