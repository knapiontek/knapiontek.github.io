<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Elevation Layout</title>
  <style>
    /* =============================================================
       STYLES
       ============================================================= */
        :root {
          --bg: #0f172a;
          --panel: #1e293b;
          --accent: #38bdf8;
          --accent-hover: #7dd3fc;
          --danger: #f87171;
          --danger-hover: #fca5a5;
          --text: #f8fafc;
          --text-muted: #cbd5e1;
          --text-dim: #e2e8f0;
          --border: #334155;
          --border-soft: #475569;
          --row-hover: #334155;
    
          --sheet-bg: #ffffff;
          --sheet-header-bg: #f1f5f9;
          --sheet-border: #d8dee8;
          --sheet-text: #1e293b;
          --sheet-text-muted: #64748b;
          --sheet-row-alt: #f8fafc;
          --sheet-row-hover: #eaf4fe;
          --sheet-focus: #38bdf8;
          --sheet-ghost: #94a3b8;
        }
    
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    
        h1 { max-width: 1400px; margin: 0 auto 18px auto; font-size: 22px; }
    
        #action-bar {
          max-width: 1400px;
          margin: 0 auto 15px auto;
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          justify-content: flex-end;
          align-items: center;
        }
        .action-group { display: flex; gap: 8px; padding-left: 10px; border-left: 1px solid var(--border-soft); }
        .action-group:first-child { border-left: none; padding-left: 0; }
    
        .btn {
          background: var(--accent);
          color: var(--bg);
          border: none;
          padding: 9px 16px;
          font-size: 13px;
          font-weight: 600;
          border-radius: 6px;
          cursor: pointer;
          transition: background 0.15s ease, transform 0.1s ease;
          white-space: nowrap;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn.secondary { background: var(--border-soft); color: var(--text); }
        .btn.secondary:hover { background: #5b6b83; }
        .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn.danger:hover { background: rgba(248,113,113,0.12); color: var(--danger-hover); border-color: var(--danger-hover); }
    
        #status-banner {
          max-width: 1400px;
          margin: 0 auto 15px auto;
          display: none;
          padding: 10px 14px;
          border-radius: 6px;
          font-size: 13px;
          font-weight: 500;
        }
        #status-banner.show { display: block; }
        #data-issues { max-width: 1400px; margin: -10px auto 20px auto; padding: 10px 14px; border-radius: 6px; font-size: 13px;
          background: rgba(248,113,113,0.12); color: var(--danger-hover); border: 1px solid var(--danger); }
        #data-issues ul { margin: 6px 0 0; padding-left: 18px; }
        #data-issues li { margin: 2px 0; }
        [x-cloak] { display: none !important; }
        #status-banner.error { background: rgba(248,113,113,0.12); color: var(--danger-hover); border: 1px solid var(--danger); }
        #status-banner.ok { background: rgba(56,189,248,0.12); color: var(--accent-hover); border: 1px solid var(--accent); }
    
        #svg-container { width: 100%; max-width: 1400px; margin: 20px auto 0 auto; background: var(--panel); padding: 20px; box-sizing: border-box; border-radius: 8px; position: relative; }
        #svg-canvas { width: 100%; text-align: center; }
        svg {
          display: inline-block;
          width: auto;
          height: auto;
          max-width: 100%;
          max-height: min(70vh, 700px);
          overflow: visible;
        }
        .component-group { cursor: pointer; }
        .component-group:hover rect { filter: brightness(1.2); stroke: var(--accent) !important; stroke-width: 3px; }
        
        #tooltip {
          position: absolute;
          display: none;
          background: var(--bg);
          color: var(--accent);
          border: 2px solid var(--accent);
          padding: 6px 12px;
          font-size: 14px;
          font-weight: bold;
          border-radius: 4px;
          pointer-events: none;
          white-space: nowrap;
          z-index: 10;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        #svg-footnote {
          margin-top: 16px;
          padding-top: 12px;
          border-top: 1px solid var(--border);
          font-size: 13px;
          color: var(--text-muted);
          min-height: 18px;
          text-align: left;
        }
    
        .panel {
          max-width: 1400px;
          margin: 20px auto 0 auto;
          background: var(--panel);
          padding: 20px;
          border-radius: 8px;
          box-sizing: border-box;
        }
        .panel h3 { margin-top: 0; color: var(--accent); font-size: 16px; }
    
        .settings-bar {
          display: flex;
          gap: 20px;
          margin-bottom: 16px;
          align-items: center;
          font-size: 13px;
          color: var(--text-dim);
          background: var(--bg);
          padding: 10px 14px;
          border-radius: 6px;
          border: 1px solid var(--border);
        }
        .settings-bar label {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .settings-bar input {
          width: 90px;
          background: var(--sheet-bg);
          border: 1px solid var(--sheet-border);
          border-radius: 4px;
          padding: 5px 8px;
          color: var(--sheet-text);
          font: inherit;
          text-align: right;
        }
    
        .input-grid {
          display: grid;
          grid-template-columns: minmax(220px, 300px) 1fr;
          gap: 20px;
          align-items: start;
        }
        .sub-section h4 {
          margin: 0 0 8px 0;
          color: var(--text-dim);
          border-bottom: 1px solid var(--border-soft);
          padding-bottom: 6px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 14px;
        }
        .sub-section h4 span.total { font-size: 12px; color: var(--accent); font-weight: normal; }
    
        .sheet-wrap {
          background: var(--sheet-bg);
          border: 1px solid var(--sheet-border);
          border-radius: 6px;
          overflow: auto;
          max-height: 360px;
          /* slim scrollbars matching the light sheet: thin grey thumb, no arrows */
          scrollbar-width: thin;
          scrollbar-color: var(--sheet-ghost) transparent;
        }
        .sheet-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
        .sheet-wrap::-webkit-scrollbar-track { background: transparent; }
        .sheet-wrap::-webkit-scrollbar-thumb { background: var(--sheet-border); border-radius: 8px; border: 2px solid var(--sheet-bg); }
        .sheet-wrap::-webkit-scrollbar-thumb:hover { background: var(--sheet-ghost); }
        .sheet-wrap::-webkit-scrollbar-button { display: none; }
        .sheet-wrap::-webkit-scrollbar-corner { background: transparent; }
    
        table.sheet {
          width: 100%;
          border-collapse: collapse;
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 12.5px;
          background: var(--sheet-bg);
        }
        table.sheet thead th {
          position: sticky;
          top: 0;
          background: var(--sheet-header-bg);
          color: var(--sheet-text);
          font-weight: 700;
          text-align: left;
          padding: 7px 10px;
          border-bottom: 2px solid var(--sheet-border);
          border-right: 1px solid var(--sheet-border);
          white-space: nowrap;
          z-index: 1;
        }
        table.sheet thead th:last-child { border-right: none; }
        table.sheet tbody td {
          padding: 0;
          border-bottom: 1px solid var(--sheet-border);
          border-right: 1px solid var(--sheet-border);
          color: var(--sheet-text);
        }
        table.sheet tbody td:last-child { border-right: none; }
        table.sheet tbody tr:nth-child(even) td { background: var(--sheet-row-alt); }
        table.sheet tbody tr:hover td { background: var(--sheet-row-hover); }
        table.sheet tbody tr.is-empty-row td { color: var(--sheet-ghost); }
        table.sheet tbody tr.is-invalid td { background: rgba(248,113,113,0.14) !important; }
    
        table.sheet input, table.sheet select, table.sheet textarea {
          width: 100%;
          border: none;
          background: transparent;
          padding: 7px 10px;
          font: inherit;
          color: var(--sheet-text);
          outline: none;
        }
        table.sheet input:focus, table.sheet select:focus, table.sheet textarea:focus {
          background: #fff8e1;
          box-shadow: inset 0 0 0 2px var(--sheet-focus);
        }
        table.sheet input[type="number"] { text-align: right; }
        /* gaps take decimals (1.5): no spin arrows, the mouse wheel does not change them */
        table.sheet input.gap { -moz-appearance: textfield; }
        table.sheet input.gap::-webkit-inner-spin-button, table.sheet input.gap::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        table.sheet select { cursor: pointer; }
        .pick-btn { min-width: 150px; }
        .pick-btn.handle-btn { min-width: 76px; min-height: 30px; }
        .pick-btn.handle-btn:hover { background: var(--sheet-row-hover); }
        .picker .picker-list { display: grid; grid-template-columns: repeat(2, auto); gap: 2px 14px; }
        .picker.one-col .picker-list { grid-template-columns: auto; }
        .pick-btn { width: 100%; border: none; background: transparent; padding: 7px 10px; font: inherit; color: var(--sheet-text);
          text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pick-btn.empty { color: var(--sheet-ghost); }
        .pick-btn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--sheet-focus); background: #fff8e1; }
        .picker { position: fixed; z-index: 50; background: var(--sheet-bg); color: var(--sheet-text); border: 1px solid var(--sheet-border);
          border-radius: 6px; box-shadow: 0 8px 24px rgba(15,23,42,.35); padding: 6px;
          font: 13px ui-monospace, Menlo, Consolas, monospace; }
        .picker label { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
        .picker label:hover { background: var(--sheet-row-hover); }
        .picker .picker-title { grid-column: 1 / -1; font: 600 11px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--sheet-text-muted); padding: 6px 6px 2px; }
    
        td.col-actions { width: 56px; text-align: center; padding: 0 !important; white-space: nowrap; }
        td.col-actions button {
          width: 26px; height: 100%; border: none; background: transparent;
          color: var(--sheet-ghost); cursor: pointer; font-size: 15px; line-height: 1; padding: 7px 0;
        }
        td.col-actions button.row-insert:hover { color: var(--accent-hover); background: rgba(56,189,248,0.12); }
        td.col-actions button.row-del:hover { color: var(--danger); background: rgba(248,113,113,0.1); }
    
        table.sheet.output td { padding: 7px 10px; }
        table.sheet.output.spacy td { padding: 10px 14px; }
        table.sheet.output td strong { color: #0f172a; }
    
        .hidden-file-input { display: none; }

        /* Notes */
        table.sheet td.col-note input { font-family: system-ui, -apple-system, sans-serif; min-width: 180px; }
        table.sheet td.col-note input::placeholder { color: var(--sheet-ghost); }
        table.sheet td.col-note textarea {
          font-family: system-ui, -apple-system, sans-serif; width: 100%; min-width: 120px;
          resize: none; overflow: hidden; line-height: 1.35; display: block;
          field-sizing: content;   /* row height follows the text (browsers that support it) */
        }
        .notes-wrap { max-height: none; }
        #svg-footnote .fn-note { color: var(--accent-hover); }
    
        @media (max-width: 900px) {
          .input-grid { grid-template-columns: 1fr; }
        }
  </style>
</head>
<body>

<div x-data="kitchenApp()">

  <h1>Kitchen Elevation Layout</h1>

  <div id="action-bar">
    <div class="action-group">
      <button class="btn secondary" @click="chooseImportFile()" title="Load a data.js (or .json) file into the tables">Import data</button>
      <button class="btn" @click="exportData()" title="Save the tables as data.js">Export data</button>
      <input type="file" class="hidden-file-input" accept=".js,.json,text/javascript,application/json" x-ref="importFile" @change="importFile($event)">
    </div>
    <div class="action-group">
    </div>
  </div>

  <div id="status-banner" :class="{show: status.type !== '', error: status.type === 'error', ok: status.type === 'ok'}" x-text="status.message"></div>

  <!-- 1. INPUT -->
  <div class="panel">
    <h3>Input Data</h3>
    <div class="input-grid">
      <div class="sub-section">
        <h4>Groups &amp; Columns</h4>
        <div class="sheet-wrap" @scroll="picker.row = null">
          <table class="sheet">
            <thead>
              <tr><th style="width:60px">Group</th><th>Width</th><th class="col-actions"></th></tr>
            </thead>
            <tbody x-ref="columnsTbody">
              <template x-for="(row, idx) in columns" :key="row.id">
                <tr :class="{'is-invalid': build.columnFlags[idx] === 'invalid', 'is-empty-row': build.columnFlags[idx] === 'empty'}">
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.group"></td>
                  <td><input type="number" class="cell" min="0" step="1" x-model.number="row.width"></td>
                  <td class="col-actions">
                    <button type="button" class="row-insert" title="Insert row below (clones current)" @click="insertColumnRow(idx)">+</button><button type="button" class="row-del" title="Delete row" @click="removeColumnRow(idx)">×</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
      <div class="sub-section">
        <h4>Components</h4>
        <div class="sheet-wrap" @scroll="picker.row = null">
          <table class="sheet">
            <thead>
              <tr>
                <th style="width:56px">Group</th>
                <th style="width:52px">Col</th>
                <th style="width:52px">Span</th>
                <th style="width:170px" title="One type (radio) + any features (tick boxes)">Tags</th>
                <th style="width:70px" title="Carcass name: components with the same name are one carcass (empty = no carcass)">Carcass</th>
                <th style="width:70px">Height</th>
                <th style="width:84px" title="Handle position on the front">Handle</th>
                <th style="width:46px" title="Front gap left (mm)">Gap L</th>
                <th style="width:46px" title="Front gap right (mm)">Gap R</th>
                <th style="width:46px" title="Front gap top (mm)">Gap T</th>
                <th style="width:46px" title="Front gap bottom (mm)">Gap B</th>
                <th>Notes</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody x-ref="componentsTbody">
              <template x-for="(row, idx) in components" :key="row.id">
                <tr :class="{'is-invalid': build.componentFlags[idx] === 'invalid', 'is-empty-row': build.componentFlags[idx] === 'empty'}">
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.group"></td>
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.col"></td>
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.span"></td>
                  <td><button type="button" class="pick-btn" :class="{empty: !row.tags}" @click="openPicker(row, $event)" x-text="row.tags || '—'"></button></td>
                  <td><input type="text" class="cell" spellcheck="false" placeholder="—" x-model="row.carcass"></td>
                  <td><input type="number" class="cell" min="0" step="1" x-model.number="row.height"></td>
                  <td>
                    <template x-if="isFront(row)"><button type="button" class="pick-btn handle-btn" title="Handle position" @click="openPicker(row, $event, 'handle')" x-text="row.handle ? HANDLE_NAMES[row.handle] || row.handle : ''"></button></template>
                  </td>
                  <td><input type="number" class="cell gap" min="0" step="any" inputmode="decimal" x-model.number="row.gapLeft" @wheel="$event.target.blur()"></td>
                  <td><input type="number" class="cell gap" min="0" step="any" inputmode="decimal" x-model.number="row.gapRight" @wheel="$event.target.blur()"></td>
                  <td><input type="number" class="cell gap" min="0" step="any" inputmode="decimal" x-model.number="row.gapTop" @wheel="$event.target.blur()"></td>
                  <td><input type="number" class="cell gap" min="0" step="any" inputmode="decimal" x-model.number="row.gapBottom" @wheel="$event.target.blur()"></td>
                  <td class="col-note"><input type="text" class="cell" x-model="row.note"></td>
                  <td class="col-actions">
                    <button type="button" class="row-insert" title="Insert row below (clones current)" @click="insertComponentRow(idx)">+</button><button type="button" class="row-del" title="Delete row" @click="removeComponentRow(idx)">×</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ONE picker popup for a component row: either the handle or the tags (fixed position, so the table scroll cannot clip it) -->
  <div class="picker" :class="{'one-col': picker.mode === 'handle'}" x-show="picker.row" x-cloak :style="`left:${picker.x}px; top:${picker.y}px`"
       @click.outside="if (!$event.target.closest('.pick-btn')) picker.row = null" @keydown.escape.window="picker.row = null">
    <template x-if="picker.row && picker.mode === 'handle'">
      <div class="picker-list">
        <div class="picker-title">handle</div>
        <template x-for="h in HANDLE_POSITIONS" :key="h || 'none'">
          <label><input type="radio" name="handle-pos" :checked="(picker.row.handle || '') === h" @change="picker.row.handle = h; picker.row = null"> <span x-text="HANDLE_NAMES[h]"></span></label>
        </template>
      </div>
    </template>
    <template x-if="picker.row && picker.mode === 'tags'">
      <div class="picker-list">
        <div class="picker-title">type</div>
        <template x-for="t in TYPE_TAGS" :key="t">
          <label><input type="radio" name="tag-type" :checked="typeOf(picker.row) === t" @change="setType(picker.row, t)"> <span x-text="t"></span></label>
        </template>
        <div class="picker-title">features</div>
        <template x-for="f in FEATURE_TAGS" :key="f">
          <label><input type="checkbox" :checked="hasFeature(picker.row, f)" @change="toggleFeature(picker.row, f)"> <span x-text="f"></span></label>
        </template>
      </div>
    </template>
  </div>

  <div id="data-issues" x-show="build.warnings.length" x-cloak>
    <b x-text="build.warnings.length + (build.warnings.length === 1 ? ' issue' : ' issues') + ' in the data'"></b>
    <ul><template x-for="(w, i) in build.warnings" :key="i"><li x-text="w"></li></template></ul>
  </div>

  <!-- 2. SVG DIAGRAM -->
  <div id="svg-container" x-ref="svgContainer" @mouseover="onSvgHover($event)" @mousemove="onSvgMove($event)" @mouseleave="onSvgLeave()">
    <div id="svg-canvas" x-ref="svgCanvas" x-show="!build.isEmpty" x-html="build.svg"></div>
    <div x-show="build.isEmpty" style="padding:60px 20px;text-align:center;color:#94a3b8;">No layout yet — add some groups &amp; columns and components in the tables above.</div>
    <div id="tooltip" x-show="tooltip.show" :style="`left:${tooltip.x}px; top:${tooltip.y}px`" x-text="tooltip.text"></div>
    <div id="svg-footnote" x-show="!build.isEmpty" x-text="hoverInfo"></div>
  </div>

  <!-- 3. GENERAL NOTES -->
  <div class="panel">
    <h3>General Notes</h3>
    <div class="sheet-wrap notes-wrap">
      <table class="sheet">
        <thead>
          <tr>
            <th style="width:200px">Name</th>
            <th>Description</th>
            <th>Details</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody x-ref="notesTbody">
          <template x-for="(n, idx) in notes" :key="n.id">
            <tr :class="{'is-empty-row': isRowEmpty(n.name, n.description, n.details)}">
              <td class="col-note"><textarea class="cell" rows="1" x-model="n.name" x-init="$nextTick(() => autoGrow($el))" @input="autoGrow($el)"></textarea></td>
              <td class="col-note"><textarea class="cell" rows="1" x-model="n.description" x-init="$nextTick(() => autoGrow($el))" @input="autoGrow($el)"></textarea></td>
              <td class="col-note"><textarea class="cell" rows="1" x-model="n.details" x-init="$nextTick(() => autoGrow($el))" @input="autoGrow($el)"></textarea></td>
              <td class="col-actions">
                <button type="button" class="row-insert" title="Insert row below" @click="insertNoteRow(idx)">+</button><button type="button" class="row-del" title="Delete row" @click="removeNoteRow(idx)">×</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<!-- DESIGN CONFIG (JSON): how this page draws the elevations - sizes in SVG units (1 = 1 mm), colours -->
<script type="application/json" id="design-config">
{
 "scale": 1,
 "frameThickness": 50,
 "groupGap": 100,
 "viewBoxMargin": 40,
 "colors": {
  "canvasBg": "#f8fafc",
  "filler": "#cbd5e1",
  "fillerStroke": "#1e293b",
  "worktop": "#f3c48b",
  "worktopStroke": "#a86c32",
  "splash": "#ead7b4",
  "splashStroke": "#a86c32",
  "board": "#e7e5e4",
  "boardStroke": "#78716c",
  "frame": "#bfdbfe",
  "frameStroke": "#1e293b",
  "plinth": "#b4bfcc",
  "plinthStroke": "#1e293b",
  "frontOuter": "#bfdbfe",
  "frontOuterStroke": "#1e293b",
  "frontInner": "#dbeafe",
  "frontInnerStroke": "#64748b",
  "handle": "#d97706",
  "handleStroke": "#78350f",
  "applianceBody": "#e2e8f0",
  "applianceBodyStroke": "#1e293b",
  "applianceGlass": "#94a3b8",
  "applianceGlassStroke": "#475569",
  "applianceTrim": "#cbd5e1",
  "applianceTrimStroke": "#475569",
  "controlPanel": "#334155",
  "controlPanelStroke": "#1e293b",
  "knob": "#64748b",
  "glassBlack": "#1c1f24",
  "panelBlack": "#0d0f12",
  "applianceEdge": "#000000",
  "glassWindow": "#2b313a",
  "knobMetal": "#a1a7b0",
  "handleMetal": "#c4c9cf",
  "display": "#06080a",
  "displayText": "#7dd3fc"
 },
 "handle": {
  "thickness": 16,
  "edgeOffset": 20,
  "minSpan": 30,
  "maxSpan": 80
 }
}
</script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
'use strict';

/* ===================================================================
   design.html - the editor of data.js, with 2D elevations of every group.

   WHO DOES WHAT
     data.js     the project (rules, notes, columns, components)
     engine.js   stacks the components in their columns (stack) and joins items into carcasses (carcassAreas);
                 it draws nothing
     this page   the tables (Alpine.js), the checks of each table row and the SVG drawing of the elevations
                 (section 4 below); Export data writes the tables back as data.js

   SECTIONS
     1. settings      drawing config (#design-config), tag lists from engine.js
     2. utilities     number parsing, escaping, file download
     3. layout        table rows -> positioned items (engine.js stack), one group after the other
     4. SVG           positioned items -> SVG markup
     5. elevations    table rows -> checks + layout + SVG, the one call the page makes
     6. page          Alpine component: tables, picker, import / export, hover info
   Field names follow engine.js (see its GLOSSARY): group, col, span, height, type, tags, carcass, handle, gaps, note.
   =================================================================== */

/* ---------- 1. settings ---------- */
const KE = window.KitchenEngine || null;
// how this page draws the elevations: the JSON block #design-config (scale, frame width, group gap, colours, handle size)
const CONFIG = JSON.parse(document.getElementById('design-config').textContent);
const ENGINE_MISSING = 'engine.js not found next to this page - keep design.html, cost.html, view.html, engine.js and data.js together in one folder.';
const DATA_MISSING = 'data.js not found next to this page - keep design.html, cost.html, view.html, engine.js and data.js together in one folder.';

// tags: exactly one type + any features (engine.js); without engine.js the page shows an error instead of failing
const TYPE_TAGS = KE ? KE.TYPE_TAGS : [];
const FEATURE_TAGS = KE ? KE.FEATURE_TAGS : [];
const FRONT_TYPES = KE ? KE.FRONT_TYPES : ['cabinet', 'drawer', 'dummy'];
const BOX_TYPES = KE ? KE.BOX_TYPES : [];
const parseTags = KE ? KE.parseTags : () => ({ tags: [], types: [], type: null, features: [], unknown: [] });
const HANDLE_POSITIONS = ['', 'T', 'B', 'L', 'R'];
const HANDLE_NAMES = { '': 'none', T: 'top', B: 'bottom', L: 'left', R: 'right' };

/* ---------- 2. utilities (nothing kitchen-specific) ---------- */
function isRowEmpty(...values) {
  return values.every(v => String(v ?? '').trim() === '');
}

function escapeAttr(value) {
  return String(value ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toNum(value, isInt) {
  const s = String(value ?? '').trim();
  if (s === '') return NaN;
  return isInt ? parseInt(s, 10) : parseFloat(s);
}

function downloadBlob(content, mimeType, filename) {
  const url = URL.createObjectURL(new Blob([content], { type: mimeType }));
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/* ---------- 3. layout: where each item sits in the drawing (no colours, no SVG) ----------
   groupWidths: Map group -> column widths (mm); pieces: checked table rows with engine.js field names.
   The groups are drawn side by side, CONFIG.groupGap apart; v (height) is from the floor. */
function layoutElevations(groupWidths, pieces) {
  const scale = CONFIG.scale, groupGap = CONFIG.groupGap;
  const warnings = [], items = [];

  // x of each group in the drawing; empty groups take no room
  const groupX = new Map(), groupWidth = new Map();
  let cursor = 0;
  for (const [group, widths] of groupWidths) {
    const width = widths.reduce((a, w) => a + w * scale, 0);
    groupWidth.set(group, width);
    groupX.set(group, width > 0 ? cursor : 0);
    if (width > 0) cursor += width + groupGap;
  }

  // stacking with engine.js, group by group: an item starts on top of the stack in the columns it spans
  const piecesOfGroup = new Map();
  for (const piece of pieces) {
    if (!groupWidths.has(piece.group)) {
      warnings.push(`Component "${piece.type}" references unknown group ${piece.group}. Skipped.`);
      continue;
    }
    if (!piecesOfGroup.has(piece.group)) piecesOfGroup.set(piece.group, []);
    piecesOfGroup.get(piece.group).push({ ...piece, height: piece.height * scale, heightMm: piece.height });
  }
  for (const [group, list] of piecesOfGroup) {
    const stacked = KE.stack(groupWidths.get(group).map(w => w * scale), list);
    for (const { piece, why } of stacked.skipped) {
      warnings.push(why === 'overlap'
        ? `Component "${piece.type}" (${piece.heightMm}mm) at Group ${group}, Col ${piece.col} overlaps an existing component. Skipped.`
        : `Component "${piece.type}" at Group ${group} has an invalid column/span. Skipped.`);
    }
    for (const item of stacked.items) {
      const width = item.u1 - item.u0, widthMm = width / scale;
      const isFront = FRONT_TYPES.includes(item.type);
      const [left, right, top, bottom] = item.gaps || [0, 0, 0, 0];
      items.push({
        ...item,
        x: item.u0 + groupX.get(group),
        width,
        height: item.v1 - item.v0,
        widthMm,
        frontWidthMm: isFront ? Math.max(0, widthMm - left - right) : widthMm,
        frontHeightMm: isFront ? Math.max(0, item.heightMm - bottom - top) : item.heightMm
      });
    }
  }

  // one carcass name must stay in one group (engine.js joins the items of one name into one carcass)
  const groupOfCarcass = new Map();
  for (const group of piecesOfGroup.keys()) {
    for (const area of KE.carcassAreas(items.filter(i => i.group === group))) {
      if (groupOfCarcass.has(area.name) && groupOfCarcass.get(area.name) !== group) {
        warnings.push(`Carcass ${area.name} is used in Group ${groupOfCarcass.get(area.name)} and Group ${group} - one carcass must stay in one group.`);
      }
      groupOfCarcass.set(area.name, group);
    }
  }

  // drawing size: all groups side by side, the tallest stack
  let totalWidth = 0, groupsWithWidth = 0;
  for (const width of groupWidth.values()) {
    totalWidth += width;
    if (width > 0) groupsWithWidth++;
  }
  if (groupsWithWidth > 1) totalWidth += groupGap * (groupsWithWidth - 1);
  const totalHeight = items.reduce((h, i) => Math.max(h, i.v0 + i.height), 0);

  return { items, groupX, groupWidth, totalWidth, totalHeight, isEmpty: totalWidth <= 0 || totalHeight <= 0, warnings };
}

/* ---------- 4. SVG: positioned items -> SVG markup (the only code that uses CONFIG.colors) ----------
   Every function gets an item and y = its top edge in SVG coordinates (y grows down). */

// types drawn as a plain rectangle: fill and stroke colour names in CONFIG.colors
const RECT_COLORS = {
  filler: ['filler', 'fillerStroke'],
  board: ['board', 'boardStroke'],
  worktop: ['worktop', 'worktopStroke'],
  splash: ['splash', 'splashStroke'],
  panel: ['frame', 'frameStroke'], // same blue as frames and fronts
  frame: ['frame', 'frameStroke'],
  plinth: ['plinth', 'plinthStroke']
};

function drawRect(item, y) {
  const [fill, stroke] = RECT_COLORS[item.type];
  return `<rect fill="${CONFIG.colors[fill]}" stroke="${CONFIG.colors[stroke]}" stroke-width="2" x="${item.x}" y="${y}" width="${item.width}" height="${item.height}"/>`;
}

// front: outer rectangle + the inner panel of a shaker front (frameThickness in from every edge)
function drawFront(item, y) {
  const ft = CONFIG.frameThickness;
  const { frontOuter, frontOuterStroke, frontInner, frontInnerStroke } = CONFIG.colors;
  const outer = `<rect fill="${frontOuter}" stroke="${frontOuterStroke}" stroke-width="2" x="${item.x}" y="${y}" width="${item.width}" height="${item.height}"/>`;
  if (item.width <= ft * 2 || item.height <= ft * 2) return outer;
  const inner = `<rect fill="${frontInner}" stroke="${frontInnerStroke}" stroke-width="2" x="${item.x + ft}" y="${y + ft}" width="${item.width - ft * 2}" height="${item.height - ft * 2}"/>`;
  return outer + inner;
}

function drawHandle(item, y) {
  if (!item.handle) return '';
  const { thickness, edgeOffset, minSpan, maxSpan } = CONFIG.handle;
  const verticalSpan = Math.min(120, Math.max(minSpan, item.height - 80));
  const horizontalSpan = Math.min(maxSpan, Math.max(minSpan, item.width - 80));
  let hx, hy, hw, hh;
  switch (item.handle.toUpperCase()) {
    case 'T': hw = horizontalSpan; hh = thickness; hx = item.x + (item.width - hw) / 2; hy = y + edgeOffset; break;
    case 'B': hw = horizontalSpan; hh = thickness; hx = item.x + (item.width - hw) / 2; hy = y + item.height - edgeOffset - thickness; break;
    case 'L': hw = thickness; hh = verticalSpan; hx = item.x + edgeOffset; hy = y + (item.height - hh) / 2; break;
    case 'R':
    default: hw = thickness; hh = verticalSpan; hx = item.x + item.width - edgeOffset - thickness; hy = y + (item.height - hh) / 2; break;
  }
  return `<rect fill="${CONFIG.colors.handle}" stroke="${CONFIG.colors.handleStroke}" stroke-width="1.5" x="${hx}" y="${hy}" width="${hw}" height="${hh}"/>`;
}

// built-in oven: black glass, top control strip with a central display and two knobs, full-width bar handle, tinted glass door
function drawOven(item, y) {
  const k = CONFIG.colors, { x, width: w, height: h } = item;
  const panelH = Math.min(95, h * 0.17);
  const knobR = Math.min(17, panelH * 0.25);
  const handleY = y + panelH + 28;
  return `
    <rect fill="${k.glassBlack}" stroke="${k.applianceEdge}" stroke-width="2" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>
    <rect fill="${k.panelBlack}" x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${panelH - 8}" rx="2"/>
    <circle cx="${x + w * 0.16}" cy="${y + panelH / 2}" r="${knobR}" fill="${k.knobMetal}" stroke="${k.applianceEdge}" stroke-width="1.5"/>
    <circle cx="${x + w * 0.84}" cy="${y + panelH / 2}" r="${knobR}" fill="${k.knobMetal}" stroke="${k.applianceEdge}" stroke-width="1.5"/>
    <rect fill="${k.display}" x="${x + w / 2 - 70}" y="${y + panelH / 2 - 14}" width="140" height="28" rx="3"/>
    <text x="${x + w / 2}" y="${y + panelH / 2 + 7}" fill="${k.displayText}" font-family="monospace" font-size="20" text-anchor="middle">12:00</text>
    <rect fill="${k.handleMetal}" stroke="${k.applianceEdge}" stroke-width="1" x="${x + w * 0.1}" y="${handleY}" width="${w * 0.8}" height="16" rx="8"/>
    <rect fill="${k.glassWindow}" stroke="${k.applianceEdge}" stroke-width="1" x="${x + 70}" y="${handleY + 50}" width="${w - 140}" height="${Math.max(0, y + h - handleY - 100)}" rx="10"/>
  `;
}

// built-in microwave: black glass, window on the left, control column on the right with display and touch buttons, no handle
function drawMicro(item, y) {
  const k = CONFIG.colors, { x, width: w, height: h } = item;
  const panelW = Math.min(150, w * 0.25);
  const winX = x + 40, winY = y + 45, winW = w - panelW - 80, winH = h - 90;
  const px = x + w - panelW;
  return `
    <rect fill="${k.glassBlack}" stroke="${k.applianceEdge}" stroke-width="2" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>
    <rect fill="${k.glassWindow}" stroke="${k.applianceEdge}" stroke-width="1" x="${winX}" y="${winY}" width="${Math.max(0, winW)}" height="${Math.max(0, winH)}" rx="8"/>
    <line x1="${px}" y1="${y + 10}" x2="${px}" y2="${y + h - 10}" stroke="${k.applianceEdge}" stroke-width="1.5"/>
    <rect fill="${k.display}" x="${px + 18}" y="${y + 40}" width="${panelW - 36}" height="34" rx="3"/>
    <text x="${px + panelW / 2}" y="${y + 64}" fill="${k.displayText}" font-family="monospace" font-size="20" text-anchor="middle">0:30</text>
    ${[0, 1, 2].map(i => `<circle cx="${px + panelW / 2}" cy="${y + 120 + i * 55}" r="12" fill="none" stroke="${k.knobMetal}" stroke-width="2"/>`).join('')}
    <rect fill="none" stroke="${k.knobMetal}" stroke-width="2" x="${px + panelW / 2 - 28}" y="${y + h - 60}" width="56" height="26" rx="4"/>
  `;
}

// one drawing function per type
const DRAW = {
  filler: drawRect,
  board: drawRect,
  worktop: drawRect,
  splash: drawRect,
  panel: drawRect,
  frame: drawRect,
  plinth: drawRect,
  cabinet: (item, y) => drawFront(item, y) + drawHandle(item, y),
  drawer: (item, y) => drawFront(item, y) + drawHandle(item, y),
  dummy: (item, y) => drawFront(item, y) + drawHandle(item, y),
  oven: drawOven,
  micro: drawMicro
};

// one item as an SVG group; its data-* attributes (data.js short keys) feed the hover info
function drawItem(item, totalHeight, warnings) {
  const y = totalHeight - item.v0 - item.height;
  const draw = DRAW[item.type];
  if (!draw) {
    warnings.push(`Unknown component type "${item.type}" - not rendered.`);
    return '';
  }
  return `<g class="component-group" data-g="${item.group}" data-c="${item.col}" data-s="${item.span}" data-tags="${escapeAttr(item.tags)}" data-k="${escapeAttr(item.carcassName)}" data-w="${item.widthMm}" data-h="${item.heightMm}" data-fw="${item.frontWidthMm}" data-fh="${item.frontHeightMm}" data-gaps="${(item.gaps || []).join(' ')}" data-type="${item.type}" data-note="${escapeAttr(item.note)}">${draw(item, y)}</g>`;
}

function drawSVG(layout) {
  if (layout.isEmpty) return '';
  const margin = CONFIG.viewBoxMargin;
  const viewBox = `-${margin} -${margin} ${layout.totalWidth + margin * 2} ${layout.totalHeight + margin * 2}`;
  const backgrounds = [...layout.groupWidth]
    .map(([group, width]) => `<rect fill="${CONFIG.colors.canvasBg}" x="${layout.groupX.get(group)}" y="0" width="${width}" height="${layout.totalHeight}"/>`)
    .join('');
  const shapes = layout.items.map(item => drawItem(item, layout.totalHeight, layout.warnings)).join('');
  return `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}" role="img" aria-label="Kitchen elevation layout diagram">
      ${backgrounds}
      ${shapes}
    </svg>`;
}

/* ---------- 5. elevations: table rows -> checks, layout and SVG ----------
   columnRows, componentRows: the rows bound to the tables. Returns the SVG, the warnings and a flag per row
   ('empty' | 'invalid' | null) for the row colours. */
function buildElevations(columnRows, componentRows) {
  const warnings = [];
  const columnFlags = columnRows.map(() => null);
  const componentFlags = componentRows.map(() => null);

  const groupWidths = new Map();
  columnRows.forEach((row, idx) => {
    if (isRowEmpty(row.group, row.width)) { columnFlags[idx] = 'empty'; return; }
    const group = toNum(row.group, true), width = toNum(row.width, false);
    if (!Number.isFinite(group) || group < 1 || !Number.isFinite(width) || width < 0) {
      columnFlags[idx] = 'invalid';
      warnings.push(`Groups & Columns row ${idx + 1}: Group must be ≥1 and Width ≥0.`);
      return;
    }
    if (!groupWidths.has(group)) groupWidths.set(group, []);
    groupWidths.get(group).push(width);
  });

  const pieces = [];
  componentRows.forEach((row, idx) => {
    if (isRowEmpty(row.group, row.col, row.span, row.height)) { componentFlags[idx] = 'empty'; return; }
    const rowName = `Components row ${idx + 1}`;
    const invalid = message => { componentFlags[idx] = 'invalid'; warnings.push(`${rowName}: ${message}`); };
    const group = toNum(row.group, true), col = toNum(row.col, true), span = toNum(row.span, true), height = toNum(row.height, false);
    const parsed = parseTags(row.tags), type = parsed.type;
    const gapTexts = [row.gapLeft, row.gapRight, row.gapTop, row.gapBottom].map(v => String(v ?? '').trim());
    const gaps = gapTexts.some(v => v !== '') ? gapTexts.map(v => toNum(v, false)) : null;
    if (!Number.isFinite(group) || group < 1 || !Number.isFinite(col) || col < 1 ||
        !Number.isFinite(span) || span < 1 || !Number.isFinite(height) || height < 0 ||
        (gaps && gaps.some(g => !Number.isFinite(g) || g < 0))) {
      return invalid('Group/Col/Span ≥1, Height ≥0 and all 4 gaps ≥0 required.');
    }
    if (!type) {
      return invalid(`Tags need exactly one type: ${TYPE_TAGS.join(', ')}${parsed.types.length ? ' (found ' + parsed.types.join(' + ') + ')' : ''}.`);
    }
    const isFront = FRONT_TYPES.includes(type);
    if (row.handle && !isFront) warnings.push(`${rowName}: a ${type} cannot have a handle.`);
    if (parsed.unknown.length) warnings.push(`${rowName}: unknown tag ${parsed.unknown.join(', ')} (known: ${[...TYPE_TAGS, ...FEATURE_TAGS].join(', ')}).`);
    const carcassName = String(row.carcass ?? '').trim();
    if (!carcassName && BOX_TYPES.includes(type) && !parsed.tags.includes('dishwasher')) warnings.push(`${rowName}: ${type} has no carcass name.`);
    if (isFront && !gaps) return invalid(`a ${type} front needs 4 gaps (L, R, T, B).`);
    pieces.push({
      group, col, span, height, type, tags: parsed.tags.join(' '), carcassName,
      handle: row.handle || null, gaps: isFront ? gaps : null, note: String(row.note ?? '').trim()
    });
  });

  const layout = layoutElevations(groupWidths, pieces);
  const svg = drawSVG(layout);
  warnings.push(...layout.warnings);
  return { svg, isEmpty: layout.isEmpty, warnings, columnFlags, componentFlags };
}

/* ---------- data.js <-> table rows ---------- */
let loadedProject = null; // the project as loaded: keeps the part this page does not edit (rules) for Export data

// project JSON in the same layout as data.js: one note / component per line, a blank line between groups
function projectJSON(project) {
  const J = KE.json1;
  const lines = list => list.map(x => '  ' + J(x)).join(',\n');
  const components = project.components.map((c, i) => (i && c.g !== project.components[i - 1].g ? '\n' : '') + '  ' + J(c)).join(',\n');
  return '{\n "rules": {\n' + Object.entries(project.rules || {}).map(([k, v]) => '  ' + J(k) + ': ' + J(v)).join(',\n') +
    '\n },\n "notes": [\n' + lines(project.notes) +
    '\n ],\n "columns": {\n' + Object.entries(project.columns).map(([g, w]) => '  ' + J(g) + ': ' + J(w)).join(',\n') +
    '\n },\n "components": [\n' + components + '\n ]\n}\n';
}

// data.js components -> component table rows (data.js short keys -> row field names)
function componentRow(c) {
  const gaps = Array.isArray(c.gaps) ? c.gaps : ['', '', '', ''];
  return {
    group: c.g, col: c.c, span: c.s, tags: c.tags, carcass: c.k || '', height: c.h, handle: c.hd ?? '',
    gapLeft: gaps[0], gapRight: gaps[1], gapTop: gaps[2], gapBottom: gaps[3], note: c.note || ''
  };
}

// component table row -> data.js component (short keys, in the order data.js uses)
function dataComponent(row) {
  const asNumber = v => (v === '' || v == null ? '' : Number(v));
  const parsed = parseTags(row.tags);
  const c = { g: Number(row.group), c: Number(row.col), s: Number(row.span), tags: parsed.tags.join(' '), k: String(row.carcass ?? '').trim(), h: Number(row.height), hd: row.handle || '' };
  if (FRONT_TYPES.includes(parsed.type)) c.gaps = [row.gapLeft, row.gapRight, row.gapTop, row.gapBottom].map(asNumber);
  if (String(row.note ?? '').trim()) c.note = String(row.note).trim();
  return c;
}

/* ---------- 6. page: Alpine component (tables, picker, status, hover info, import / export) ---------- */
document.addEventListener('alpine:init', () => {
  Alpine.data('kitchenApp', () => ({
    columns: [],
    components: [],
    notes: [],
    status: { message: '', type: '' }, // message under the buttons: Import data / Export data / loading
    tooltip: { show: false, x: 0, y: 0, text: '' },
    hoverInfo: 'Hover a component in the diagram to see its dimensions.',
    picker: { row: null, mode: 'tags', x: 0, y: 0 }, // one popup for a component row: its tags or its handle
    nextId: 1,
    TYPE_TAGS,
    FEATURE_TAGS,
    HANDLE_NAMES,
    HANDLE_POSITIONS,
    isRowEmpty,
    _statusTimer: null,

    init() {
      if (!KE) { this.showStatus(ENGINE_MISSING, true); return; }
      KE.load()
        .then(project => {
          this.setProject(project);
          this.ensureEmptyRows();
        })
        .catch(() => this.showStatus(DATA_MISSING, true));
      this.$nextTick(() => {
        let width = 0;
        new ResizeObserver(entries => {
          const w = Math.round(entries[0].contentRect.width);
          if (w !== width) { width = w; requestAnimationFrame(() => this.growNotes()); }
        }).observe(this.$refs.notesTbody.closest('table'));
      });
      this.$watch('notes', () => this.$nextTick(() => this.growNotes()));
      // every table keeps exactly one empty row at the end
      this.$watch('columns', () => this.keepOneEmptyRow(this.columns, r => isRowEmpty(r.group, r.width), () => this.newColumnRow()));
      this.$watch('components', () => this.keepOneEmptyRow(this.components, r => isRowEmpty(r.group, r.col, r.span, r.height), () => this.newComponentRow()));
      this.$watch('notes', () => this.keepOneEmptyRow(this.notes, r => isRowEmpty(r.name, r.description, r.details), () => this.newNoteRow()));
    },

    // the elevations of the current tables (re-built by Alpine whenever a table changes)
    get build() {
      return buildElevations(this.columns, this.components);
    },

    keepOneEmptyRow(rows, isEmpty, newRow) {
      const last = rows[rows.length - 1];
      if (last && !isEmpty(last)) rows.push(newRow());
      while (rows.length > 1 && isEmpty(rows[rows.length - 1]) && isEmpty(rows[rows.length - 2])) rows.pop();
    },
    ensureEmptyRows() {
      const lastColumn = this.columns[this.columns.length - 1];
      if (!lastColumn || !isRowEmpty(lastColumn.group, lastColumn.width)) this.columns.push(this.newColumnRow());
      const lastComponent = this.components[this.components.length - 1];
      if (!lastComponent || !isRowEmpty(lastComponent.group, lastComponent.col, lastComponent.span, lastComponent.height)) this.components.push(this.newComponentRow());
      const lastNote = this.notes[this.notes.length - 1];
      if (!lastNote || !isRowEmpty(lastNote.name, lastNote.description, lastNote.details)) this.notes.push(this.newNoteRow());
    },

    // ---- rows ----
    newColumnRow(group = '', width = '') {
      return { id: this.nextId++, group, width };
    },
    newComponentRow(fields = {}) {
      return {
        id: this.nextId++, group: '', col: '', span: '', tags: '', carcass: '', height: '', handle: '',
        gapLeft: '', gapRight: '', gapTop: '', gapBottom: '', note: '', ...fields
      };
    },
    newNoteRow(name = '', description = '', details = '') {
      return { id: this.nextId++, name, description, details };
    },
    // the project (data.js) into the three tables
    setProject(project) {
      loadedProject = project;
      this.notes = (project.notes || []).map(([name, description, details]) => this.newNoteRow(name ?? '', description ?? '', details ?? ''));
      this.columns = Object.entries(project.columns || {}).flatMap(([group, widths]) => widths.map(w => this.newColumnRow(Number(group), w)));
      this.components = (project.components || []).map(c => this.newComponentRow(componentRow(c)));
    },

    insertColumnRow(idx) {
      const current = this.columns[idx];
      this.columns.splice(idx + 1, 0, this.newColumnRow(current.group, current.width));
      this.$nextTick(() => this.$refs.columnsTbody.querySelectorAll('tr')[idx + 1]?.querySelector('input')?.focus());
    },
    removeColumnRow(idx) {
      this.columns.splice(idx, 1);
    },
    // a new component row is a copy of the current one, without its note
    insertComponentRow(idx) {
      const { id, ...fields } = this.components[idx];
      this.components.splice(idx + 1, 0, this.newComponentRow({ ...fields, note: '' }));
      this.$nextTick(() => this.$refs.componentsTbody.querySelectorAll('tr')[idx + 1]?.querySelector('input')?.focus());
    },
    removeComponentRow(idx) {
      this.components.splice(idx, 1);
    },
    insertNoteRow(idx) {
      this.notes.splice(idx + 1, 0, this.newNoteRow());
      this.$nextTick(() => this.$refs.notesTbody.querySelectorAll('tr')[idx + 1]?.querySelector('textarea')?.focus());
    },
    removeNoteRow(idx) {
      this.notes.splice(idx, 1);
    },
    autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    },
    // re-fit every note row when the table width changes (window resize, column widths, import / reload)
    growNotes() {
      this.$refs.notesTbody?.querySelectorAll('textarea').forEach(el => this.autoGrow(el));
    },

    // ---- tags and handle: picked, never typed; tags are stored as "type feature feature" ----
    typeOf(row) {
      return parseTags(row.tags).type || '';
    },
    hasFeature(row, feature) {
      return parseTags(row.tags).features.includes(feature);
    },
    isFront(row) {
      return FRONT_TYPES.includes(this.typeOf(row));
    },
    writeTags(row, type, features) {
      row.tags = [type, ...FEATURE_TAGS.filter(f => features.includes(f))].filter(Boolean).join(' ');
    },
    // a handle and the 4 gaps belong to fronts only: they are cleared when the row stops being a front
    setType(row, type) {
      this.writeTags(row, type, parseTags(row.tags).features);
      if (!FRONT_TYPES.includes(type)) {
        row.handle = '';
        row.gapLeft = row.gapRight = row.gapTop = row.gapBottom = '';
        if (this.picker.mode === 'handle') this.picker.row = null;
      }
    },
    toggleFeature(row, feature) {
      const parsed = parseTags(row.tags);
      const features = parsed.features.includes(feature) ? parsed.features.filter(f => f !== feature) : [...parsed.features, feature];
      this.writeTags(row, parsed.type || '', features);
    },
    // the popup opens below the cell, or above it when there is no room
    openPicker(row, event, mode = 'tags') {
      if (this.picker.row === row && this.picker.mode === mode) { this.picker.row = null; return; }
      const r = event.currentTarget.getBoundingClientRect();
      const popupHeight = mode === 'handle' ? 190 : 330;
      this.picker = {
        row, mode,
        x: Math.min(r.left, window.innerWidth - 260),
        y: r.bottom + popupHeight < window.innerHeight ? r.bottom + 2 : Math.max(4, r.top - popupHeight - 2)
      };
    },

    showStatus(message, isError) {
      clearTimeout(this._statusTimer);
      this.status = { message, type: isError ? 'error' : 'ok' };
      if (!isError) this._statusTimer = setTimeout(() => { this.status = { message: '', type: '' }; }, 3000);
    },

    // ---- hover info: tooltip at the cursor; the footnote keeps the last one (handy on touch screens) ----
    onSvgHover(e) {
      const group = e.target.closest('.component-group');
      if (!group) { this.tooltip.show = false; return; }
      const text = this.describeComponent(group);
      this.tooltip.text = text;
      this.tooltip.show = true;
      this.hoverInfo = text;
    },
    onSvgMove(e) {
      const group = e.target.closest('.component-group');
      if (!group) { this.tooltip.show = false; return; }
      const rect = this.$refs.svgContainer.getBoundingClientRect();
      this.tooltip.x = e.clientX - rect.left + 15;
      this.tooltip.y = e.clientY - rect.top - 35;
    },
    onSvgLeave() {
      this.tooltip.show = false;
    },
    // e.g. "G1 · col 5 · cabinet dishwasher · 600 × 720 · front 594 × 717 · gaps 3:3:3:0 · Bosch SMV4HVX00E" (gaps left:right:top:bottom)
    describeComponent(group) {
      const attr = name => group.getAttribute('data-' + name), col = +attr('c'), span = +attr('s');
      const parts = [`G${attr('g')}`, `col ${span > 1 ? col + '–' + (col + span - 1) : col}`, attr('k'), attr('tags'), `${attr('w')} × ${attr('h')}`];
      if (FRONT_TYPES.includes(attr('type'))) parts.push(`front ${attr('fw')} × ${attr('fh')}`, `gaps ${attr('gaps').split(' ').join(':')}`);
      parts.push(attr('note'));
      return parts.filter(Boolean).join(' · ');
    },

    // ---- import / export ----
    // the tables as data.js (rules kept from the loaded file)
    exportData() {
      const issues = this.build.warnings.length;
      const columns = {};
      for (const c of this.columns) {
        if (isRowEmpty(c.group, c.width)) continue;
        (columns[c.group] || (columns[c.group] = [])).push(Number(c.width));
      }
      const components = this.components.filter(c => !isRowEmpty(c.group, c.col, c.span, c.height)).map(dataComponent);
      const notes = this.notes.filter(n => !isRowEmpty(n.name, n.description, n.details)).map(n => [n.name, n.description, n.details]);
      const rules = (loadedProject && loadedProject.rules) || {};
      downloadBlob(KE.toDataJS(projectJSON({ rules, notes, columns, components })), 'text/javascript;charset=utf-8', 'data.js');
      this.showStatus('data.js exported' + (issues ? ' with ' + issues + ' data issue(s) - see the list under the tables' : '') + '. Replace the one in the kitchen folder, then reload the pages.', issues > 0);
    },
    chooseImportFile() {
      this.$refs.importFile.value = '';
      this.$refs.importFile.click();
    },
    importFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          this.importData(String(reader.result));
          this.ensureEmptyRows();
          this.showStatus(`Imported "${file.name}".`, false);
        } catch (err) {
          this.showStatus(`Import failed: ${err.message}`, true);
        } finally {
          e.target.value = '';
        }
      };
      reader.onerror = () => { this.showStatus('Could not read the file.', true); e.target.value = ''; };
      reader.readAsText(file);
    },
    // a data.js (or plain JSON) file replaces the tables; its rules are kept for Export data
    importData(text) {
      let project;
      try { project = KE.fromDataJS(text); } catch (err) { throw new Error('not valid project data (' + err.message + ').'); }
      if (!project || typeof project.columns !== 'object' || !Array.isArray(project.components)) throw new Error('this is not kitchen project data: "columns" and "components" are missing.');
      this.setProject(project);
    }
  }));
});
</script>
