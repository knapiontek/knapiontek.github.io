<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Elevation Layout</title>
  <style>
    /* =============================================================
       STYLES
       ============================================================= */
        :root {
          --bg: #0f172a;
          --panel: #1e293b;
          --accent: #38bdf8;
          --accent-hover: #7dd3fc;
          --danger: #f87171;
          --danger-hover: #fca5a5;
          --text: #f8fafc;
          --text-muted: #cbd5e1;
          --text-dim: #e2e8f0;
          --border: #334155;
          --border-soft: #475569;
          --row-hover: #334155;
    
          --sheet-bg: #ffffff;
          --sheet-header-bg: #f1f5f9;
          --sheet-border: #d8dee8;
          --sheet-text: #1e293b;
          --sheet-text-muted: #64748b;
          --sheet-row-alt: #f8fafc;
          --sheet-row-hover: #eaf4fe;
          --sheet-focus: #38bdf8;
          --sheet-ghost: #94a3b8;
        }
    
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    
        h1 { max-width: 1400px; margin: 0 auto 18px auto; font-size: 22px; }
    
        #action-bar {
          max-width: 1400px;
          margin: 0 auto 15px auto;
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          justify-content: flex-end;
          align-items: center;
        }
        .action-group { display: flex; gap: 8px; padding-left: 10px; border-left: 1px solid var(--border-soft); }
        .action-group:first-child { border-left: none; padding-left: 0; }
    
        .btn {
          background: var(--accent);
          color: var(--bg);
          border: none;
          padding: 9px 16px;
          font-size: 13px;
          font-weight: 600;
          border-radius: 6px;
          cursor: pointer;
          transition: background 0.15s ease, transform 0.1s ease;
          white-space: nowrap;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn.secondary { background: var(--border-soft); color: var(--text); }
        .btn.secondary:hover { background: #5b6b83; }
        .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn.danger:hover { background: rgba(248,113,113,0.12); color: var(--danger-hover); border-color: var(--danger-hover); }
    
        #status-banner {
          max-width: 1400px;
          margin: 0 auto 15px auto;
          display: none;
          padding: 10px 14px;
          border-radius: 6px;
          font-size: 13px;
          font-weight: 500;
        }
        #status-banner.show { display: block; }
        #data-issues { max-width: 1400px; margin: -10px auto 20px auto; padding: 10px 14px; border-radius: 6px; font-size: 13px;
          background: rgba(248,113,113,0.12); color: var(--danger-hover); border: 1px solid var(--danger); }
        #data-issues ul { margin: 6px 0 0; padding-left: 18px; }
        #data-issues li { margin: 2px 0; }
        [x-cloak] { display: none !important; }
        #status-banner.error { background: rgba(248,113,113,0.12); color: var(--danger-hover); border: 1px solid var(--danger); }
        #status-banner.ok { background: rgba(56,189,248,0.12); color: var(--accent-hover); border: 1px solid var(--accent); }
    
        #svg-container { width: 100%; max-width: 1400px; margin: 20px auto 0 auto; background: var(--panel); padding: 20px; box-sizing: border-box; border-radius: 8px; position: relative; }
        #svg-canvas { width: 100%; text-align: center; }
        svg {
          display: inline-block;
          width: auto;
          height: auto;
          max-width: 100%;
          max-height: min(70vh, 700px);
          overflow: visible;
        }
        .component-group { cursor: pointer; }
        .component-group:hover rect { filter: brightness(1.2); stroke: var(--accent) !important; stroke-width: 3px; }
        
        #tooltip {
          position: absolute;
          display: none;
          background: var(--bg);
          color: var(--accent);
          border: 2px solid var(--accent);
          padding: 6px 12px;
          font-size: 14px;
          font-weight: bold;
          border-radius: 4px;
          pointer-events: none;
          white-space: nowrap;
          z-index: 10;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        #svg-footnote {
          margin-top: 16px;
          padding-top: 12px;
          border-top: 1px solid var(--border);
          font-size: 13px;
          color: var(--text-muted);
          min-height: 18px;
          text-align: left;
        }
    
        .panel {
          max-width: 1400px;
          margin: 20px auto 0 auto;
          background: var(--panel);
          padding: 20px;
          border-radius: 8px;
          box-sizing: border-box;
        }
        .panel h3 { margin-top: 0; color: var(--accent); font-size: 16px; }
    
        .settings-bar {
          display: flex;
          gap: 20px;
          margin-bottom: 16px;
          align-items: center;
          font-size: 13px;
          color: var(--text-dim);
          background: var(--bg);
          padding: 10px 14px;
          border-radius: 6px;
          border: 1px solid var(--border);
        }
        .settings-bar label {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .settings-bar input {
          width: 90px;
          background: var(--sheet-bg);
          border: 1px solid var(--sheet-border);
          border-radius: 4px;
          padding: 5px 8px;
          color: var(--sheet-text);
          font: inherit;
          text-align: right;
        }
    
        .input-grid {
          display: grid;
          grid-template-columns: minmax(220px, 300px) 1fr;
          gap: 20px;
          align-items: start;
        }
        .sub-section h4 {
          margin: 0 0 8px 0;
          color: var(--text-dim);
          border-bottom: 1px solid var(--border-soft);
          padding-bottom: 6px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 14px;
        }
        .sub-section h4 span.total { font-size: 12px; color: var(--accent); font-weight: normal; }
    
        .sheet-wrap {
          background: var(--sheet-bg);
          border: 1px solid var(--sheet-border);
          border-radius: 6px;
          overflow: auto;
          max-height: 360px;
          /* slim scrollbars matching the light sheet: thin grey thumb, no arrows */
          scrollbar-width: thin;
          scrollbar-color: var(--sheet-ghost) transparent;
        }
        .sheet-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
        .sheet-wrap::-webkit-scrollbar-track { background: transparent; }
        .sheet-wrap::-webkit-scrollbar-thumb { background: var(--sheet-border); border-radius: 8px; border: 2px solid var(--sheet-bg); }
        .sheet-wrap::-webkit-scrollbar-thumb:hover { background: var(--sheet-ghost); }
        .sheet-wrap::-webkit-scrollbar-button { display: none; }
        .sheet-wrap::-webkit-scrollbar-corner { background: transparent; }
    
        table.sheet {
          width: 100%;
          border-collapse: collapse;
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 12.5px;
          background: var(--sheet-bg);
        }
        table.sheet thead th {
          position: sticky;
          top: 0;
          background: var(--sheet-header-bg);
          color: var(--sheet-text);
          font-weight: 700;
          text-align: left;
          padding: 7px 10px;
          border-bottom: 2px solid var(--sheet-border);
          border-right: 1px solid var(--sheet-border);
          white-space: nowrap;
          z-index: 1;
        }
        table.sheet thead th:last-child { border-right: none; }
        table.sheet tbody td {
          padding: 0;
          border-bottom: 1px solid var(--sheet-border);
          border-right: 1px solid var(--sheet-border);
          color: var(--sheet-text);
        }
        table.sheet tbody td:last-child { border-right: none; }
        table.sheet tbody tr:nth-child(even) td { background: var(--sheet-row-alt); }
        table.sheet tbody tr:hover td { background: var(--sheet-row-hover); }
        table.sheet tbody tr.is-empty-row td { color: var(--sheet-ghost); }
        table.sheet tbody tr.is-invalid td { background: rgba(248,113,113,0.14) !important; }
    
        table.sheet input, table.sheet select, table.sheet textarea {
          width: 100%;
          border: none;
          background: transparent;
          padding: 7px 10px;
          font: inherit;
          color: var(--sheet-text);
          outline: none;
        }
        table.sheet input:focus, table.sheet select:focus, table.sheet textarea:focus {
          background: #fff8e1;
          box-shadow: inset 0 0 0 2px var(--sheet-focus);
        }
        table.sheet input[type="number"] { text-align: right; }
        table.sheet select { cursor: pointer; }
        .feat-btn { min-width: 150px; }
        .feat-btn.hd-btn { min-width: 76px; min-height: 30px; }
        .feat-btn.hd-btn:hover { background: var(--sheet-row-hover); }
        .feat-pop .pop-sec { display: grid; grid-template-columns: repeat(2, auto); gap: 2px 14px; }
        .feat-pop.one-col .pop-sec { grid-template-columns: auto; }
        .feat-btn { width: 100%; border: none; background: transparent; padding: 7px 10px; font: inherit; color: var(--sheet-text);
          text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .feat-btn.empty { color: var(--sheet-ghost); }
        .feat-btn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--sheet-focus); background: #fff8e1; }
        .feat-pop { position: fixed; z-index: 50; background: var(--sheet-bg); color: var(--sheet-text); border: 1px solid var(--sheet-border);
          border-radius: 6px; box-shadow: 0 8px 24px rgba(15,23,42,.35); padding: 6px;
          font: 13px ui-monospace, Menlo, Consolas, monospace; }
        .feat-pop label { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
        .feat-pop label:hover { background: var(--sheet-row-hover); }
        .feat-pop .pop-h { grid-column: 1 / -1; font: 600 11px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--sheet-text-muted); padding: 6px 6px 2px; }
    
        td.col-actions { width: 56px; text-align: center; padding: 0 !important; white-space: nowrap; }
        td.col-actions button {
          width: 26px; height: 100%; border: none; background: transparent;
          color: var(--sheet-ghost); cursor: pointer; font-size: 15px; line-height: 1; padding: 7px 0;
        }
        td.col-actions button.row-insert:hover { color: var(--accent-hover); background: rgba(56,189,248,0.12); }
        td.col-actions button.row-del:hover { color: var(--danger); background: rgba(248,113,113,0.1); }
    
        table.sheet.output td { padding: 7px 10px; }
        table.sheet.output.spacy td { padding: 10px 14px; }
        table.sheet.output td strong { color: #0f172a; }
    
        .hidden-file-input { display: none; }

        /* Notes */
        table.sheet td.col-note input { font-family: system-ui, -apple-system, sans-serif; min-width: 180px; }
        table.sheet td.col-note input::placeholder { color: var(--sheet-ghost); }
        table.sheet td.col-note textarea {
          font-family: system-ui, -apple-system, sans-serif; width: 100%; min-width: 120px;
          resize: none; overflow: hidden; line-height: 1.35; display: block;
          field-sizing: content;   /* row height follows the text (browsers that support it) */
        }
        .notes-wrap { max-height: none; }
        #svg-footnote .fn-note { color: var(--accent-hover); }
    
        @media (max-width: 900px) {
          .input-grid { grid-template-columns: 1fr; }
        }
  </style>
</head>
<body>

<div x-data="kitchenApp()">

  <h1>Kitchen Elevation Layout</h1>

  <div id="action-bar">
    <div class="action-group">
      <button class="btn secondary" @click="triggerImport()" title="Load a data.js (or .json) file into the tables">Import data</button>
      <button class="btn" @click="saveDataJSON()" title="Save the tables as data.js">Export data</button>
      <input type="file" class="hidden-file-input" accept=".js,.json,text/javascript,application/json" x-ref="importFile" @change="handleImportFile($event)">
    </div>
    <div class="action-group">
    </div>
  </div>

  <div id="status-banner" :class="{show: bannerType !== '', error: bannerType === 'error', ok: bannerType === 'ok'}" x-text="bannerText"></div>

  <!-- 1. INPUT -->
  <div class="panel">
    <h3>Input Data</h3>
    <div class="input-grid">
      <div class="sub-section">
        <h4>Groups &amp; Columns</h4>
        <div class="sheet-wrap" @scroll="featPop.row = null">
          <table class="sheet">
            <thead>
              <tr><th style="width:60px">Group</th><th>Width</th><th class="col-actions"></th></tr>
            </thead>
            <tbody x-ref="columnsTbody">
              <template x-for="(row, idx) in columns" :key="row.id">
                <tr :class="{'is-invalid': build.colFlags[idx] === 'invalid', 'is-empty-row': build.colFlags[idx] === 'empty'}">
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.group"></td>
                  <td><input type="number" class="cell" min="0" step="1" x-model.number="row.width"></td>
                  <td class="col-actions">
                    <button type="button" class="row-insert" title="Insert row below (clones current)" @click="insertColumnRow(idx)">+</button><button type="button" class="row-del" title="Delete row" @click="removeColumnRow(idx)">×</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
      <div class="sub-section">
        <h4>Components</h4>
        <div class="sheet-wrap" @scroll="featPop.row = null">
          <table class="sheet">
            <thead>
              <tr>
                <th style="width:56px">Group</th>
                <th style="width:52px">Col</th>
                <th style="width:52px">Span</th>
                <th style="width:170px" title="One kind (radio) + any features (tick boxes)">Tags</th>
                <th style="width:70px" title="Carcass name: components with the same name are one carcass (empty = no carcass)">Carcass</th>
                <th style="width:70px">Height</th>
                <th style="width:84px" title="Handle position on the front">Handle</th>
                <th style="width:46px" title="Front gap left (mm)">Gap L</th>
                <th style="width:46px" title="Front gap right (mm)">Gap R</th>
                <th style="width:46px" title="Front gap top (mm)">Gap T</th>
                <th style="width:46px" title="Front gap bottom (mm)">Gap B</th>
                <th>Notes</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody x-ref="componentsTbody">
              <template x-for="(row, idx) in components" :key="row.id">
                <tr :class="{'is-invalid': build.compFlags[idx] === 'invalid', 'is-empty-row': build.compFlags[idx] === 'empty'}">
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.group"></td>
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.col"></td>
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.span"></td>
                  <td><button type="button" class="feat-btn" :class="{empty: !row.tags}" @click="openFeatures(row, $event)" x-text="row.tags || '—'"></button></td>
                  <td><input type="text" class="cell" spellcheck="false" placeholder="—" x-model="row.k"></td>
                  <td><input type="number" class="cell" min="0" step="1" x-model.number="row.height"></td>
                  <td>
                    <template x-if="isFront(row)"><button type="button" class="feat-btn hd-btn" title="Handle position" @click="openFeatures(row, $event, 'handle')" x-text="row.handle ? HANDLE_NAMES[row.handle] || row.handle : ''"></button></template>
                  </td>
                  <td><input type="number" class="cell" min="0" step="1" x-model.number="row.gl"></td>
                  <td><input type="number" class="cell" min="0" step="1" x-model.number="row.gr"></td>
                  <td><input type="number" class="cell" min="0" step="1" x-model.number="row.gt"></td>
                  <td><input type="number" class="cell" min="0" step="1" x-model.number="row.gb"></td>
                  <td class="col-note"><input type="text" class="cell" x-model="row.note"></td>
                  <td class="col-actions">
                    <button type="button" class="row-insert" title="Insert row below (clones current)" @click="insertComponentRow(idx)">+</button><button type="button" class="row-del" title="Delete row" @click="removeComponentRow(idx)">×</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ONE picker popup for a component row: either the handle or the tags (fixed position, so the table scroll cannot clip it) -->
  <div class="feat-pop" :class="{'one-col': featPop.mode === 'handle'}" x-show="featPop.row" x-cloak :style="`left:${featPop.x}px; top:${featPop.y}px`"
       @click.outside="if (!$event.target.closest('.feat-btn')) featPop.row = null" @keydown.escape.window="featPop.row = null">
    <template x-if="featPop.row && featPop.mode === 'handle'">
      <div class="pop-sec">
        <div class="pop-h">handle</div>
        <template x-for="h in HANDLE_POSITIONS" :key="h || 'none'">
          <label><input type="radio" name="handle-pos" :checked="(featPop.row.handle || '') === h" @change="featPop.row.handle = h; featPop.row = null"> <span x-text="HANDLE_NAMES[h]"></span></label>
        </template>
      </div>
    </template>
    <template x-if="featPop.row && featPop.mode === 'tags'">
      <div class="pop-sec">
        <div class="pop-h">kind</div>
        <template x-for="k in KIND_TAGS" :key="k">
          <label><input type="radio" name="tag-kind" :checked="kindOf(featPop.row) === k" @change="setKind(featPop.row, k)"> <span x-text="k"></span></label>
        </template>
        <div class="pop-h">features</div>
        <template x-for="f in FEATURE_TAGS" :key="f">
          <label><input type="checkbox" :checked="hasFeat(featPop.row, f)" @change="toggleFeat(featPop.row, f)"> <span x-text="f"></span></label>
        </template>
      </div>
    </template>
  </div>

  <div id="data-issues" x-show="build.warnings.length" x-cloak>
    <b x-text="build.warnings.length + (build.warnings.length === 1 ? ' issue' : ' issues') + ' in the data'"></b>
    <ul><template x-for="(w, i) in build.warnings" :key="i"><li x-text="w"></li></template></ul>
  </div>

  <!-- 2. SVG DIAGRAM -->
  <div id="svg-container" x-ref="svgContainer" @mouseover="onSvgHover($event)" @mousemove="onSvgMove($event)" @mouseleave="onSvgLeave()">
    <div id="svg-canvas" x-ref="svgCanvas" x-show="!build.isEmpty" x-html="build.svg"></div>
    <div x-show="build.isEmpty" style="padding:60px 20px;text-align:center;color:#94a3b8;">No layout yet — add some groups &amp; columns and components in the tables above.</div>
    <div id="tooltip" x-show="tooltip.show" :style="`left:${tooltip.x}px; top:${tooltip.y}px`" x-text="tooltip.text"></div>
    <div id="svg-footnote" x-show="!build.isEmpty" x-text="hoverInfo"></div>
  </div>

  <!-- 3. GENERAL NOTES -->
  <div class="panel">
    <h3>General Notes</h3>
    <div class="sheet-wrap notes-wrap">
      <table class="sheet">
        <thead>
          <tr>
            <th style="width:200px">Name</th>
            <th>Description</th>
            <th>Details</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody x-ref="notesTbody">
          <template x-for="(n, idx) in notes" :key="n.id">
            <tr :class="{'is-empty-row': isRowEmpty(n.name, n.description, n.details)}">
              <td class="col-note"><textarea class="cell" rows="1" x-model="n.name" x-init="$nextTick(() => autoGrow($el))" @input="autoGrow($el)"></textarea></td>
              <td class="col-note"><textarea class="cell" rows="1" x-model="n.description" x-init="$nextTick(() => autoGrow($el))" @input="autoGrow($el)"></textarea></td>
              <td class="col-note"><textarea class="cell" rows="1" x-model="n.details" x-init="$nextTick(() => autoGrow($el))" @input="autoGrow($el)"></textarea></td>
              <td class="col-actions">
                <button type="button" class="row-insert" title="Insert row below" @click="insertNoteRow(idx)">+</button><button type="button" class="row-del" title="Delete row" @click="removeNoteRow(idx)">×</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<!-- ===================================================================
     PROJECT DATA lives in data.js (same folder), loaded with a script tag at start; "Export data" downloads the edited tables as data.js.
       rules:      construction rules used by engine.js (carcass depth, front face, shelves, hinges, drawers ...)
       notes:      [name, description, details] - everything the drawing does not show
       columns:    group -> column widths in mm, left to right
       components: placed bottom-up within their column(s), in list order
         g group, c first column, s column span, h height mm,
         tags: exactly ONE kind - filler, plinth, worktop, frame, cabinet, drawer, oven, micro;
               + features - hob, sink, bins, dummy, dishwasher, fridge, freezer, inner;
         k carcass name (K1, K2 ...): same name = ONE carcass over all its columns; "" = no carcass
         hd handle (T|B|L|R|""), gaps (fronts only) [left, right, top, bottom] mm: front = module minus the 4 gaps, note: free text
     DATA FLOW: data.js -> engine.js (layout, carcasses, boards, fronts) -> this page, cost.html, view.html
     =================================================================== -->
<!-- DESIGN CONFIG (JSON): how this page draws the elevations - sizes in SVG units (1 = 1 mm), colours -->
<script type="application/json" id="design-config">
{
 "scale": 1,
 "frameThickness": 50,
 "groupGap": 100,
 "viewBoxMargin": 40,
 "colors": {
  "canvasBg": "#f8fafc",
  "filler": "#cbd5e1",
  "fillerStroke": "#1e293b",
  "worktop": "#f3c48b",
  "worktopStroke": "#a86c32",
  "frame": "#bfdbfe",
  "frameStroke": "#1e293b",
  "plinth": "#b4bfcc",
  "plinthStroke": "#1e293b",
  "frontOuter": "#bfdbfe",
  "frontOuterStroke": "#1e293b",
  "frontInner": "#dbeafe",
  "frontInnerStroke": "#64748b",
  "handle": "#d97706",
  "handleStroke": "#78350f",
  "applianceBody": "#e2e8f0",
  "applianceBodyStroke": "#1e293b",
  "applianceGlass": "#94a3b8",
  "applianceGlassStroke": "#475569",
  "applianceTrim": "#cbd5e1",
  "applianceTrimStroke": "#475569",
  "controlPanel": "#334155",
  "controlPanelStroke": "#1e293b",
  "knob": "#64748b",
  "glassBlack": "#1c1f24",
  "panelBlack": "#0d0f12",
  "applianceEdge": "#000000",
  "glassWindow": "#2b313a",
  "knobMetal": "#a1a7b0",
  "handleMetal": "#c4c9cf",
  "display": "#06080a",
  "displayText": "#7dd3fc"
 },
 "handle": {
  "thickness": 16,
  "edgeOffset": 20,
  "minSpan": 30,
  "maxSpan": 80
 }
}
</script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
'use strict';

/* ===================================================================
   SECTION 1 — CONFIG & SAMPLE DATA
   Colors, sizing constants, component-type lists, and the data that
   pre-fills the tables on first load. Nothing in this section runs
   any logic - it is just values other sections read from.
   =================================================================== */

const KE = window.KitchenEngine || null;
// Drawing settings of this page: the JSON block #design-config (scale, frame width, group gap, colours, handle size).
const CONFIG = KE ? KE.pageData('design-config') : {"scale": 1, "frameThickness": 50, "groupGap": 100, "viewBoxMargin": 40, "colors": {"canvasBg": "#f8fafc", "filler": "#cbd5e1", "fillerStroke": "#1e293b", "worktop": "#f3c48b", "worktopStroke": "#a86c32", "frame": "#bfdbfe", "frameStroke": "#1e293b", "plinth": "#b4bfcc", "plinthStroke": "#1e293b", "frontOuter": "#bfdbfe", "frontOuterStroke": "#1e293b", "frontInner": "#dbeafe", "frontInnerStroke": "#64748b", "handle": "#d97706", "handleStroke": "#78350f", "applianceBody": "#e2e8f0", "applianceBodyStroke": "#1e293b", "applianceGlass": "#94a3b8", "applianceGlassStroke": "#475569", "applianceTrim": "#cbd5e1", "applianceTrimStroke": "#475569", "controlPanel": "#334155", "controlPanelStroke": "#1e293b", "knob": "#64748b", "glassBlack": "#1c1f24", "panelBlack": "#0d0f12", "applianceEdge": "#000000", "glassWindow": "#2b313a", "knobMetal": "#a1a7b0", "handleMetal": "#c4c9cf", "display": "#06080a", "displayText": "#7dd3fc"}, "handle": {"thickness": 16, "edgeOffset": 20, "minSpan": 30, "maxSpan": 80}};

// Component types that are just a plain colored rectangle. Mapping each one
// to its fill/stroke pair here means the renderer needs only ONE function
// for all of them instead of near-identical copies.
const SIMPLE_RECT_TYPES = {
  filler: { fill: 'filler', stroke: 'fillerStroke' },
  worktop: { fill: 'worktop', stroke: 'worktopStroke' },
  frame: { fill: 'frame', stroke: 'frameStroke' },
  plinth: { fill: 'plinth', stroke: 'plinthStroke' }
};

// filler = wall / void, plinth = plinth board, worktop = worktop board, frame = strip between fronts,
// cabinet = hinged door front, drawer = drawer front, oven / micro = appliance.
// Tags come from engine.js: one kind tag + feature tags. Without engine.js the page shows an error instead of failing.
const ENGINE_MISSING = 'engine.js not found next to this page - keep design.html, cost.html, view.html, engine.js and data.js together in one folder.';
const KIND_TAGS = KE ? KE.KIND_TAGS : [], FEATURE_TAGS = KE ? KE.FEATURE_TAGS : [];
const parseTags = KE ? KE.parseTags : (s => ({ tags: [], kinds: [], kind: null, features: [], unknown: [] }));
const TAG_HELP = 'One kind: ' + KIND_TAGS.join(', ') + '. Features: ' + FEATURE_TAGS.join(', ') + '.';
const FRONT_TYPES = ['cabinet', 'drawer'];
const HANDLE_POSITIONS = ['', 'T', 'B', 'L', 'R'];

// Fallbacks used only when the project file leaves a setting out.

// The project lives in data.js. This turns it into the plain shape the UI binds to,
// so the app never depends on how the data file is written.
function loadProject(p) {
  p = p || { columns: {}, components: [] };
  const columns = [];
  for (const [g, widths] of Object.entries(p.columns || {})) for (const w of widths) columns.push([Number(g), w]);
  return {
    notes: (p.notes || []).map(([name, description, details]) => [name ?? '', description ?? '', details ?? '']),
    columns,
    components: (p.components || []).map(c => [c.g, c.c, c.s, c.tags, c.h, c.hd ?? '', ...(Array.isArray(c.gaps) ? c.gaps : ['', '', '', '']), c.note ?? '', c.k ?? ''])
  };
}
let RAW = null;   // project data as loaded: keeps the part this page does not edit (rules)

// project JSON in the same layout as data.js: one note / component per line
function projectJSON(p) {
  const J = v => Array.isArray(v) ? '[' + v.map(J).join(', ') + ']' : v && typeof v === 'object' ? '{' + Object.entries(v).map(([k, x]) => JSON.stringify(k) + ': ' + J(x)).join(', ') + '}' : JSON.stringify(v);
  const L = (arr, f = J) => arr.map(x => '  ' + f(x)).join(',\n');
  const comps = p.components.map((c, i) => (i && c.g !== p.components[i - 1].g ? '\n' : '') + '  ' + J(c)).join(',\n');
  return '{\n "rules": {\n' + Object.entries(p.rules || {}).map(([k, v]) => '  ' + J(k) + ': ' + J(v)).join(',\n') +
    '\n },\n "notes": [\n' + L(p.notes) + '\n ],\n "columns": {\n' + Object.entries(p.columns).map(([g, w]) => '  ' + J(g) + ': ' + J(w)).join(',\n') +
    '\n },\n "components": [\n' + comps + '\n ]\n}\n';
}

/* ===================================================================
   SECTION 2 — GENERIC UTILITIES
   Number parsing, file download. No kitchen-specific
   knowledge here - safe to reuse in any other project.
   =================================================================== */

// Generic helpers with no knowledge of kitchens, layouts, or Alpine.
// Kept separate so they're easy to test or reuse on their own.

function isRowEmpty(...vals) {
  return vals.every(v => String(v ?? '').trim() === '');
}

function escapeAttr(v) {
  return String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toNum(v, isInt) {
  const s = String(v ?? '').trim();
  if (s === '') return NaN;
  return isInt ? parseInt(s, 10) : parseFloat(s);
}

function downloadBlob(content, mimeType, filename) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}


/* ===================================================================
   SECTION 3 — LAYOUT ENGINE (pure geometry)
   Figures out where each component sits: x, y, width, height. Knows
   nothing about colors or SVG markup - that is Section 4.
   =================================================================== */

// LayoutEngine turns "groups + columns + components" into positioned boxes
// (x, y, width, height for each component). It knows nothing about how
// those boxes get drawn - that's the SVG renderer's job. Splitting the two
// apart is what used to make the old KitchenSVGBuilder class hard to follow.

class LayoutEngine {
  constructor(options = {}) {
    this.scale = options.scale ?? CONFIG.scale;
    this.groupGap = options.groupGap ?? CONFIG.groupGap;

    this.groups = new Map();         // groupId -> { colWidths, colX }
    this.rawComponents = [];
  }

  setGroupColumns(groupId, widthsInMm) {
    const colWidths = widthsInMm.map(w => w * this.scale);
    const colX = [];
    let x = 0;
    for (const w of colWidths) { colX.push(x); x += w; }
    this.groups.set(groupId, { colWidths, colX });
  }

  addComponent(groupNum, colNum, colSpan, type, heightMm, handlePos = null, gaps = null, note = '', tags = '', k = '') {
    this.rawComponents.push({ groupNum, colNum, colSpan, type, heightMm, handlePos, gaps, note, tags, k });
  }

  // Places every component, left to right by group, bottom to top within a
  // column. Returns everything the SVG renderer needs.
  calculate() {
    const warnings = [];
    const components = [];


    const groupXOffsets = new Map();
    let cursor = 0;
    for (const [groupId, group] of this.groups) {
      const width = group.colWidths.reduce((a, b) => a + b, 0);
      groupXOffsets.set(groupId, width > 0 ? cursor : 0);
      if (width > 0) cursor += width + this.groupGap;
    }

    // stacking per group with engine.js: a piece starts on top of the stack in the columns it spans
    const byGroup = new Map();
    for (const comp of this.rawComponents) {
      if (!this.groups.has(comp.groupNum)) { warnings.push(`Component "${comp.type}" references unknown group ${comp.groupNum}. Skipped.`); continue; }
      (byGroup.get(comp.groupNum) || byGroup.set(comp.groupNum, []).get(comp.groupNum)).push({ c: comp.colNum, s: comp.colSpan, h: comp.heightMm * this.scale, comp });
    }
    for (const [groupNum, list] of byGroup) {
      const group = this.groups.get(groupNum), st = KE.stack(group.colWidths, list);
      for (const { it, why } of st.skipped) warnings.push(why === 'overlap'
        ? `Component "${it.comp.type}" (${it.comp.heightMm}mm) at Group ${groupNum}, Col ${it.c} overlaps an existing component. Skipped.`
        : `Component "${it.comp.type}" at Group ${groupNum} has an invalid column/span. Skipped.`);
      for (const it of st.items) {
        const comp = it.comp, width = it.u1 - it.u0, widthMm = width / this.scale;
        const [gl, gr, gt, gb] = comp.gaps || [0, 0, 0, 0];
        const isFront = FRONT_TYPES.includes(comp.type);
        components.push({
          groupNum, colNum: comp.colNum, colIndex: comp.colNum - 1, colSpan: comp.colSpan, type: comp.type,
          x: it.u0 + groupXOffsets.get(groupNum), yFromBottom: it.v0, width, height: it.v1 - it.v0, heightMm: comp.heightMm, widthMm,
          gaps: comp.gaps, isFront,
          frontWidthMm: isFront ? Math.max(0, widthMm - gl - gr) : widthMm, frontHeightMm: isFront ? Math.max(0, comp.heightMm - gb - gt) : comp.heightMm,
          handlePos: comp.handlePos, note: comp.note || '', tags: comp.tags || comp.type, k: comp.k || '',
          u0: it.u0, u1: it.u1, v0: it.v0, v1: it.v1, c: it.c, s: it.s, t: comp.type
        });
      }
    }

    // carcasses (engine.js): area of all components with the same carcass name; tinted when it runs over several columns
    const carcasses = [];
    for (const groupNum of byGroup.keys()) for (const A of KE.carcassAreas(components.filter(c => c.groupNum === groupNum))) {
      carcasses.push({ groupNum, name: A.name, joined: new Set(A.members.map(m => m.c + ':' + m.s)).size > 1, x: A.u0 + groupXOffsets.get(groupNum), width: A.u1 - A.u0, yFromBottom: A.v0 * this.scale, height: (A.v1 - A.v0) * this.scale });
    }
    const dup = new Map();
    for (const K of carcasses) { if (dup.has(K.name) && dup.get(K.name) !== K.groupNum) warnings.push(`Carcass ${K.name} is used in Group ${dup.get(K.name)} and Group ${K.groupNum} - one carcass must stay in one group.`); dup.set(K.name, K.groupNum); }

    // Overall canvas size: widest total across groups, tallest column anywhere.
    const groupWidths = new Map();
    let totalWidth = 0;
    let activeGroupsCount = 0;
    for (const [groupId, group] of this.groups) {
      const w = group.colWidths.reduce((a, b) => a + b, 0);
      groupWidths.set(groupId, w);
      totalWidth += w;
      if (w > 0) activeGroupsCount++;
    }
    if (activeGroupsCount > 1) totalWidth += this.groupGap * (activeGroupsCount - 1);

    let totalHeight = 0;
    for (const c of components) totalHeight = Math.max(totalHeight, c.yFromBottom + c.height);

    return {
      components,
      carcasses,
      groupWidths,
      groupXOffsets,
      totalWidth,
      totalHeight,
      isEmpty: totalWidth <= 0 || totalHeight <= 0,
      warnings
    };
  }
}

/* ===================================================================
   SECTION 4 — SVG RENDERER
   Turns positioned components (from Section 3) into SVG markup.
   Only this section touches CONFIG.colors or writes <rect>/<g> tags.
   =================================================================== */

// Everything here is a pure function: (positioned component) -> SVG string.
// No state, no layout math - that all happened in the layout engine already.

function renderSimpleRect(c, svgY, colorKey) {
  const { fill, stroke } = SIMPLE_RECT_TYPES[colorKey];
  const { [fill]: fillColor, [stroke]: strokeColor } = CONFIG.colors;
  return `<rect fill="${fillColor}" stroke="${strokeColor}" stroke-width="2" x="${c.x}" y="${svgY}" width="${c.width}" height="${c.height}"/>`;
}

function renderFront(c, svgY) {
  const ft = CONFIG.frameThickness;
  const { frontOuter, frontOuterStroke, frontInner, frontInnerStroke } = CONFIG.colors;
  const outer = `<rect fill="${frontOuter}" stroke="${frontOuterStroke}" stroke-width="2" x="${c.x}" y="${svgY}" width="${c.width}" height="${c.height}"/>`;
  if (c.width <= ft * 2 || c.height <= ft * 2) return outer;
  const inner = `<rect fill="${frontInner}" stroke="${frontInnerStroke}" stroke-width="2" x="${c.x + ft}" y="${svgY + ft}" width="${c.width - ft * 2}" height="${c.height - ft * 2}"/>`;
  return outer + inner;
}

// Appliance face = the component's own rectangle from the input table.
// The type only decides what the face looks like, never its size.
function applianceFace(c, svgY) {
  return { x: c.x, y: svgY, w: c.width, h: c.height, slot: '' };
}

// Built-in oven look: black glass, top control strip with a central
// display and two knobs, full-width bar handle, tinted glass door.
function renderOven(c, svgY) {
  const k = CONFIG.colors;
  const { x, y, w, h, slot } = applianceFace(c, svgY);
  const panelH = Math.min(95, h * 0.17);
  const knobR = Math.min(17, panelH * 0.25);
  const handleY = y + panelH + 28;
  return `${slot}
    <rect fill="${k.glassBlack}" stroke="${k.applianceEdge}" stroke-width="2" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>
    <rect fill="${k.panelBlack}" x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${panelH - 8}" rx="2"/>
    <circle cx="${x + w * 0.16}" cy="${y + panelH / 2}" r="${knobR}" fill="${k.knobMetal}" stroke="${k.applianceEdge}" stroke-width="1.5"/>
    <circle cx="${x + w * 0.84}" cy="${y + panelH / 2}" r="${knobR}" fill="${k.knobMetal}" stroke="${k.applianceEdge}" stroke-width="1.5"/>
    <rect fill="${k.display}" x="${x + w / 2 - 70}" y="${y + panelH / 2 - 14}" width="140" height="28" rx="3"/>
    <text x="${x + w / 2}" y="${y + panelH / 2 + 7}" fill="${k.displayText}" font-family="monospace" font-size="20" text-anchor="middle">12:00</text>
    <rect fill="${k.handleMetal}" stroke="${k.applianceEdge}" stroke-width="1" x="${x + w * 0.1}" y="${handleY}" width="${w * 0.8}" height="16" rx="8"/>
    <rect fill="${k.glassWindow}" stroke="${k.applianceEdge}" stroke-width="1" x="${x + 70}" y="${handleY + 50}" width="${w - 140}" height="${Math.max(0, y + h - handleY - 100)}" rx="10"/>
  `;
}

// Built-in microwave look: black glass, window on the left, control column on
// the right with display and touch buttons, push-button door (no handle).
function renderMicro(c, svgY) {
  const k = CONFIG.colors;
  const { x, y, w, h, slot } = applianceFace(c, svgY);
  const panelW = Math.min(150, w * 0.25);
  const winX = x + 40, winY = y + 45, winW = w - panelW - 80, winH = h - 90;
  const px = x + w - panelW;
  return `${slot}
    <rect fill="${k.glassBlack}" stroke="${k.applianceEdge}" stroke-width="2" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>
    <rect fill="${k.glassWindow}" stroke="${k.applianceEdge}" stroke-width="1" x="${winX}" y="${winY}" width="${Math.max(0, winW)}" height="${Math.max(0, winH)}" rx="8"/>
    <line x1="${px}" y1="${y + 10}" x2="${px}" y2="${y + h - 10}" stroke="${k.applianceEdge}" stroke-width="1.5"/>
    <rect fill="${k.display}" x="${px + 18}" y="${y + 40}" width="${panelW - 36}" height="34" rx="3"/>
    <text x="${px + panelW / 2}" y="${y + 64}" fill="${k.displayText}" font-family="monospace" font-size="20" text-anchor="middle">0:30</text>
    ${[0, 1, 2].map(i => `<circle cx="${px + panelW / 2}" cy="${y + 120 + i * 55}" r="12" fill="none" stroke="${k.knobMetal}" stroke-width="2"/>`).join('')}
    <rect fill="none" stroke="${k.knobMetal}" stroke-width="2" x="${px + panelW / 2 - 28}" y="${y + h - 60}" width="56" height="26" rx="4"/>
  `;
}

function renderHandle(c, svgY) {
  if (!c.handlePos) return '';
  const { thickness, edgeOffset, minSpan, maxSpan } = CONFIG.handle;
  const pos = c.handlePos.toUpperCase();
  const vSpan = Math.min(120, Math.max(minSpan, c.height - 80));
  const hSpan = Math.min(maxSpan, Math.max(minSpan, c.width - 80));
  let hx, hy, hw, hh;

  switch (pos) {
    case 'T': hw = hSpan; hh = thickness; hx = c.x + (c.width - hw) / 2; hy = svgY + edgeOffset; break;
    case 'B': hw = hSpan; hh = thickness; hx = c.x + (c.width - hw) / 2; hy = svgY + c.height - edgeOffset - thickness; break;
    case 'L': hw = thickness; hh = vSpan; hx = c.x + edgeOffset; hy = svgY + (c.height - hh) / 2; break;
    case 'R':
    default: hw = thickness; hh = vSpan; hx = c.x + c.width - edgeOffset - thickness; hy = svgY + (c.height - hh) / 2; break;
  }

  return `<rect fill="${CONFIG.colors.handle}" stroke="${CONFIG.colors.handleStroke}" stroke-width="1.5" x="${hx}" y="${hy}" width="${hw}" height="${hh}"/>`;
}

// Single dispatch table instead of a big switch statement. Adding a new
// component type later just means adding one entry here.
const COMPONENT_RENDERERS = {
  filler: (c, svgY) => renderSimpleRect(c, svgY, 'filler'),
  worktop: (c, svgY) => renderSimpleRect(c, svgY, 'worktop'),
  frame: (c, svgY) => renderSimpleRect(c, svgY, 'frame'),
  plinth: (c, svgY) => renderSimpleRect(c, svgY, 'plinth'),
  cabinet: (c, svgY) => renderFront(c, svgY) + renderHandle(c, svgY),
  drawer: (c, svgY) => renderFront(c, svgY) + renderHandle(c, svgY),
  oven: renderOven,
  micro: renderMicro
};

function renderComponent(c, totalHeight, warnings) {
  const svgY = totalHeight - c.yFromBottom - c.height;
  const draw = COMPONENT_RENDERERS[c.type];
  if (!draw) {
    warnings.push(`Unknown component type "${c.type}" - not rendered.`);
    return '';
  }
  const content = draw(c, svgY);
  return `<g class="component-group" data-g="${c.groupNum}" data-c="${c.colNum}" data-s="${c.colSpan}" data-tags="${escapeAttr(c.tags)}" data-k="${escapeAttr(c.k)}" data-w="${c.widthMm}" data-h="${c.heightMm}" data-fw="${c.frontWidthMm}" data-fh="${c.frontHeightMm}" data-gaps="${(c.gaps || []).join(' ')}" data-type="${c.type}" data-note="${escapeAttr(c.note)}">${content}</g>`;
}

// layout: the object returned by LayoutEngine.calculate()
function renderSVG(layout) {
  if (layout.isEmpty) return '';

  const vbMargin = CONFIG.viewBoxMargin;
  const viewBox = `-${vbMargin} -${vbMargin} ${layout.totalWidth + vbMargin * 2} ${layout.totalHeight + vbMargin * 2}`;

  const backgroundRects = [...layout.groupWidths.entries()]
    .map(([groupId, width]) => `<rect fill="${CONFIG.colors.canvasBg}" x="${layout.groupXOffsets.get(groupId)}" y="0" width="${width}" height="${layout.totalHeight}"/>`)
    .join('');

  const componentShapes = layout.components
    .map(c => renderComponent(c, layout.totalHeight, layout.warnings))
    .join('');

  return `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}" role="img" aria-label="Kitchen elevation layout diagram">
      ${backgroundRects}
      ${componentShapes}
    </svg>`;
}

/* ===================================================================
   SECTION 5 — COMPUTE LAYOUT (glue)
   Validates the raw table rows, then runs Sections 3 -> 4 -> 5 and
   packages the result for the UI. This is the one function Section 7
   calls whenever the input tables change.
   =================================================================== */

// The one function the UI calls whenever the input tables change.
// columnRows / componentRows are the raw {group, width, ...} objects bound
// to the Alpine tables - this function is what turns them into a diagram.
function computeLayout(columnRows, componentRows) {
  const warnings = [];
  const colFlags = columnRows.map(() => null);
  const compFlags = componentRows.map(() => null);
  const groupWidths = new Map();

  columnRows.forEach((row, idx) => {
    if (isRowEmpty(row.group, row.width)) { colFlags[idx] = 'empty'; return; }
    const group = toNum(row.group, true);
    const width = toNum(row.width, false);
    if (!Number.isFinite(group) || group < 1 || !Number.isFinite(width) || width < 0) {
      colFlags[idx] = 'invalid';
      warnings.push(`Groups & Columns row ${idx + 1}: Group must be ≥1 and Width ≥0.`);
      return;
    }
    if (!groupWidths.has(group)) groupWidths.set(group, []);
    groupWidths.get(group).push(width);
  });

  const comps = [];
  componentRows.forEach((row, idx) => {
    if (isRowEmpty(row.group, row.col, row.span, row.height)) { compFlags[idx] = 'empty'; return; }
    const group = toNum(row.group, true);
    const col = toNum(row.col, true);
    const span = toNum(row.span, true);
    const height = toNum(row.height, false);
    const tg = parseTags(row.tags);
    const type = tg.kind;
    const handle = row.handle || null;
    const gapRaw = [row.gl, row.gr, row.gt, row.gb].map(v => String(v ?? '').trim());
    const gaps = gapRaw.some(v => v !== '') ? gapRaw.map(v => toNum(v, false)) : null;
    if (!Number.isFinite(group) || group < 1 || !Number.isFinite(col) || col < 1 ||
        !Number.isFinite(span) || span < 1 || !Number.isFinite(height) || height < 0 ||
        (gaps && gaps.some(g => !Number.isFinite(g) || g < 0))) {
      compFlags[idx] = 'invalid';
      warnings.push(`Components row ${idx + 1}: Group/Col/Span ≥1, Height ≥0 and all 4 gaps ≥0 required.`);
      return;
    }
    if (!type) {
      compFlags[idx] = 'invalid';
      warnings.push(`Components row ${idx + 1}: Tags need exactly one of ${KIND_TAGS.join(', ')}${tg.kinds.length ? ' (found ' + tg.kinds.join(' + ') + ')' : ''}.`);
      return;
    }
    if (row.handle && !FRONT_TYPES.includes(type)) warnings.push(`Components row ${idx + 1}: a ${type} cannot have a handle.`);
    if (tg.unknown.length) warnings.push(`Components row ${idx + 1}: unknown tag ${tg.unknown.join(', ')} (known: ${[...KIND_TAGS, ...FEATURE_TAGS].join(', ')}).`);
    const k = String(row.k ?? '').trim();
    if (!k && ['cabinet', 'drawer', 'oven', 'micro'].includes(type) && !tg.tags.includes('dishwasher')) warnings.push(`Components row ${idx + 1}: ${type} has no carcass name.`);
    if (FRONT_TYPES.includes(type) && !gaps) { compFlags[idx] = 'invalid'; warnings.push(`Components row ${idx + 1}: a ${type} front needs 4 gaps (L, R, T, B).`); return; }
    comps.push({ groupNum: group, colNum: col, colSpan: span, type, heightMm: height, handlePos: handle, gaps: FRONT_TYPES.includes(type) ? gaps : null, note: String(row.note ?? '').trim(), tags: tg.tags.join(' '), k });
  });

  const engine = new LayoutEngine({ scale: CONFIG.scale });
  for (const [g, widths] of groupWidths) engine.setGroupColumns(g, widths);
  for (const c of comps) engine.addComponent(c.groupNum, c.colNum, c.colSpan, c.type, c.heightMm, c.handlePos, c.gaps, c.note, c.tags, c.k);

  const layout = engine.calculate();
  const svg = renderSVG(layout);
  warnings.push(...layout.warnings);

  return { svg, isEmpty: layout.isEmpty, warnings, colFlags, compFlags };
}

/* ===================================================================
   SECTION 6 — UI / EVENTS (Alpine component)
   All page state (table rows, status banner, tooltip) and user
   actions (import/export, add/remove rows, hover tooltip). This is
   the only section that touches the DOM or Alpine directly.
   =================================================================== */

// Alpine component: all page state (table rows, status banner, tooltip) and
// user actions (import/export, add/remove rows). Delegates the actual
// diagram math to computeLayout().

document.addEventListener('alpine:init', () => {
  Alpine.data('kitchenApp', () => ({
    columns: [],
    components: [],
    notes: [],
    status: { message: '', type: '' },
    tooltip: { show: false, x: 0, y: 0, text: '' },
    hoverInfo: 'Hover a component in the diagram to see its dimensions.',
    nextId: 1,
    CONFIG,
    TAG_HELP,
    KIND_TAGS,
    FEATURE_TAGS,
    featPop: { row: null, mode: 'tags', x: 0, y: 0 },
    HANDLE_NAMES: { '': 'none', T: 'top', B: 'bottom', L: 'left', R: 'right' },
    HANDLE_POSITIONS,
    isRowEmpty,
    _statusTimer: null,

    init() {
      if (!KE) { this.showStatus(ENGINE_MISSING, true); return; }
      KE.load().then(p => {
        RAW = p;
        this.seed(loadProject(p));
        this.ensureEmptyRows();
      }).catch(e => this.showStatus('data.js not found next to this page - keep design.html, cost.html, view.html, engine.js and data.js together in one folder.', true));
      this.$nextTick(() => {
        let w = 0;
        new ResizeObserver(entries => { const nw = Math.round(entries[0].contentRect.width); if (nw !== w) { w = nw; requestAnimationFrame(() => this.growNotes()); } })
          .observe(this.$refs.notesTbody.closest('table'));
      });
      this.$watch('notes', () => this.$nextTick(() => this.growNotes()));

      this.$watch('columns', () => {
        const last = this.columns[this.columns.length - 1];
        if (last && !isRowEmpty(last.group, last.width)) {
          this.columns.push(this.newColumnRow());
        }
        while (this.columns.length > 1 &&
               isRowEmpty(this.columns[this.columns.length - 1].group, this.columns[this.columns.length - 1].width) &&
               isRowEmpty(this.columns[this.columns.length - 2].group, this.columns[this.columns.length - 2].width)) {
          this.columns.pop();
        }
      });

      this.$watch('components', () => {
        const last = this.components[this.components.length - 1];
        if (last && !isRowEmpty(last.group, last.col, last.span, last.height)) {
          this.components.push(this.newComponentRow());
        }
        while (this.components.length > 1 &&
               isRowEmpty(this.components[this.components.length - 1].group, this.components[this.components.length - 1].col, this.components[this.components.length - 1].span, this.components[this.components.length - 1].height) &&
               isRowEmpty(this.components[this.components.length - 2].group, this.components[this.components.length - 2].col, this.components[this.components.length - 2].span, this.components[this.components.length - 2].height)) {
          this.components.pop();
        }
      });

      this.$watch('notes', () => {
        const isEmpty = n => isRowEmpty(n.name, n.description, n.details);
        const last = this.notes[this.notes.length - 1];
        if (last && !isEmpty(last)) this.notes.push(this.newNoteRow());
        while (this.notes.length > 1 && isEmpty(this.notes[this.notes.length - 1]) && isEmpty(this.notes[this.notes.length - 2])) {
          this.notes.pop();
        }
      });
    },

    get build() {
      return computeLayout(this.columns, this.components);
    },

    // under the buttons: messages of Import data / Export data / loading only; data issues are listed under the tables
    get bannerType() { return this.status.type; },
    get bannerText() { return this.status.message; },

    newColumnRow(group = '', width = '') { return { id: this.nextId++, group, width }; },
    newComponentRow(group = '', col = '', span = '', tags = '', height = '', handle = '', gl = '', gr = '', gt = '', gb = '', note = '', k = '') {
      return { id: this.nextId++, group, col, span, tags, k, height, handle, gl, gr, gt, gb, note };
    },
    newNoteRow(name = '', description = '', details = '') { return { id: this.nextId++, name, description, details }; },
    autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; },
    // re-fit every note row when the table width changes (window resize, column widths, import / reload)
    growNotes() { this.$refs.notesTbody?.querySelectorAll('textarea').forEach(el => this.autoGrow(el)); },
    insertNoteRow(idx) {
      this.notes.splice(idx + 1, 0, this.newNoteRow());
      this.$nextTick(() => this.$refs.notesTbody.querySelectorAll('tr')[idx + 1]?.querySelector('textarea')?.focus());
    },
    removeNoteRow(idx) { this.notes.splice(idx, 1); },

    seed(data) {
      this.notes = data.notes.map(([name, description, details]) => this.newNoteRow(name, description, details));
      this.columns = data.columns.map(([g, w]) => this.newColumnRow(g, w));
      this.components = data.components.map(([g, c, s, t, h, hp, gl, gr, gt, gb, note, k]) => this.newComponentRow(g, c, s, t, h, hp, gl, gr, gt, gb, note || '', k || ''));
    },

    ensureEmptyRows() {
      if (this.columns.length === 0 || !isRowEmpty(this.columns[this.columns.length - 1].group, this.columns[this.columns.length - 1].width)) {
        this.columns.push(this.newColumnRow());
      }
      if (this.components.length === 0 || !isRowEmpty(this.components[this.components.length - 1].group, this.components[this.components.length - 1].col, this.components[this.components.length - 1].span, this.components[this.components.length - 1].height)) {
        this.components.push(this.newComponentRow());
      }
      const lastNote = this.notes[this.notes.length - 1];
      if (!lastNote || !isRowEmpty(lastNote.name, lastNote.description, lastNote.details)) this.notes.push(this.newNoteRow());
    },

    insertColumnRow(idx) {
      const current = this.columns[idx];
      const cloned = this.newColumnRow(current.group, current.width);
      this.columns.splice(idx + 1, 0, cloned);
      this.$nextTick(() => this.$refs.columnsTbody.querySelectorAll('tr')[idx + 1]?.querySelector('input')?.focus());
    },
    removeColumnRow(idx) { this.columns.splice(idx, 1); },

    insertComponentRow(idx) {
      const current = this.components[idx];
      const cloned = this.newComponentRow(current.group, current.col, current.span, current.tags, current.height, current.handle, current.gl, current.gr, current.gt, current.gb, '', current.k);
      this.components.splice(idx + 1, 0, cloned);
      this.$nextTick(() => this.$refs.componentsTbody.querySelectorAll('tr')[idx + 1]?.querySelector('input')?.focus());
    },
    removeComponentRow(idx) { this.components.splice(idx, 1); },

    // tags are picked, never typed: one kind (radio) + features (tick boxes); stored as "kind feature feature"
    kindOf(row) { return parseTags(row.tags).kind || ''; },
    hasFeat(row, f) { return parseTags(row.tags).features.includes(f); },
    featText(row) { return parseTags(row.tags).features.join(' '); },
    writeTags(row, kind, feats) { row.tags = [kind, ...FEATURE_TAGS.filter(f => feats.includes(f))].filter(Boolean).join(' '); },
    isFront(row) { return FRONT_TYPES.includes(this.kindOf(row)); },
    // a handle and the 4 gaps belong to fronts only: they are cleared when the row stops being a front
    setKind(row, kind) {
      this.writeTags(row, kind, parseTags(row.tags).features);
      if (!FRONT_TYPES.includes(kind)) { row.handle = ''; row.gl = row.gr = row.gt = row.gb = ''; if (this.featPop.mode === 'handle') this.featPop.row = null; }
    },
    toggleFeat(row, f) {
      const t = parseTags(row.tags), feats = t.features.includes(f) ? t.features.filter(x => x !== f) : [...t.features, f];
      this.writeTags(row, t.kind || '', feats);
    },
    openFeatures(row, e, mode = 'tags') {
      if (this.featPop.row === row && this.featPop.mode === mode) { this.featPop.row = null; return; }
      const r = e.currentTarget.getBoundingClientRect();
      const h = mode === 'handle' ? 190 : 330;   // popup height: below the cell, or above it when there is no room
      this.featPop = { row, mode, x: Math.min(r.left, window.innerWidth - 260), y: r.bottom + h < window.innerHeight ? r.bottom + 2 : Math.max(4, r.top - h - 2) };
    },

    showStatus(message, isError) {
      clearTimeout(this._statusTimer);
      this.status = { message, type: isError ? 'error' : 'ok' };
      if (!isError) this._statusTimer = setTimeout(() => { this.status = { message: '', type: '' }; }, 3000);
    },

    onSvgHover(e) {
      const group = e.target.closest('.component-group');
      if (!group) { this.tooltip.show = false; return; }
      const text = this.describeComponent(group);
      this.tooltip.text = text;
      this.tooltip.show = true;
      // Footnote keeps showing the last-hovered component's dimensions even
      // after the mouse leaves - handy on touch devices where there's no
      // hover, and easier to read than a tooltip chasing the cursor.
      this.hoverInfo = text;
    },
    onSvgMove(e) {
      const group = e.target.closest('.component-group');
      if (!group) { this.tooltip.show = false; return; }
      const rect = this.$refs.svgContainer.getBoundingClientRect();
      this.tooltip.x = e.clientX - rect.left + 15;
      this.tooltip.y = e.clientY - rect.top - 35;
    },
    onSvgLeave() { this.tooltip.show = false; },
    // e.g. "G1 · col 5 · cabinet dishwasher · 600 × 720 · front 596 × 718 · gaps 2:2:0:2 · Bosch SMV4HVX00E"
    // (gaps left:right:top:bottom)
    describeComponent(group) {
      const A = k => group.getAttribute('data-' + k), c = +A('c'), sp = +A('s');
      const parts = [`G${A('g')}`, `col ${sp > 1 ? c + '–' + (c + sp - 1) : c}`, A('k'), A('tags'), `${A('w')} × ${A('h')}`];
      if (FRONT_TYPES.includes(A('type'))) parts.push(`front ${A('fw')} × ${A('fh')}`, `gaps ${A('gaps').split(' ').join(':')}`);
      parts.push(A('note'));
      return parts.filter(Boolean).join(' · ');
    },

    // the tables as data.js (rules kept from the loaded file)
    saveDataJSON() {
      const r = computeLayout(this.columns, this.components);
      const n = v => (v === '' || v == null ? '' : Number(v));
      const columns = {};
      this.columns.forEach(c => { if (!isRowEmpty(c.group, c.width)) (columns[c.group] || (columns[c.group] = [])).push(Number(c.width)); });
      const components = this.components.filter(c => !isRowEmpty(c.group, c.col, c.span, c.height)).map(c => {
        const o = { g: Number(c.group), c: Number(c.col), s: Number(c.span), tags: parseTags(c.tags).tags.join(' '), k: String(c.k ?? '').trim(), h: Number(c.height), hd: c.handle || '' };
        if (FRONT_TYPES.includes(parseTags(c.tags).kind)) o.gaps = [c.gl, c.gr, c.gt, c.gb].map(v => n(v));
        if (String(c.note ?? '').trim()) o.note = String(c.note).trim();
        return o;
      });
      const notes = this.notes.filter(x => !isRowEmpty(x.name, x.description, x.details)).map(x => [x.name, x.description, x.details]);
      downloadBlob(KE.toDataJS(projectJSON({ rules: (RAW && RAW.rules) || {}, notes, columns, components })), 'text/javascript;charset=utf-8', 'data.js');
      this.showStatus('data.js exported' + (r.warnings.length ? ' with ' + r.warnings.length + ' data issue(s) - see the list under the tables' : '') + '. Replace the one in the kitchen folder, then reload the pages.', r.warnings.length > 0);
    },
    triggerImport() {
      this.$refs.importFile.value = '';
      this.$refs.importFile.click();
    },
    handleImportFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          this.importData(String(reader.result));
          this.ensureEmptyRows();
          this.showStatus(`Imported "${file.name}".`, false);
        } catch (err) {
          this.showStatus(`Import failed: ${err.message}`, true);
        } finally {
          e.target.value = '';
        }
      };
      reader.onerror = () => { this.showStatus('Could not read the file.', true); e.target.value = ''; };
      reader.readAsText(file);
    },
    // a data.js (or plain JSON) file: replaces the tables; its rules are kept for Export data
    importData(text) {
      let p;
      try { p = KE.fromDataJS(text); } catch (err) { throw new Error('not valid project data (' + err.message + ').'); }
      if (!p || typeof p.columns !== 'object' || !Array.isArray(p.components)) throw new Error('this is not kitchen project data: "columns" and "components" are missing.');
      RAW = p;
      this.seed(loadProject(p));
    }
  }));
});
</script>

</body>
</html>
