<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kitchen 3D view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root { --stage: #d8dbde; --card: #fbfbfa; --ink: #1f2b45; --muted: #5b6474; --line: #d6d9de; --brass: #a87c3f; --chip: #eef0f2; --ok: #2f7d4f; --warn: #a2621a;
  --f-display: "Young Serif", Georgia, serif; --f-body: "Figtree", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage: #141a24; --card: #1b2230; --ink: #e8ecf3; --muted: #9aa5b8; --line: #2c3546; --brass: #d1a465; --chip: #232b3b; --ok: #6cc58f; --warn: #e2a35a; color-scheme: dark; } }
:root[data-theme="dark"] { --stage: #141a24; --card: #1b2230; --ink: #e8ecf3; --muted: #9aa5b8; --line: #2c3546; --brass: #d1a465; --chip: #232b3b; --ok: #6cc58f; --warn: #e2a35a; color-scheme: dark; }
* { box-sizing: border-box; } [hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--stage); color: var(--ink); font: 14px var(--f-body); }
#stage { position: fixed; inset: 0; overflow: hidden; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 16px; text-align: center; }
.title { position: absolute; top: 20px; left: 20px; pointer-events: none; }
.title h1 { font: 400 20px var(--f-display); margin: 0; opacity: .85; } .title h1 span { color: var(--brass); }
.title p { margin: 4px 0 0; font-size: 12.5px; } .title .bad { color: var(--warn); } .title .okk { color: var(--ok); }
.spec { position: absolute; top: 20px; right: 20px; width: 350px; max-height: calc(100% - 110px); overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.spec h2 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.head { display: flex; justify-content: space-between; align-items: center; } .head h2 { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
button:hover { border-color: var(--brass); } button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
#layers button[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.sw { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; } .sw i { width: 22px; height: 22px; border-radius: 50%; display: block; }
.sw[aria-pressed="true"] { background: transparent; box-shadow: inset 0 0 0 2px var(--card); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 0 16px; }
.tabs button { border: 0; border-radius: 0; background: none; padding: 8px 10px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }
.pane { display: flex; flex-direction: column; gap: 16px; }
.hint, .note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 6px 0 0; }
.okk { color: var(--ok); } .bad { color: var(--warn); }
dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-variant-numeric: tabular-nums; }
dt { color: var(--muted); } dd { margin: 0; font: 12px var(--f-mono); text-align: right; }
dl.notes dd { font: 12.5px var(--f-body); text-align: left; } dl.notes small { display: block; color: var(--muted); }
.legend { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 12px; }
.legend li { display: flex; gap: 6px; align-items: center; } .legend i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.slider { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-top: 10px; } .slider input { flex: 1; accent-color: var(--brass); }
.klist { list-style: none; margin: 0; padding: 0; }
.klist button { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; text-align: left; border-radius: 6px; border-color: transparent; background: none; padding: 4px 8px; }
.klist b, .klist em { font: 500 12px var(--f-mono); font-style: normal; }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; color: var(--muted); font-size: 10.5px; text-transform: uppercase; padding: 3px; border-bottom: 1px solid var(--line); }
table.t td { padding: 3px; border-bottom: 1px solid var(--line); } table.t td.n { font-family: var(--f-mono); text-align: right; }
ul.msgs { margin: 4px 0 0; padding-left: 16px; font-size: 12px; color: var(--muted); }
.kdet { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; } .kdet h3 { margin: 0; font: 400 18px var(--f-display); } .kdet p { margin: 4px 0; color: var(--muted); font-size: 12.5px; }
#tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-size: 12.5px; white-space: nowrap; z-index: 5; }
.dock { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; display: flex; gap: 2px; overflow-x: auto; opacity: .8; }
.dock:hover { opacity: 1; } .dock button { border-color: transparent; background: none; white-space: nowrap; font-size: 12.5px; padding: 4px 10px; }
.dock button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.toggle { position: absolute; top: 14px; right: 14px; display: none; } body.shut .spec { display: none; } body.shut .toggle { display: block; }
@media (max-width: 760px) { .title h1 { font-size: 16px; } .spec { left: 12px; right: 12px; width: auto; top: auto; bottom: 60px; max-height: 65%; } #tip { display: none; } }
</style>
</head>
<body class="shut">
<div id="stage">
  <div id="loading">Loading 3D view…</div>
  <div class="title"><h1 id="h1"></h1><p id="status"></p></div>
  <button class="toggle" id="openSpec">Settings &amp; checks</button>
  <div class="spec" id="spec">
    <div class="head"><h2>Settings</h2><button id="closeSpec">Collapse</button></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="view" aria-selected="true">View</button>
      <button role="tab" data-tab="carc" aria-selected="false">Carcasses &amp; checks</button>
      <button role="tab" data-tab="prj" aria-selected="false">Project</button>
    </div>
    <div class="pane" id="p-view">
      <section><h2>Layers</h2><div class="row" id="layers"></div>
        <div class="row" id="presets" style="margin-top:8px"><button data-preset="all">Everything</button><button data-preset="inside">No fronts or frames</button><button data-preset="carc">Carcasses only</button></div></section>
      <section><h2>Fronts</h2><div class="row"><button id="openAll">Open all</button><button id="closeAll">Close all</button></div><p class="hint">Click a front to open it, a carcass to select it.</p></section>
      <section><h2>Handles</h2><div class="row" id="metal"></div></section>
      <section><h2>Display</h2><div class="row"><button id="quality" aria-pressed="false">Lamp shadows</button><button id="edges" aria-pressed="false">Edges</button></div></section>
    </div>
    <div class="pane" id="p-carc" hidden>
      <section><h2>Geometry check</h2><p class="note" id="geoNote"></p><ul class="msgs" id="geoList"></ul></section>
      <section><h2>Design checks</h2><ul class="msgs" id="modelList"></ul></section>
      <section><h2>Summary from the model</h2><dl id="stats"></dl></section>
      <section><h2>Panels</h2><div class="row"><button id="roleBtn" aria-pressed="false">Colour by panel</button></div><ul class="legend" id="legend"></ul>
        <label class="slider">Explode <input type="range" id="explode" min="0" max="100" value="0"></label></section>
      <section id="kWrap" hidden><div class="kdet" id="kDet"></div></section>
      <section><h2>Carcasses</h2><ol class="klist" id="klist"></ol></section>
      <section><h2>Front alignment</h2><p class="note" id="alignNote"></p><table class="t" id="alignTbl"></table></section>
    </div>
    <div class="pane" id="p-prj" hidden>
      <section><h2>Dimensions in the model</h2><dl id="dims"></dl></section>
      <p class="note" id="src"></p>
      <section><h2>Project notes</h2><dl class="notes" id="pnotes"></dl></section>
    </div>
  </div>
  <div id="tip" hidden></div>
  <nav class="dock" id="views" aria-label="Views"></nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
/* =====================================================================
   KITCHEN MODEL — identical copy in kitchen_design / kitchen_cost / kitchen_view.
   Pure functions: no DOM, no prices, no scene. Input: the project JSON.
   Output: layout, carcasses, panels (with 3D boxes), fronts, hardware counts,
   quantities and checks. Cost and view both read these same parts.
   Coordinates per group, mm: u along the group from its first column,
   v up from the floor, n from the wall towards the room.
   ===================================================================== */
const KM = (() => {
'use strict';
// Construction rules (the "Carcasses", "Shelves", "Hinges", "Drawers"... notes in numbers).
// A project may override any of them with a "rules" object.
const RULES = {
  gap: 4, t: 18, t16: 16, hdf: 3,           // default front gap, board thicknesses
  depth: 550, wall: 14,                      // carcass depth; carcass back from the wall
  upperFrom: 1900, baseTop: 900, floorMax: 150,  // separate upper carcass / base carcass / stands on legs
  rail: 100, frameDepth: 100, shelfSetback: 20,
  plinthSetback: 70, plinthT: 18, wallPanelT: 10,
  hinges: [[900, 2], [1600, 3], [1e9, 4]],   // door front height below -> hinges
  shelves: [[720, 1], [1e9, 3]],             // door module height up to -> adjustable shelves
  hingeZone: 35,                             // shelves keep this far (centre to centre) from a hinge
  drawerD: 350, box: { D: 224, M: 83 }, drawerBack: { D: 199, M: 68, inner: 84 }, nl: 500,
  legs: 4, confirmat: 18, pins: 4,
  worktop: [0, 600],                         // worktop n range when the group does not give one
  board: 4100, panel: [4100, 640],           // worktop board length; wall panel board length x width
  kinds: {                                   // what a component note means (case-insensitive regex)
    dishwasher: 'dishwasher', fridge: 'fridge|freezer', dummy: 'dummy', sink: 'sink', hob: 'hob',
    bins: 'waste|bins', inner: 'inner drawer', reference: 'end-on', carcassW: 'carcass (\\d{3,4})',
    niche: 'niche\\s*([\\d\\s\\-–x×]+)'
  }
};
const TYPES = ['filler', 'plinth', 'worktop', 'frame', 'cabinet', 'drawer', 'oven', 'micro'];
const FRONTS = ['cabinet', 'drawer'], BOXED = ['cabinet', 'drawer', 'oven', 'micro'];
const num = (v, d) => { const x = parseFloat(v); return Number.isFinite(x) ? x : d; };
const r1 = x => Math.round(x * 10) / 10;

function rules(P) {
  const o = P.rules || {};
  return { ...RULES, ...o, gap: num((P.settings || {}).gapMm, o.gap ?? RULES.gap), kinds: { ...RULES.kinds, ...(o.kinds || {}) } };
}
const is = (R, kind, note) => new RegExp(R.kinds[kind], 'i').test(note || '');
// "Niche 815-875 x 600 x 550" -> [[815,875],[600,600],[550,550]] = height, width, depth
function niche(R, note) {
  const m = (note || '').match(new RegExp(R.kinds.niche, 'i'));
  if (!m) return null;
  const d = m[1].split(/[x×]/).map(s => s.trim().split(/[-–]/).map(Number).filter(Number.isFinite)).filter(a => a.length);
  return d.length === 3 ? d.map(a => [a[0], a[a.length - 1]]) : null;
}

/* ---------- 1. LAYOUT: stack components bottom-up in their columns ---------- */
function layout(P) {
  const R = rules(P), warn = [], groups = new Map();
  for (const [g, ws] of Object.entries(P.columns || {})) {
    const cols = ws.map(Number), x = [0];
    cols.forEach(w => x.push(x[x.length - 1] + w));
    groups.set(+g, { g: +g, cols, x, width: x[x.length - 1], items: [], occ: cols.map(() => []), info: (P.groups || {})[g] || {} });
  }
  const top = rs => { let y = 0; for (const [a, b] of [...rs].sort((p, q) => p[0] - q[0])) { if (a > y) break; y = Math.max(y, b); } return y; };
  (P.components || []).forEach((c, idx) => {
    const G = groups.get(+c.g), h = +c.h, i = c.c - 1, tag = `Component ${idx + 1} (G${c.g} col ${c.c} ${c.t})`;
    const bad = text => warn.push({ text: `${tag}: ${text}`, idx });
    if (!G) return bad(`group ${c.g} has no columns – skipped`);
    if (!TYPES.includes(c.t)) return bad('unknown type – skipped');
    if (!(i >= 0 && i < G.cols.length && c.s >= 1 && h > 0)) return bad('column, span or height out of range – skipped');
    let j = i + +c.s;
    if (j > G.cols.length) { bad(`span ${c.s} runs past column ${G.cols.length} – clipped`); j = G.cols.length; }
    const ks = []; for (let k = i; k < j; k++) ks.push(k);
    const v0 = Math.max(...ks.map(k => top(G.occ[k])));
    if (ks.some(k => G.occ[k].some(([a, b]) => Math.max(v0, a) < Math.min(v0 + h, b)))) return bad('overlaps a component placed earlier in the list – skipped');
    ks.forEach(k => G.occ[k].push([v0, v0 + h]));
    const front = FRONTS.includes(c.t), note = c.note || '';
    G.items.push({
      idx, g: +c.g, c: +c.c, s: j - i, t: c.t, h, hd: c.hd || '', note, u0: G.x[i], u1: G.x[j], v0, v1: v0 + h,
      gw: front ? num(c.gw, R.gap) : 0, gh: front ? num(c.gh, R.gap) : 0,
      cw: +((note.match(new RegExp(R.kinds.carcassW, 'i')) || [])[1] || 0)   // "carcass 800": carcass wider than its column
    });
  });
  for (const G of groups.values()) delete G.occ;
  return { R, groups, warn };
}

/* ---------- 2. FRONT POSITIONS ("Front alignment" note) ----------
   On a line with fronts on both sides the joint is gap/2 + gap/2; each front's own gap then fixes
   its free side (plinth, worktop, appliance). Fronts with nothing known are centred. */
function alignAxis(fr, a0, a1, gk, dflt, set) {
  const lo = new Map(), hi = new Map(), ends = new Set(fr.map(a1));
  for (const f of fr) if (ends.has(a0(f))) { lo.set(a0(f), dflt / 2); hi.set(a0(f), dflt / 2); }
  const prop = () => { for (let ch = true; ch;) { ch = false; for (const f of fr) {
    const s = a0(f), e = a1(f);
    if (lo.has(s) && !hi.has(e)) { hi.set(e, f[gk] - lo.get(s)); ch = true; }
    else if (hi.has(e) && !lo.has(s)) { lo.set(s, f[gk] - hi.get(e)); ch = true; } } } };
  prop();
  for (const f of fr) if (!lo.has(a0(f)) && !hi.has(a1(f))) { lo.set(a0(f), f[gk] / 2); hi.set(a1(f), f[gk] / 2); prop(); }
  for (const f of fr) set(f, a0(f) + lo.get(a0(f)));
}

/* ---------- 3. BUILD: carcasses, panels, fronts, frames, plinth, worktops ---------- */
function build(P) {
  const L = layout(P), R = L.R, groups = L.groups, align = !!(P.settings || {}).alignFronts;
  const warn = L.warn.map(w => ({ level: 'error', ...w }));
  const W = (level, text) => warn.push({ level, text });
  const t = R.t, n0 = R.wall, n1 = R.wall + R.depth, nf = n1 + t;   // carcass back / front, front face
  const parts = [], fronts = [], carcasses = [];
  const part = (p) => { parts.push(p); return p; };

  for (const G of groups.values()) {
    const I = G.items, g = G.g, fr = I.filter(i => FRONTS.includes(i.t));
    for (const f of fr) { f.fu0 = f.u0 + f.gw / 2; f.fv0 = f.v0 + f.gh / 2; }
    if (align) {
      alignAxis(fr, f => f.v0, f => f.v1, 'gh', R.gap, (f, y) => f.fv0 = y);
      alignAxis(fr, f => f.u0, f => f.u1, 'gw', R.gap, (f, x) => f.fu0 = x);
    }

    // carcasses: stacked boxed items in one column span form one carcass; upper ones separate; none for the dishwasher
    const byCol = new Map();
    for (const it of I) if (BOXED.includes(it.t)) { const k = it.c + ':' + it.s; byCol.set(k, [...(byCol.get(k) || []), it]); }
    for (const col of byCol.values()) {
      let K = null;
      const flush = () => { if (K) carcasses.push(K); K = null; };
      for (const it of col.sort((a, b) => a.v0 - b.v0)) {
        if (is(R, 'dishwasher', it.note)) { flush(); continue; }
        const upper = it.v0 >= R.upperFrom;
        if (K && (upper || it.v0 !== K.v1)) flush();
        if (!K) K = { g, c: it.c, s: it.s, u0: it.u0, u1: Math.max(it.u1, it.u0 + it.cw), v0: it.v0, v1: it.v1, items: [] };
        K.items.push(it); K.v1 = it.v1; it.K = K;
        if (upper) flush();
      }
      flush();
    }
  }
  carcasses.sort((a, b) => a.g - b.g || a.u0 - b.u0 || a.v0 - b.v0).forEach((K, i) => K.id = i + 1);

  // fronts (before shelves: shelves keep clear of the hinges)
  for (const G of groups.values()) for (const it of G.items) {
    if (!FRONTS.includes(it.t)) continue;
    const K = it.K || null, w = it.u1 - it.u0 - it.gw, h = it.h - it.gh, note = it.note;
    if (w <= 0 || h <= 0) { W('error', `G${it.g} col ${it.c}: front ${w} × ${h} – gap larger than the module`); continue; }
    const kind = it.t === 'drawer' ? 'drawer' : is(R, 'dishwasher', note) ? 'dish' : is(R, 'dummy', note) ? 'fixed' : is(R, 'fridge', note) ? 'fridge' : 'door';
    const name = kind === 'drawer' ? (is(R, 'bins', note) ? 'Sink drawer front (waste bins)' : 'Drawer front')
      : kind === 'fixed' ? 'Dummy front' : kind === 'door' ? 'Door' : 'Appliance-door front';
    const col = G.items.filter(x => x.c === it.c && x.s === it.s && x.hd);
    const hingeSide = it.hd === 'L' ? 'R' : it.hd === 'R' ? 'L' : col.some(x => x.hd === 'L') ? 'R' : 'L';
    const F = { g: it.g, item: it, K, kind, name, w, h, hd: it.hd, hingeSide, box: [it.fu0, it.fu0 + w, it.fv0, it.fv0 + h, n1, nf], hinges: [] };
    if (kind === 'door' && K) {
      const n = R.hinges.find(([lim]) => h < lim)[1];
      for (let j = 0; j < n; j++) F.hinges.push(Math.round(F.box[2] + 100 + (h - 200) * j / (n - 1)));
    }
    if (kind === 'drawer' && K) {
      const D = h >= R.drawerD, b0 = it.v0 + (it.v0 === K.v0 ? t : 0) + 24;
      F.drawer = { type: D ? 'D' : 'M', b0, box: R.box[D ? 'D' : 'M'], bins: is(R, 'bins', note) };
      if (is(R, 'inner', note)) F.drawer.inner = { b0: b0 + F.drawer.box + 40, box: R.box.M };
    }
    it.F = F; fronts.push(F);
    part({ g: it.g, K: K && K.id, name, mat: 'front', a: w, b: h, edge: 0, box: F.box, layer: 'fronts' });
  }

  // carcass panels
  for (const K of carcasses) {
    const { u0, u1, v0, v1 } = K, w = u1 - u0, H = v1 - v0, ui0 = u0 + t, ui1 = u1 - t, iw = w - 2 * t;
    const notes = K.items.map(i => i.note).join(' | ');
    Object.assign(K, { base: v0 <= R.floorMax && v1 <= R.baseTop, floor: v0 <= R.floorMax,
      sink: is(R, 'sink', notes), hob: is(R, 'hob', notes), fridge: is(R, 'fridge', notes),
      appliance: K.items.some(i => i.t === 'oven' || i.t === 'micro') });
    const P_ = (name, a, b, box, o = {}) => part({ g: K.g, K: K.id, name, mat: 'p18', a, b, edge: 0, box, layer: 'carcasses', ...o });
    P_('Side', R.depth, H, [u0, ui0, v0, v1, n0, n1], { edge: H });
    P_('Side', R.depth, H, [ui1, u1, v0, v1, n0, n1], { edge: H });
    P_('Bottom panel', iw, R.depth, [ui0, ui1, v0, v0 + t, n0, n1], { edge: iw });
    if (!K.base) P_('Top panel', iw, R.depth, [ui0, ui1, v1 - t, v1, n0, n1], { edge: iw });
    else if (K.sink) {          // on edge, clear of the bowl
      P_('Top rail 100 (on edge)', iw, R.rail, [ui0, ui1, v1 - R.rail, v1, n1 - t, n1], { edge: iw });
      P_('Top rail 100 (on edge)', iw, R.rail, [ui0, ui1, v1 - R.rail, v1, n0, n0 + t]);
    } else if (K.hob) {         // on edge so the hob fits between them, 16 separation panel below
      P_('Top rail 50 (front, on edge)', iw, 50, [ui0, ui1, v1 - 50, v1, n1 - t, n1], { edge: iw });
      P_('Top rail 100 (on edge)', iw, R.rail, [ui0, ui1, v1 - R.rail, v1, n0, n0 + t]);
      part({ g: K.g, K: K.id, name: 'Hob separation panel', mat: 'p16', a: iw, b: R.depth - 2 * t, edge: 0,
        box: [ui0, ui1, v1 - 50, v1 - 50 + R.t16, n0 + t, n1 - t], layer: 'shelves' });
    } else {
      P_('Top rail 100', iw, R.rail, [ui0, ui1, v1 - t, v1, n1 - R.rail, n1], { edge: iw });
      P_('Top rail 100', iw, R.rail, [ui0, ui1, v1 - t, v1, n0, n0 + R.rail]);
    }
    part({ g: K.g, K: K.id, name: 'Back HDF', mat: 'hdf', a: w - 2, b: H - 2, edge: 0, box: [u0 + 1, u1 - 1, v0 + 1, v1 - 1, n0 - R.hdf, n0], layer: 'carcasses' });
    const shelf = (name, y, a, x0, x1, extra) => P_(name, a, R.depth - R.shelfSetback, [x0, x1, y - t / 2, y + t / 2, n0, n1 - R.shelfSetback], { edge: a, layer: 'shelves', ...extra });
    // fixed shelves between stacked items (not in base units or the fridge carcass)
    if (!K.base && !K.fridge) for (const it of K.items.slice(1)) shelf('Fixed shelf', it.v0, iw, ui0, ui1);
    // fridge: fixed shelf on top of the niche when the carcass is taller than the niche
    const nz = K.items.map(i => niche(R, i.note)).find(Boolean);
    if (K.fridge && nz && H - 2 * t > nz[0][1]) {
      const y = v0 + t + Math.round((nz[0][0] + nz[0][1]) / 2) + t / 2;
      shelf('Fixed shelf', y, iw, ui0, ui1);
      W('info', `K${K.id} (G${K.g} col ${K.c}): fixed shelf added at ${y - t / 2}–${y + t / 2} so the fridge niche is ${y - t / 2 - v0 - t} (carcass interior ${H - 2 * t})`);
    }
    // adjustable shelves in door modules, clear of the hinges (not in the sink or fridge carcass)
    const hz = fronts.filter(F => F.K === K).flatMap(F => F.hinges);
    if (!K.sink && !K.fridge) for (const it of K.items) {
      if (!it.F || it.F.kind !== 'door') continue;
      const lo = it.v0 === v0 ? v0 + t : it.v0 + t / 2, hi = it.v1 === v1 ? v1 - t : it.v1 - t / 2;
      const k = R.shelves.find(([lim]) => it.h <= lim)[1];
      for (let j = 1; j <= k; j++) {
        let y = Math.round(lo + (hi - lo) * j / (k + 1));
        for (const hv of hz) if (Math.abs(y - hv) < R.hingeZone) y = hv + (y >= hv ? 1 : -1) * R.hingeZone;
        if (y - t / 2 < lo + 40 || y + t / 2 > hi - 40) continue;
        shelf('Adjustable shelf', y, iw - 2, ui0 + 1, ui1 - 1, { adjustable: true });
      }
    }
    // drawer boxes: chipboard 16 bottom and back (TANDEMBOX: bottom LW − 75 × NL − 10, back LW − 87)
    for (const it of K.items) {
      const d = it.F && it.F.drawer; if (!d) continue;
      const box = (b0, back, tag) => {
        const z0 = n1 - 12 - R.nl, D = (name, a, b, bx) => part({ g: K.g, K: K.id, name, mat: 'p16', a, b, edge: 0, box: bx, layer: 'drawers', item: it.idx, inner: tag === 'inner' });
        D('Drawer bottom', iw - 75, R.nl - 10, [ui0 + 37.5, ui1 - 37.5, b0, b0 + R.t16, z0, z0 + R.nl - 10]);
        D(`Drawer back ${tag}`, iw - 87, back, [ui0 + 43.5, ui1 - 43.5, b0 + R.t16, b0 + R.t16 + back, z0, z0 + R.t16]);
      };
      box(d.b0, R.drawerBack[d.type], d.type);
      if (d.inner) box(d.inner.b0, R.drawerBack.inner, 'inner');
    }
    K.legs = K.floor ? [[u0 + 45, n0 + 45], [u1 - 45, n0 + 45], [u0 + 45, n1 - 100], [u1 - 45, n1 - 100]] : [];
    if (nz) K.niche = nz;
  }

  // frames, back strips, plinth, worktops, island back panel
  const hasK = (G, c, v0, v1) => G.items.some(x => x.K && x.c <= c && c < x.c + x.s && x.v0 < v1 && x.v1 > v0);
  for (const G of groups.values()) {
    const g = G.g, wt = G.info.worktop || R.worktop, tops = [];
    for (const it of G.items) {
      const { u0, u1, v0, v1 } = it, w = u1 - u0, h = v1 - v0, label = `G${g} col ${it.c}${it.s > 1 ? '–' + (it.c + it.s - 1) : ''}`;
      if (it.t === 'frame') {
        const onEdge = Math.min(w, h) <= t, len = Math.max(w, h), horiz = w > h;
        if (onEdge) part({ g, name: `${horiz ? 'Horizontal frame' : 'Frame'} 18 on edge (${R.frameDepth} deep)`, mat: 'frame', a: R.frameDepth, b: len, edge: 0, box: [u0, u1, v0, v1, nf - R.frameDepth, nf], layer: 'frames', where: label });
        else part({ g, name: `Filler ${w}, installed flat`, mat: 'frame', a: w, b: h, edge: 0, box: [u0, u1, v0, v1, n1, nf], layer: 'frames', where: label });
        // back strip (chipboard 18, same length): keeps carcass spacing at the back
        const covered = carcasses.some(K => K.g === g && K.u1 > K.items[0].u1 && u0 >= K.items[0].u1 && u1 <= K.u1 && v0 < K.v1 && v1 > K.v0);
        if (covered) continue;
        if (onEdge) part({ g, name: 'Back strip 100', mat: 'p18', a: R.frameDepth, b: len, edge: 0, box: [u0, u1, v0, v1, n0, n0 + R.frameDepth], layer: 'carcasses', where: label });
        else if (hasK(G, it.c - 1, v0, v1) && hasK(G, it.c + it.s, v0, v1)) part({ g, name: 'Back strip, flat', mat: 'p18', a: w, b: h, edge: 0, box: [u0, u1, v0, v1, n0, n0 + t], layer: 'carcasses', where: label });
      } else if (it.t === 'plinth') {
        const pf = nf - R.plinthSetback;
        part({ g, name: 'Plinth', mat: 'plinth', a: h, b: w, edge: 0, box: [u0, u1, v0, v1, pf - R.plinthT, pf], layer: 'frames', where: label });
      } else if (it.t === 'worktop') {
        if (is(R, 'reference', it.note)) continue;                     // drawn in another group
        if (h <= 60) tops.push(it);
        else if (v0 === 0) part({ g, name: 'Waterfall end', mat: 'worktop', a: h, b: wt[1] - wt[0], edge: 0, box: [u0, u1, v0, v1, wt[0], wt[1]], layer: 'worktops', where: label, waterfall: true });
        else part({ g, name: 'Wall panel', mat: 'wallpanel', a: w, b: h, edge: 0, box: [u0, u1, v0, v1, 0, R.wallPanelT], layer: 'worktops', where: label });
      }
    }
    for (const it of tops) {   // a worktop ends at its last support (carcass incl. a wider corner carcass, frame, waterfall)
