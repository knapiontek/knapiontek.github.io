<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Elevation Layout</title>
  <style>
    /* =============================================================
       STYLES
       ============================================================= */
        :root {
          --bg: #0f172a;
          --panel: #1e293b;
          --accent: #38bdf8;
          --accent-hover: #7dd3fc;
          --danger: #f87171;
          --danger-hover: #fca5a5;
          --text: #f8fafc;
          --text-muted: #cbd5e1;
          --text-dim: #e2e8f0;
          --border: #334155;
          --border-soft: #475569;
          --row-hover: #334155;
    
          --sheet-bg: #ffffff;
          --sheet-header-bg: #f1f5f9;
          --sheet-border: #d8dee8;
          --sheet-text: #1e293b;
          --sheet-text-muted: #64748b;
          --sheet-row-alt: #f8fafc;
          --sheet-row-hover: #eaf4fe;
          --sheet-focus: #38bdf8;
          --sheet-ghost: #94a3b8;
        }
    
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    
        h1 { max-width: 1400px; margin: 0 auto 18px auto; font-size: 22px; }
    
        #action-bar {
          max-width: 1400px;
          margin: 0 auto 15px auto;
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          justify-content: flex-end;
          align-items: center;
        }
        .action-group { display: flex; gap: 8px; padding-left: 10px; border-left: 1px solid var(--border-soft); }
        .action-group:first-child { border-left: none; padding-left: 0; }
    
        .btn {
          background: var(--accent);
          color: var(--bg);
          border: none;
          padding: 9px 16px;
          font-size: 13px;
          font-weight: 600;
          border-radius: 6px;
          cursor: pointer;
          transition: background 0.15s ease, transform 0.1s ease;
          white-space: nowrap;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn.secondary { background: var(--border-soft); color: var(--text); }
        .btn.secondary:hover { background: #5b6b83; }
        .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn.danger:hover { background: rgba(248,113,113,0.12); color: var(--danger-hover); border-color: var(--danger-hover); }
    
        #status-banner {
          max-width: 1400px;
          margin: 0 auto 15px auto;
          display: none;
          padding: 10px 14px;
          border-radius: 6px;
          font-size: 13px;
          font-weight: 500;
        }
        #status-banner.show { display: block; }
        #status-banner.error { background: rgba(248,113,113,0.12); color: var(--danger-hover); border: 1px solid var(--danger); }
        #status-banner.ok { background: rgba(56,189,248,0.12); color: var(--accent-hover); border: 1px solid var(--accent); }
    
        #svg-container { width: 100%; max-width: 1400px; margin: 20px auto 0 auto; background: var(--panel); padding: 20px; box-sizing: border-box; border-radius: 8px; position: relative; }
        #svg-canvas { width: 100%; text-align: center; }
        svg {
          display: inline-block;
          width: auto;
          height: auto;
          max-width: 100%;
          max-height: min(70vh, 700px);
          overflow: visible;
        }
        .component-group { cursor: pointer; }
        .component-group:hover rect { filter: brightness(1.2); stroke: var(--accent) !important; stroke-width: 3px; }
        
        #tooltip {
          position: absolute;
          display: none;
          background: var(--bg);
          color: var(--accent);
          border: 2px solid var(--accent);
          padding: 6px 12px;
          font-size: 14px;
          font-weight: bold;
          border-radius: 4px;
          pointer-events: none;
          white-space: nowrap;
          z-index: 10;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        #svg-footnote {
          margin-top: 16px;
          padding-top: 12px;
          border-top: 1px solid var(--border);
          font-size: 13px;
          color: var(--text-muted);
          min-height: 18px;
          text-align: left;
        }
    
        .panel {
          max-width: 1400px;
          margin: 20px auto 0 auto;
          background: var(--panel);
          padding: 20px;
          border-radius: 8px;
          box-sizing: border-box;
        }
        .panel h3 { margin-top: 0; color: var(--accent); font-size: 16px; }
    
        .settings-bar {
          display: flex;
          gap: 20px;
          margin-bottom: 16px;
          align-items: center;
          font-size: 13px;
          color: var(--text-dim);
          background: var(--bg);
          padding: 10px 14px;
          border-radius: 6px;
          border: 1px solid var(--border);
        }
        .settings-bar label {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .settings-bar input {
          width: 90px;
          background: var(--sheet-bg);
          border: 1px solid var(--sheet-border);
          border-radius: 4px;
          padding: 5px 8px;
          color: var(--sheet-text);
          font: inherit;
          text-align: right;
        }
    
        .input-grid {
          display: grid;
          grid-template-columns: minmax(220px, 300px) 1fr;
          gap: 20px;
          align-items: start;
        }
        .sub-section h4 {
          margin: 0 0 8px 0;
          color: var(--text-dim);
          border-bottom: 1px solid var(--border-soft);
          padding-bottom: 6px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 14px;
        }
        .sub-section h4 span.total { font-size: 12px; color: var(--accent); font-weight: normal; }
    
        .sheet-wrap {
          background: var(--sheet-bg);
          border: 1px solid var(--sheet-border);
          border-radius: 6px;
          overflow: auto;
          max-height: 360px;
        }
    
        table.sheet {
          width: 100%;
          border-collapse: collapse;
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 12.5px;
          background: var(--sheet-bg);
        }
        table.sheet thead th {
          position: sticky;
          top: 0;
          background: var(--sheet-header-bg);
          color: var(--sheet-text);
          font-weight: 700;
          text-align: left;
          padding: 7px 10px;
          border-bottom: 2px solid var(--sheet-border);
          border-right: 1px solid var(--sheet-border);
          white-space: nowrap;
          z-index: 1;
        }
        table.sheet thead th:last-child { border-right: none; }
        table.sheet tbody td {
          padding: 0;
          border-bottom: 1px solid var(--sheet-border);
          border-right: 1px solid var(--sheet-border);
          color: var(--sheet-text);
        }
        table.sheet tbody td:last-child { border-right: none; }
        table.sheet tbody tr:nth-child(even) td { background: var(--sheet-row-alt); }
        table.sheet tbody tr:hover td { background: var(--sheet-row-hover); }
        table.sheet tbody tr.is-empty-row td { color: var(--sheet-ghost); }
        table.sheet tbody tr.is-invalid td { background: rgba(248,113,113,0.14) !important; }
    
        table.sheet input, table.sheet select, table.sheet textarea {
          width: 100%;
          border: none;
          background: transparent;
          padding: 7px 10px;
          font: inherit;
          color: var(--sheet-text);
          outline: none;
        }
        table.sheet input:focus, table.sheet select:focus, table.sheet textarea:focus {
          background: #fff8e1;
          box-shadow: inset 0 0 0 2px var(--sheet-focus);
        }
        table.sheet input[type="number"] { text-align: right; }
        table.sheet select { cursor: pointer; }
    
        td.col-actions { width: 56px; text-align: center; padding: 0 !important; white-space: nowrap; }
        td.col-actions button {
          width: 26px; height: 100%; border: none; background: transparent;
          color: var(--sheet-ghost); cursor: pointer; font-size: 15px; line-height: 1; padding: 7px 0;
        }
        td.col-actions button.row-insert:hover { color: var(--accent-hover); background: rgba(56,189,248,0.12); }
        td.col-actions button.row-del:hover { color: var(--danger); background: rgba(248,113,113,0.1); }
    
        table.sheet.output td { padding: 7px 10px; }
        table.sheet.output.spacy td { padding: 10px 14px; }
        table.sheet.output td strong { color: #0f172a; }
    
        .hidden-file-input { display: none; }

        /* Notes */
        table.sheet td.col-note input { font-family: system-ui, -apple-system, sans-serif; min-width: 180px; }
        table.sheet td.col-note input::placeholder { color: var(--sheet-ghost); }
        table.sheet td.col-note textarea {
          font-family: system-ui, -apple-system, sans-serif; width: 100%; min-width: 120px;
          resize: none; overflow: hidden; line-height: 1.35; display: block;
          field-sizing: content;   /* row height follows the text (browsers that support it) */
        }
        .notes-wrap { max-height: none; }
        #svg-footnote .fn-note { color: var(--accent-hover); }
    
        @media (max-width: 900px) {
          .input-grid { grid-template-columns: 1fr; }
        }
  </style>
</head>
<body>

<div x-data="kitchenApp()">

  <h1>Kitchen Elevation Layout</h1>

  <div id="action-bar">
    <div class="action-group">
      <button class="btn secondary" @click="triggerImport()">Import State CSV</button>
      <button class="btn secondary" @click="exportStateCSV()">Export State CSV</button>
      <input type="file" class="hidden-file-input" accept=".csv,text/csv" x-ref="importFile" @change="handleImportFile($event)">
    </div>
    <div class="action-group">
      <button class="btn" @click="exportSVG()">Export SVG</button>
    </div>
    <div class="action-group">
      <button class="btn danger" @click="resetDefaults()">Reload Project Data</button>
    </div>
  </div>

  <div id="status-banner" :class="{show: bannerType !== '', error: bannerType === 'error', ok: bannerType === 'ok'}" x-text="bannerText"></div>

  <!-- 1. INPUT -->
  <div class="panel">
    <h3>Input Data</h3>
    <div class="settings-bar">
      <label>
        Default Front Gap (mm):
        <input type="number" x-model.number="gapMm" min="0" step="0.5">
      </label>
    </div>
    <div class="input-grid">
      <div class="sub-section">
        <h4>Groups &amp; Columns</h4>
        <div class="sheet-wrap">
          <table class="sheet">
            <thead>
              <tr><th style="width:70px">Group</th><th>Width (mm)</th><th class="col-actions"></th></tr>
            </thead>
            <tbody x-ref="columnsTbody">
              <template x-for="(row, idx) in columns" :key="row.id">
                <tr :class="{'is-invalid': build.colFlags[idx] === 'invalid', 'is-empty-row': build.colFlags[idx] === 'empty'}">
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.group"></td>
                  <td><input type="number" class="cell" min="0" step="1" x-model.number="row.width"></td>
                  <td class="col-actions">
                    <button type="button" class="row-insert" title="Insert row below (clones current)" @click="insertColumnRow(idx)">+</button><button type="button" class="row-del" title="Delete row" @click="removeColumnRow(idx)">×</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
      <div class="sub-section">
        <h4>Components</h4>
        <div class="sheet-wrap">
          <table class="sheet">
            <thead>
              <tr>
                <th style="width:56px">Group</th>
                <th style="width:52px">Col</th>
                <th style="width:52px">Span</th>
                <th style="width:96px">Type</th>
                <th style="width:96px">Height (mm)</th>
                <th style="width:80px">Handle</th>
                <th style="width:70px">Gap W (mm)</th>
                <th style="width:70px">Gap H (mm)</th>
                <th>Notes</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody x-ref="componentsTbody">
              <template x-for="(row, idx) in components" :key="row.id">
                <tr :class="{'is-invalid': build.compFlags[idx] === 'invalid', 'is-empty-row': build.compFlags[idx] === 'empty'}">
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.group"></td>
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.col"></td>
                  <td><input type="number" class="cell" min="1" step="1" x-model.number="row.span"></td>
                  <td>
                    <select class="cell" x-model="row.type">
                      <template x-for="t in COMPONENT_TYPES" :key="t">
                        <option :value="t" x-text="t.charAt(0).toUpperCase() + t.slice(1)"></option>
                      </template>
                    </select>
                  </td>
                  <td><input type="number" class="cell" min="0" step="1" x-model.number="row.height"></td>
                  <td>
                    <select class="cell" x-model="row.handle">
                      <template x-for="h in HANDLE_POSITIONS" :key="h || 'none'">
                        <option :value="h" x-text="h || '—'"></option>
                      </template>
                    </select>
                  </td>
                  <td><input type="number" class="cell" min="0" step="1" :placeholder="gapMm" x-model.number="row.gapW"></td>
                  <td><input type="number" class="cell" min="0" step="1" :placeholder="gapMm" x-model.number="row.gapH"></td>
                  <td class="col-note"><input type="text" class="cell" x-model="row.note"></td>
                  <td class="col-actions">
                    <button type="button" class="row-insert" title="Insert row below (clones current)" @click="insertComponentRow(idx)">+</button><button type="button" class="row-del" title="Delete row" @click="removeComponentRow(idx)">×</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. SVG DIAGRAM -->
  <div id="svg-container" x-ref="svgContainer" @mouseover="onSvgHover($event)" @mousemove="onSvgMove($event)" @mouseleave="onSvgLeave()">
    <div id="svg-canvas" x-ref="svgCanvas" x-show="!build.isEmpty" x-html="build.svg"></div>
    <div x-show="build.isEmpty" style="padding:60px 20px;text-align:center;color:#94a3b8;">No layout yet — add some groups &amp; columns and components in the tables above.</div>
    <div id="tooltip" x-show="tooltip.show" :style="`left:${tooltip.x}px; top:${tooltip.y}px`" x-text="tooltip.text"></div>
    <div id="svg-footnote" x-show="!build.isEmpty" x-text="hoverInfo"></div>
  </div>

  <!-- 3. GENERAL NOTES -->
  <div class="panel">
    <h3>General Notes</h3>
    <div class="sheet-wrap notes-wrap">
      <table class="sheet">
        <thead>
          <tr>
            <th style="width:200px">Name</th>
            <th>Description</th>
            <th>Details</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody x-ref="notesTbody">
          <template x-for="(n, idx) in notes" :key="n.id">
            <tr :class="{'is-empty-row': isRowEmpty(n.name, n.description, n.details)}">
              <td class="col-note"><textarea class="cell" rows="1" x-model="n.name" x-init="$nextTick(() => autoGrow($el))" @input="autoGrow($el)"></textarea></td>
              <td class="col-note"><textarea class="cell" rows="1" x-model="n.description" x-init="$nextTick(() => autoGrow($el))" @input="autoGrow($el)"></textarea></td>
              <td class="col-note"><textarea class="cell" rows="1" x-model="n.details" x-init="$nextTick(() => autoGrow($el))" @input="autoGrow($el)"></textarea></td>
              <td class="col-actions">
                <button type="button" class="row-insert" title="Insert row below" @click="insertNoteRow(idx)">+</button><button type="button" class="row-del" title="Delete row" @click="removeNoteRow(idx)">×</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<!-- ===================================================================
     PROJECT DATA (JSON) - the only place with values for this kitchen.
     The application script below is project independent; it reads this
     block at start-up. To update the kitchen, edit only this block.
     DATA FLOW (propagated by an LLM on request, files never write each other):
       1. kitchen_design.html  #kitchen-project       SOURCE - edit only here
       2. kitchen_cost.html    #kitchen-project-copy  = exact copy of 1
                               #cost-data             rules, blocks / items derived from 1 by the design
                                                      notes (fronts are calculated live); prices are input
       3. kichen_view.html     #kitchen-project-copy  = exact copy of 2 (same as 1)
                               #view-data             scene of this kitchen (room, window, appliances,
                                                      lights, colours, cameras) - input, edit here
     The view only draws the project and checks it: overlaps / gaps / parts sticking out, front alignment.
     The JavaScript in the three files is generic: kitchen data lives only in the LLM-DATA blocks.
     Data sections are marked  LLM-DATA BEGIN <name> ... LLM-DATA END <name>.
     After propagating, open kichen_view.html, tab Carcasses: geometry and alignment checks must be OK.
       settings.gapMm: default reveal gap between fronts (mm)
       settings.alignFronts: line up fronts in the same line (see note "Front alignment")
       notes:      [name, description, details] - everything the drawing
                   does not show (materials, hardware, rules, appliances)
       columns:    group -> column widths in mm, left to right
       components: placed bottom-up within their column(s), in list order
         g group, c first column, s column span, h height mm,
         t type: filler (wall / void), plinth, worktop, frame (strip
                 between fronts), cabinet (hinged door front),
                 drawer (drawer front), oven, micro
         hd handle (T|B|L|R|""), gw/gh front gaps mm ("" = default),
         note: what this piece is (geometry specific)
     =================================================================== -->
<!-- LLM-DATA BEGIN kitchen-project (SOURCE: edit here) -->

<script>
'use strict';

/* ===================================================================
   SECTION 1 — CONFIG & SAMPLE DATA
   Colors, sizing constants, component-type lists, and the data that
   pre-fills the tables on first load. Nothing in this section runs
   any logic - it is just values other sections read from.
   =================================================================== */

// All tunable numbers and colors live here. Nothing in this file does any
// work - it's just data that the layout engine and renderer read from.

const CONFIG = {
  scale: 1,
  frameThickness: 50,   // front frame border width, in SVG units
  groupGap: 100,        // horizontal gap between groups, in SVG units
  gapMm: 4,              // default reveal gap between fronts, in mm
  viewBoxMargin: 40,

  colors: {
    canvasBg: '#f8fafc',
    filler: '#cbd5e1', fillerStroke: '#1e293b',
    worktop: '#f3c48b', worktopStroke: '#a86c32',
    frame: '#bfdbfe', frameStroke: '#1e293b',
    plinth: '#b4bfcc', plinthStroke: '#1e293b',
    frontOuter: '#bfdbfe', frontOuterStroke: '#1e293b',
    frontInner: '#dbeafe', frontInnerStroke: '#64748b',
    handle: '#d97706', handleStroke: '#78350f',
    applianceBody: '#e2e8f0', applianceBodyStroke: '#1e293b',
    applianceGlass: '#94a3b8', applianceGlassStroke: '#475569',
    applianceTrim: '#cbd5e1', applianceTrimStroke: '#475569',
    controlPanel: '#334155', controlPanelStroke: '#1e293b',
    knob: '#64748b',
    glassBlack: '#1c1f24', panelBlack: '#0d0f12', applianceEdge: '#000000',
    glassWindow: '#2b313a', knobMetal: '#a1a7b0', handleMetal: '#c4c9cf',
    display: '#06080a', displayText: '#7dd3fc'
  },

  handle: { thickness: 16, edgeOffset: 20, minSpan: 30, maxSpan: 80 }
};

// Component types that are just a plain colored rectangle. Mapping each one
// to its fill/stroke pair here means the renderer needs only ONE function
// for all of them instead of near-identical copies.
const SIMPLE_RECT_TYPES = {
  filler: { fill: 'filler', stroke: 'fillerStroke' },
  worktop: { fill: 'worktop', stroke: 'worktopStroke' },
  frame: { fill: 'frame', stroke: 'frameStroke' },
  plinth: { fill: 'plinth', stroke: 'plinthStroke' }
};

// filler = wall / void, plinth = plinth board, worktop = worktop board, frame = strip between fronts,
// cabinet = hinged door front, drawer = drawer front, oven / micro = appliance.
const COMPONENT_TYPES = ['filler', 'plinth', 'worktop', 'frame', 'cabinet', 'drawer', 'oven', 'micro'];
// Front types: drawn alike; 'cabinet' = hinged door front, 'drawer' = drawer front.
const FRONT_TYPES = ['cabinet', 'drawer'];
const HANDLE_POSITIONS = ['', 'T', 'B', 'L', 'R'];

// Fallbacks used only when the project file leaves a setting out.
const DEFAULT_SETTINGS = { gapMm: CONFIG.gapMm };

// The project itself lives in the JSON block #kitchen-project above.
// This turns it into the plain shape the UI binds to, so the app never
// depends on how the data file is written.
function loadProject(p) {
  p = p || { columns: {}, components: [] };
  const columns = [];
  for (const [g, widths] of Object.entries(p.columns || {})) for (const w of widths) columns.push([Number(g), w]);
  return {
    settings: { ...DEFAULT_SETTINGS, ...(p.settings || {}) },
    notes: (p.notes || []).map(([name, description, details]) => [name ?? '', description ?? '', details ?? '']),
    columns,
    components: (p.components || []).map(c => [c.g, c.c, c.s, c.t, c.h, c.hd ?? '', c.gw ?? '', c.gh ?? '', c.note ?? ''])
  };
}
const PROJECT = loadProject((() => {
  const el = document.getElementById('kitchen-project');
  try { return el ? JSON.parse(el.textContent) : null; }
  catch (e) { console.error('Project data JSON is invalid:', e); return null; }
})());

/* ===================================================================
   SECTION 2 — GENERIC UTILITIES
   CSV read/write, number parsing, file download. No kitchen-specific
   knowledge here - safe to reuse in any other project.
   =================================================================== */

// Generic helpers with no knowledge of kitchens, layouts, or Alpine.
// Kept separate so they're easy to test or reuse on their own.

function isRowEmpty(...vals) {
  return vals.every(v => String(v ?? '').trim() === '');
}

function escapeAttr(v) {
  return String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toNum(v, isInt) {
  const s = String(v ?? '').trim();
  if (s === '') return NaN;
  return isInt ? parseInt(s, 10) : parseFloat(s);
}

function downloadBlob(content, mimeType, filename) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function toCSV(rows) {
  return rows.map(r => r.map(val => `"${String(val ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

  for (let i = 0; i < normalized.length; i++) {
    const ch = normalized[i];
    if (inQuotes) {
      if (ch === '"') { if (normalized[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
      else field += ch;
    } else if (ch === '"') inQuotes = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n') { row.push(field); field = ''; rows.push(row); row = []; }
    else field += ch;
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(cell => String(cell).trim() !== ''));
}

/* ===================================================================
   SECTION 3 — LAYOUT ENGINE (pure geometry)
   Figures out where each component sits: x, y, width, height. Knows
   nothing about colors or SVG markup - that is Section 4.
   =================================================================== */

// LayoutEngine turns "groups + columns + components" into positioned boxes
// (x, y, width, height for each component). It knows nothing about how
// those boxes get drawn - that's the SVG renderer's job. Splitting the two
// apart is what used to make the old KitchenSVGBuilder class hard to follow.

// Where a new component can start, given the ranges already stacked in its
// column(s): the top of the highest contiguous stack starting from 0.
function getContiguousTop(ranges) {
  const sorted = [...ranges].sort((a, b) => a[0] - b[0]);
  let currY = 0;
  for (const [start, end] of sorted) {
    if (start <= currY) { if (end > currY) currY = end; } else break;
  }
  return currY;
}

function rangesOverlap(yStart, yEnd, ranges) {
  return ranges.some(([start, end]) => Math.max(yStart, start) < Math.min(yEnd, end));
}

class LayoutEngine {
  constructor(options = {}) {
    this.scale = options.scale ?? CONFIG.scale;
    this.groupGap = options.groupGap ?? CONFIG.groupGap;
    this.defaultGapMm = options.gapMm ?? CONFIG.gapMm;

    this.groups = new Map();         // groupId -> { colWidths, colX }
    this.rawComponents = [];
  }

  setGroupColumns(groupId, widthsInMm) {
    const colWidths = widthsInMm.map(w => w * this.scale);
    const colX = [];
    let x = 0;
    for (const w of colWidths) { colX.push(x); x += w; }
    this.groups.set(groupId, { colWidths, colX });
  }

  addComponent(groupNum, colNum, colSpan, type, heightMm, handlePos = null, gapWMm = null, gapHMm = null, note = '') {
    this.rawComponents.push({ groupNum, colNum, colSpan, type, heightMm, handlePos, gapWMm, gapHMm, note });
  }

  // Places every component, left to right by group, bottom to top within a
  // column. Returns everything the SVG renderer needs.
  calculate() {
    const warnings = [];
    const components = [];

    // occupied[groupId][colIndex] = list of [yStart, yEnd] ranges already filled
    const occupied = new Map();
    for (const [groupId, group] of this.groups) occupied.set(groupId, group.colWidths.map(() => []));

    const groupXOffsets = new Map();
    let cursor = 0;
    for (const [groupId, group] of this.groups) {
      const width = group.colWidths.reduce((a, b) => a + b, 0);
      groupXOffsets.set(groupId, width > 0 ? cursor : 0);
      if (width > 0) cursor += width + this.groupGap;
    }

    for (const comp of this.rawComponents) {
      const group = this.groups.get(comp.groupNum);
      if (!group) {
        warnings.push(`Component "${comp.type}" references unknown group ${comp.groupNum}. Skipped.`);
        continue;
      }
      const ranges = occupied.get(comp.groupNum);
      const colIndex = comp.colNum - 1;
      const colSpan = comp.colSpan;
      const height = comp.heightMm * this.scale;

      if (colIndex < 0 || colSpan < 1) {
        warnings.push(`Component "${comp.type}" at Group ${comp.groupNum} has an invalid column/span. Skipped.`);
        continue;
      }

      let yFromBottom = 0;
      for (let i = 0; i < colSpan; i++) {
        const cIdx = colIndex + i;
        if (cIdx < ranges.length) yFromBottom = Math.max(yFromBottom, getContiguousTop(ranges[cIdx]));
      }
      const yTop = yFromBottom + height;

      let fits = true;
      for (let i = 0; i < colSpan; i++) {
        const cIdx = colIndex + i;
        if (cIdx < ranges.length && rangesOverlap(yFromBottom, yTop, ranges[cIdx])) { fits = false; break; }
      }
      if (!fits) {
        warnings.push(`Component "${comp.type}" (${comp.heightMm}mm) at Group ${comp.groupNum}, Col ${comp.colNum} overlaps an existing component. Skipped.`);
        continue;
      }

      for (let i = 0; i < colSpan; i++) {
        const cIdx = colIndex + i;
        if (cIdx < ranges.length) ranges[cIdx].push([yFromBottom, yTop]);
      }

      const localX = group.colX[colIndex];
      const x = localX + groupXOffsets.get(comp.groupNum);

      let width = 0;
      for (let i = 0; i < colSpan; i++) {
        const cIdx = colIndex + i;
        if (cIdx < group.colWidths.length) width += group.colWidths[cIdx];
      }

      const widthMm = width / this.scale;
      const gapWMm = Number.isFinite(comp.gapWMm) ? comp.gapWMm : this.defaultGapMm;
      const gapHMm = Number.isFinite(comp.gapHMm) ? comp.gapHMm : this.defaultGapMm;
      const isFront = FRONT_TYPES.includes(comp.type);
      const frontWidthMm = isFront ? Math.max(0, widthMm - gapWMm) : widthMm;
      const frontHeightMm = isFront ? Math.max(0, comp.heightMm - gapHMm) : comp.heightMm;

      components.push({
        groupNum: comp.groupNum, colNum: comp.colNum, colIndex, colSpan, type: comp.type,
        x, yFromBottom, width, height, heightMm: comp.heightMm, widthMm, gapWMm, gapHMm, isFront,
        frontWidthMm, frontHeightMm, handlePos: comp.handlePos,
        note: comp.note || ''
      });
    }

    // Overall canvas size: widest total across groups, tallest column anywhere.
    const groupWidths = new Map();
    let totalWidth = 0;
    let activeGroupsCount = 0;
    for (const [groupId, group] of this.groups) {
      const w = group.colWidths.reduce((a, b) => a + b, 0);
      groupWidths.set(groupId, w);
      totalWidth += w;
      if (w > 0) activeGroupsCount++;
    }
    if (activeGroupsCount > 1) totalWidth += this.groupGap * (activeGroupsCount - 1);

    let totalHeight = 0;
    for (const [, ranges] of occupied) {
      for (const col of ranges) {
        for (const [, end] of col) totalHeight = Math.max(totalHeight, end);
      }
    }

    return {
      components,
      groupWidths,
      groupXOffsets,
      totalWidth,
      totalHeight,
      isEmpty: totalWidth <= 0 || totalHeight <= 0,
      warnings
    };
  }
}

/* ===================================================================
   SECTION 4 — SVG RENDERER
   Turns positioned components (from Section 3) into SVG markup.
   Only this section touches CONFIG.colors or writes <rect>/<g> tags.
   =================================================================== */

// Everything here is a pure function: (positioned component) -> SVG string.
// No state, no layout math - that all happened in the layout engine already.

function renderSimpleRect(c, svgY, colorKey) {
  const { fill, stroke } = SIMPLE_RECT_TYPES[colorKey];
  const { [fill]: fillColor, [stroke]: strokeColor } = CONFIG.colors;
  return `<rect fill="${fillColor}" stroke="${strokeColor}" stroke-width="2" x="${c.x}" y="${svgY}" width="${c.width}" height="${c.height}"/>`;
}

function renderFront(c, svgY) {
  const ft = CONFIG.frameThickness;
  const { frontOuter, frontOuterStroke, frontInner, frontInnerStroke } = CONFIG.colors;
  const outer = `<rect fill="${frontOuter}" stroke="${frontOuterStroke}" stroke-width="2" x="${c.x}" y="${svgY}" width="${c.width}" height="${c.height}"/>`;
  if (c.width <= ft * 2 || c.height <= ft * 2) return outer;
  const inner = `<rect fill="${frontInner}" stroke="${frontInnerStroke}" stroke-width="2" x="${c.x + ft}" y="${svgY + ft}" width="${c.width - ft * 2}" height="${c.height - ft * 2}"/>`;
  return outer + inner;
}

// Appliance face = the component's own rectangle from the input table.
// The type only decides what the face looks like, never its size.
function applianceFace(c, svgY) {
  return { x: c.x, y: svgY, w: c.width, h: c.height, slot: '' };
}

// Built-in oven look: black glass, top control strip with a central
// display and two knobs, full-width bar handle, tinted glass door.
function renderOven(c, svgY) {
  const k = CONFIG.colors;
  const { x, y, w, h, slot } = applianceFace(c, svgY);
  const panelH = Math.min(95, h * 0.17);
  const knobR = Math.min(17, panelH * 0.25);
  const handleY = y + panelH + 28;
  return `${slot}
    <rect fill="${k.glassBlack}" stroke="${k.applianceEdge}" stroke-width="2" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>
    <rect fill="${k.panelBlack}" x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${panelH - 8}" rx="2"/>
    <circle cx="${x + w * 0.16}" cy="${y + panelH / 2}" r="${knobR}" fill="${k.knobMetal}" stroke="${k.applianceEdge}" stroke-width="1.5"/>
    <circle cx="${x + w * 0.84}" cy="${y + panelH / 2}" r="${knobR}" fill="${k.knobMetal}" stroke="${k.applianceEdge}" stroke-width="1.5"/>
    <rect fill="${k.display}" x="${x + w / 2 - 70}" y="${y + panelH / 2 - 14}" width="140" height="28" rx="3"/>
    <text x="${x + w / 2}" y="${y + panelH / 2 + 7}" fill="${k.displayText}" font-family="monospace" font-size="20" text-anchor="middle">12:00</text>
    <rect fill="${k.handleMetal}" stroke="${k.applianceEdge}" stroke-width="1" x="${x + w * 0.1}" y="${handleY}" width="${w * 0.8}" height="16" rx="8"/>
    <rect fill="${k.glassWindow}" stroke="${k.applianceEdge}" stroke-width="1" x="${x + 70}" y="${handleY + 50}" width="${w - 140}" height="${Math.max(0, y + h - handleY - 100)}" rx="10"/>
  `;
}

// Built-in microwave look: black glass, window on the left, control column on
// the right with display and touch buttons, push-button door (no handle).
function renderMicro(c, svgY) {
  const k = CONFIG.colors;
  const { x, y, w, h, slot } = applianceFace(c, svgY);
  const panelW = Math.min(150, w * 0.25);
  const winX = x + 40, winY = y + 45, winW = w - panelW - 80, winH = h - 90;
  const px = x + w - panelW;
  return `${slot}
    <rect fill="${k.glassBlack}" stroke="${k.applianceEdge}" stroke-width="2" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>
    <rect fill="${k.glassWindow}" stroke="${k.applianceEdge}" stroke-width="1" x="${winX}" y="${winY}" width="${Math.max(0, winW)}" height="${Math.max(0, winH)}" rx="8"/>
    <line x1="${px}" y1="${y + 10}" x2="${px}" y2="${y + h - 10}" stroke="${k.applianceEdge}" stroke-width="1.5"/>
    <rect fill="${k.display}" x="${px + 18}" y="${y + 40}" width="${panelW - 36}" height="34" rx="3"/>
    <text x="${px + panelW / 2}" y="${y + 64}" fill="${k.displayText}" font-family="monospace" font-size="20" text-anchor="middle">0:30</text>
    ${[0, 1, 2].map(i => `<circle cx="${px + panelW / 2}" cy="${y + 120 + i * 55}" r="12" fill="none" stroke="${k.knobMetal}" stroke-width="2"/>`).join('')}
    <rect fill="none" stroke="${k.knobMetal}" stroke-width="2" x="${px + panelW / 2 - 28}" y="${y + h - 60}" width="56" height="26" rx="4"/>
  `;
}

function renderHandle(c, svgY) {
  if (!c.handlePos) return '';
  const { thickness, edgeOffset, minSpan, maxSpan } = CONFIG.handle;
  const pos = c.handlePos.toUpperCase();
  const vSpan = Math.min(120, Math.max(minSpan, c.height - 80));
  const hSpan = Math.min(maxSpan, Math.max(minSpan, c.width - 80));
  let hx, hy, hw, hh;

  switch (pos) {
    case 'T': hw = hSpan; hh = thickness; hx = c.x + (c.width - hw) / 2; hy = svgY + edgeOffset; break;
    case 'B': hw = hSpan; hh = thickness; hx = c.x + (c.width - hw) / 2; hy = svgY + c.height - edgeOffset - thickness; break;
    case 'L': hw = thickness; hh = vSpan; hx = c.x + edgeOffset; hy = svgY + (c.height - hh) / 2; break;
    case 'R':
    default: hw = thickness; hh = vSpan; hx = c.x + c.width - edgeOffset - thickness; hy = svgY + (c.height - hh) / 2; break;
  }

  return `<rect fill="${CONFIG.colors.handle}" stroke="${CONFIG.colors.handleStroke}" stroke-width="1.5" x="${hx}" y="${hy}" width="${hw}" height="${hh}"/>`;
}

// Single dispatch table instead of a big switch statement. Adding a new
// component type later just means adding one entry here.
const COMPONENT_RENDERERS = {
  filler: (c, svgY) => renderSimpleRect(c, svgY, 'filler'),
  worktop: (c, svgY) => renderSimpleRect(c, svgY, 'worktop'),
  frame: (c, svgY) => renderSimpleRect(c, svgY, 'frame'),
  plinth: (c, svgY) => renderSimpleRect(c, svgY, 'plinth'),
  cabinet: (c, svgY) => renderFront(c, svgY) + renderHandle(c, svgY),
  drawer: (c, svgY) => renderFront(c, svgY) + renderHandle(c, svgY),
  oven: renderOven,
  micro: renderMicro
};

function renderComponent(c, totalHeight, warnings) {
  const svgY = totalHeight - c.yFromBottom - c.height;
  const draw = COMPONENT_RENDERERS[c.type];
  if (!draw) {
    warnings.push(`Unknown component type "${c.type}" - not rendered.`);
    return '';
  }
  const content = draw(c, svgY);
  return `<g class="component-group" data-w="${c.widthMm}" data-h="${c.heightMm}" data-fw="${c.frontWidthMm}" data-fh="${c.frontHeightMm}" data-gap-w="${c.gapWMm}" data-gap-h="${c.gapHMm}" data-type="${c.type}" data-note="${escapeAttr(c.note)}">${content}</g>`;
}

// layout: the object returned by LayoutEngine.calculate()
function renderSVG(layout) {
  if (layout.isEmpty) return '';

  const vbMargin = CONFIG.viewBoxMargin;
  const viewBox = `-${vbMargin} -${vbMargin} ${layout.totalWidth + vbMargin * 2} ${layout.totalHeight + vbMargin * 2}`;

  const backgroundRects = [...layout.groupWidths.entries()]
    .map(([groupId, width]) => `<rect fill="${CONFIG.colors.canvasBg}" x="${layout.groupXOffsets.get(groupId)}" y="0" width="${width}" height="${layout.totalHeight}"/>`)
    .join('');

  const componentShapes = layout.components
    .map(c => renderComponent(c, layout.totalHeight, layout.warnings))
    .join('');

  return `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}" role="img" aria-label="Kitchen elevation layout diagram">
      ${backgroundRects}
      ${componentShapes}
    </svg>`;
}

/* ===================================================================
   SECTION 5 — COMPUTE LAYOUT (glue)
   Validates the raw table rows, then runs Sections 3 -> 4 -> 5 and
   packages the result for the UI. This is the one function Section 7
   calls whenever the input tables change.
   =================================================================== */

// The one function the UI calls whenever the input tables change.
// columnRows / componentRows are the raw {group, width, ...} objects bound
// to the Alpine tables - this function is what turns them into a diagram.
function computeLayout(columnRows, componentRows, gapMm) {
  const warnings = [];
  const colFlags = columnRows.map(() => null);
  const compFlags = componentRows.map(() => null);
  const groupWidths = new Map();

  columnRows.forEach((row, idx) => {
    if (isRowEmpty(row.group, row.width)) { colFlags[idx] = 'empty'; return; }
    const group = toNum(row.group, true);
    const width = toNum(row.width, false);
    if (!Number.isFinite(group) || group < 1 || !Number.isFinite(width) || width < 0) {
      colFlags[idx] = 'invalid';
      warnings.push(`Groups & Columns row ${idx + 1}: Group must be ≥1 and Width ≥0.`);
      return;
    }
    if (!groupWidths.has(group)) groupWidths.set(group, []);
    groupWidths.get(group).push(width);
  });

  const comps = [];
  componentRows.forEach((row, idx) => {
    if (isRowEmpty(row.group, row.col, row.span, row.height)) { compFlags[idx] = 'empty'; return; }
    const group = toNum(row.group, true);
    const col = toNum(row.col, true);
    const span = toNum(row.span, true);
    const height = toNum(row.height, false);
    const type = row.type;
    const handle = row.handle || null;
    const gapWRaw = String(row.gapW ?? '').trim();
    const gapHRaw = String(row.gapH ?? '').trim();
    const gapW = gapWRaw === '' ? null : toNum(row.gapW, false);
    const gapH = gapHRaw === '' ? null : toNum(row.gapH, false);
    if (!Number.isFinite(group) || group < 1 || !Number.isFinite(col) || col < 1 ||
        !Number.isFinite(span) || span < 1 || !Number.isFinite(height) || height < 0 ||
        (gapWRaw !== '' && (!Number.isFinite(gapW) || gapW < 0)) ||
        (gapHRaw !== '' && (!Number.isFinite(gapH) || gapH < 0))) {
      compFlags[idx] = 'invalid';
      warnings.push(`Components row ${idx + 1}: Group/Col/Span ≥1, Height/Gap W/Gap H ≥0 required.`);
      return;
    }
    comps.push({ groupNum: group, colNum: col, colSpan: span, type, heightMm: height, handlePos: handle, gapWMm: gapW, gapHMm: gapH, note: String(row.note ?? '').trim() });
  });

  const engine = new LayoutEngine({ scale: CONFIG.scale, gapMm });
  for (const [g, widths] of groupWidths) engine.setGroupColumns(g, widths);
  for (const c of comps) engine.addComponent(c.groupNum, c.colNum, c.colSpan, c.type, c.heightMm, c.handlePos, c.gapWMm, c.gapHMm, c.note);

  const layout = engine.calculate();
  const svg = renderSVG(layout);
  warnings.push(...layout.warnings);

  return { svg, isEmpty: layout.isEmpty, warnings, colFlags, compFlags };
}

/* ===================================================================
   SECTION 6 — UI / EVENTS (Alpine component)
   All page state (table rows, status banner, tooltip) and user
   actions (import/export, add/remove rows, hover tooltip). This is
   the only section that touches the DOM or Alpine directly.
   =================================================================== */

// Alpine component: all page state (table rows, status banner, tooltip) and
// user actions (import/export, add/remove rows). Delegates the actual
// diagram math to computeLayout().

document.addEventListener('alpine:init', () => {
  Alpine.data('kitchenApp', () => ({
    columns: [],
    components: [],
    notes: [],
    gapMm: DEFAULT_SETTINGS.gapMm,
    status: { message: '', type: '' },
    tooltip: { show: false, x: 0, y: 0, text: '' },
    hoverInfo: 'Hover a component in the diagram to see its dimensions.',
    nextId: 1,
    CONFIG,
    COMPONENT_TYPES,
    HANDLE_POSITIONS,
    isRowEmpty,
    _statusTimer: null,

    init() {
      this.seed(PROJECT);
      this.ensureEmptyRows();
      this.$nextTick(() => {
        let w = 0;
        new ResizeObserver(entries => { const nw = Math.round(entries[0].contentRect.width); if (nw !== w) { w = nw; requestAnimationFrame(() => this.growNotes()); } })
          .observe(this.$refs.notesTbody.closest('table'));
      });
      this.$watch('notes', () => this.$nextTick(() => this.growNotes()));

      this.$watch('columns', () => {
        const last = this.columns[this.columns.length - 1];
        if (last && !isRowEmpty(last.group, last.width)) {
          this.columns.push(this.newColumnRow());
        }
        while (this.columns.length > 1 &&
               isRowEmpty(this.columns[this.columns.length - 1].group, this.columns[this.columns.length - 1].width) &&
               isRowEmpty(this.columns[this.columns.length - 2].group, this.columns[this.columns.length - 2].width)) {
          this.columns.pop();
        }
      });

      this.$watch('components', () => {
        const last = this.components[this.components.length - 1];
        if (last && !isRowEmpty(last.group, last.col, last.span, last.height)) {
          this.components.push(this.newComponentRow());
        }
        while (this.components.length > 1 &&
               isRowEmpty(this.components[this.components.length - 1].group, this.components[this.components.length - 1].col, this.components[this.components.length - 1].span, this.components[this.components.length - 1].height) &&
               isRowEmpty(this.components[this.components.length - 2].group, this.components[this.components.length - 2].col, this.components[this.components.length - 2].span, this.components[this.components.length - 2].height)) {
          this.components.pop();
        }
      });

      this.$watch('notes', () => {
        const isEmpty = n => isRowEmpty(n.name, n.description, n.details);
        const last = this.notes[this.notes.length - 1];
        if (last && !isEmpty(last)) this.notes.push(this.newNoteRow());
        while (this.notes.length > 1 && isEmpty(this.notes[this.notes.length - 1]) && isEmpty(this.notes[this.notes.length - 2])) {
          this.notes.pop();
        }
      });
    },

    get build() {
      return computeLayout(this.columns, this.components, this.gapMm);
    },

    get bannerType() {
      if (this.status.type === 'error') return 'error';
      if (this.build.warnings.length > 0) return 'error';
      if (this.status.type === 'ok') return 'ok';
      return '';
    },
    get bannerText() {
      if (this.status.type === 'error') return this.status.message;
      const w = this.build.warnings;
      if (w.length > 0) return `${w.length} issue(s) — ${w[0]}${w.length > 1 ? ' …' : ''}`;
      return this.status.message;
    },

    newColumnRow(group = '', width = '') { return { id: this.nextId++, group, width }; },
    newComponentRow(group = '', col = '', span = '', type = 'filler', height = '', handle = '', gapW = '', gapH = '', note = '') {
      return { id: this.nextId++, group, col, span, type, height, handle, gapW, gapH, note };
    },
    newNoteRow(name = '', description = '', details = '') { return { id: this.nextId++, name, description, details }; },
    autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; },
    // re-fit every note row when the table width changes (window resize, column widths, import / reload)
    growNotes() { this.$refs.notesTbody?.querySelectorAll('textarea').forEach(el => this.autoGrow(el)); },
    insertNoteRow(idx) {
      this.notes.splice(idx + 1, 0, this.newNoteRow());
      this.$nextTick(() => this.$refs.notesTbody.querySelectorAll('tr')[idx + 1]?.querySelector('textarea')?.focus());
    },
    removeNoteRow(idx) { this.notes.splice(idx, 1); },

    seed(data) {
      Object.assign(this, data.settings);
      this.notes = data.notes.map(([name, description, details]) => this.newNoteRow(name, description, details));
      this.columns = data.columns.map(([g, w]) => this.newColumnRow(g, w));
      this.components = data.components.map(([g, c, s, t, h, hp, gw, gh, note]) => this.newComponentRow(g, c, s, t, h, hp, gw, gh, note || ''));
    },

    ensureEmptyRows() {
      if (this.columns.length === 0 || !isRowEmpty(this.columns[this.columns.length - 1].group, this.columns[this.columns.length - 1].width)) {
        this.columns.push(this.newColumnRow());
      }
      if (this.components.length === 0 || !isRowEmpty(this.components[this.components.length - 1].group, this.components[this.components.length - 1].col, this.components[this.components.length - 1].span, this.components[this.components.length - 1].height)) {
        this.components.push(this.newComponentRow());
      }
      const lastNote = this.notes[this.notes.length - 1];
      if (!lastNote || !isRowEmpty(lastNote.name, lastNote.description, lastNote.details)) this.notes.push(this.newNoteRow());
    },

    insertColumnRow(idx) {
      const current = this.columns[idx];
      const cloned = this.newColumnRow(current.group, current.width);
      this.columns.splice(idx + 1, 0, cloned);
      this.$nextTick(() => this.$refs.columnsTbody.querySelectorAll('tr')[idx + 1]?.querySelector('input')?.focus());
    },
    removeColumnRow(idx) { this.columns.splice(idx, 1); },

    insertComponentRow(idx) {
      const current = this.components[idx];
      const cloned = this.newComponentRow(current.group, current.col, current.span, current.type, current.height, current.handle, current.gapW, current.gapH, '');
      this.components.splice(idx + 1, 0, cloned);
      this.$nextTick(() => this.$refs.componentsTbody.querySelectorAll('tr')[idx + 1]?.querySelector('input')?.focus());
    },
    removeComponentRow(idx) { this.components.splice(idx, 1); },

    resetDefaults() {
      if (!confirm('Replace the current input tables and notes with the project data? This cannot be undone.')) return;
      this.seed(PROJECT);
      this.ensureEmptyRows();
      this.showStatus('Reloaded project data.', false);
    },

    showStatus(message, isError) {
      clearTimeout(this._statusTimer);
      this.status = { message, type: isError ? 'error' : 'ok' };
      if (!isError) this._statusTimer = setTimeout(() => { this.status = { message: '', type: '' }; }, 3000);
    },

    onSvgHover(e) {
      const group = e.target.closest('.component-group');
      if (!group) { this.tooltip.show = false; return; }
      const text = this.describeComponent(group);
      this.tooltip.text = text;
      this.tooltip.show = true;
      // Footnote keeps showing the last-hovered component's dimensions even
      // after the mouse leaves - handy on touch devices where there's no
      // hover, and easier to read than a tooltip chasing the cursor.
      this.hoverInfo = text;
    },
    onSvgMove(e) {
      const group = e.target.closest('.component-group');
      if (!group) { this.tooltip.show = false; return; }
      const rect = this.$refs.svgContainer.getBoundingClientRect();
      this.tooltip.x = e.clientX - rect.left + 15;
      this.tooltip.y = e.clientY - rect.top - 35;
    },
    onSvgLeave() { this.tooltip.show = false; },
    describeComponent(group) {
      const base = this.describeDims(group);
      const note = group.getAttribute('data-note');
      return note ? `${base} — ${note}` : base;
    },
    describeDims(group) {
      const type = group.getAttribute('data-type');
      const w = group.getAttribute('data-w');
      const h = group.getAttribute('data-h');
      if (FRONT_TYPES.includes(type)) {
        const fw = group.getAttribute('data-fw');
        const fh = group.getAttribute('data-fh');
        const gapW = group.getAttribute('data-gap-w');
        const gapH = group.getAttribute('data-gap-h');
        return `${type.toUpperCase()} — Size: ${w}×${h}mm | Front: ${fw}×${fh}mm (Gap W: ${gapW}mm, Gap H: ${gapH}mm)`;
      }
      return `${type.toUpperCase()} — W: ${w} × H: ${h}mm`;
    },

    exportSVG() {
      const svgEl = this.$refs.svgCanvas.querySelector('svg');
      if (!svgEl) return;
      const serializer = new XMLSerializer();
      const svgString = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n' + serializer.serializeToString(svgEl);
      downloadBlob(svgString, 'image/svg+xml;charset=utf-8', 'kitchen-layout.svg');
    },
    exportStateCSV() {
      const rows = [['RowType', 'Group', 'Col', 'Span', 'Type', 'Value', 'Handle', 'GapW', 'GapH', 'Note']];
      for (const k of Object.keys(DEFAULT_SETTINGS)) rows.push(['SETTING', '', '', '', k, this[k], '', '', '', '']);
      // NOTE rows: Type = name, Value = description, Note = details.
      this.notes.forEach(n => {
        if (isRowEmpty(n.name, n.description, n.details)) return;
        rows.push(['NOTE', '', '', '', n.name, n.description, '', '', '', n.details]);
      });
      this.columns.forEach(r => {
        if (isRowEmpty(r.group, r.width)) return;
        rows.push(['COLUMN', r.group, '', '', '', r.width, '', '', '', '']);
      });
      this.components.forEach(r => {
        if (isRowEmpty(r.group, r.col, r.span, r.height)) return;
        rows.push(['COMPONENT', r.group, r.col, r.span, r.type, r.height, r.handle, r.gapW, r.gapH, r.note ?? '']);
      });
      downloadBlob(toCSV(rows), 'text/csv;charset=utf-8;', 'kitchen-state.csv');
      this.showStatus('State exported to CSV.', false);
    },

    triggerImport() {
      this.$refs.importFile.value = '';
      this.$refs.importFile.click();
    },
    handleImportFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          this.importStateCSV(String(reader.result));
          this.ensureEmptyRows();
          this.showStatus(`Imported "${file.name}".`, false);
        } catch (err) {
          this.showStatus(`Import failed: ${err.message}`, true);
        } finally {
          e.target.value = '';
        }
      };
      reader.onerror = () => { this.showStatus('Could not read the file.', true); e.target.value = ''; };
      reader.readAsText(file);
    },
    importStateCSV(text) {
      const parsed = parseCSV(text);
      if (parsed.length === 0) throw new Error('CSV file is empty.');

      let dataRows = parsed;
      const header = parsed[0].map(h => String(h).trim().toUpperCase());
      if (header[0] === 'ROWTYPE') dataRows = parsed.slice(1);

      const newColumns = [];
      const newComponents = [];
      const newNotes = [];
      const newSettings = { ...DEFAULT_SETTINGS };

      dataRows.forEach((r, idx) => {
        const [rowType, group, col, span, type, value, handle, gapW, gapH, note] = r;
        const rt = String(rowType || '').trim().toUpperCase();
        if (rt === 'SETTING') {
          const key = String(type ?? '').trim();
          const v = parseFloat(value);
          if (!(key in DEFAULT_SETTINGS) || !Number.isFinite(v)) throw new Error(`Row ${idx + 1}: invalid SETTING "${key}".`);
          newSettings[key] = v;
        } else if (rt === 'NOTE') {
          newNotes.push(this.newNoteRow(String(type ?? ''), String(value ?? ''), String(note ?? '')));
        } else if (rt === 'COLUMN') {
          const g = parseInt(group, 10);
          const w = parseFloat(value);
          if (!Number.isFinite(g) || !Number.isFinite(w)) throw new Error(`Row ${idx + 1}: invalid COLUMN data.`);
          newColumns.push(this.newColumnRow(g, w));
        } else if (rt === 'COMPONENT') {
          const g = parseInt(group, 10);
          const c = parseInt(col, 10);
          const s = parseInt(span, 10);
          const h = parseFloat(value);
          const t = String(type || '').trim();
          const gapWStr = String(gapW ?? '').trim();
          const gapHStr = String(gapH ?? '').trim();
          if (!Number.isFinite(g) || !Number.isFinite(c) || !Number.isFinite(s) || !Number.isFinite(h) || !t) {
            throw new Error(`Row ${idx + 1}: invalid COMPONENT data.`);
          }
          newComponents.push(this.newComponentRow(g, c, s, t, h, String(handle || '').trim(), gapWStr, gapHStr, String(note ?? '')));
        } else if (rt) {
          throw new Error(`Row ${idx + 1}: unknown RowType "${rowType}" (expected SETTING, NOTE, COLUMN or COMPONENT).`);
        }
      });

      Object.assign(this, newSettings);
      this.columns = newColumns;
      this.components = newComponents;
      this.notes = newNotes;
    }
  }));
});
</script>

</body>
</html>
