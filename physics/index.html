<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Notebook</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header class="page">
  <p class="kicker">knapiontek.github.io</p>
  <h1>Physics Notebook</h1>
  <p class="lede">Derivations and interactive simulations, from Newton's orbits to the Dirac equation. Everything runs locally in the browser, with no internet connection needed.</p>
</header>
<div class="cards" id="cards"></div>
</main>
<script src="vendor/katex/katex.min.js"></script>
<script src="lib.js"></script>
<script>
document.getElementById('cards').innerHTML = Lab.PAGES.map(p => `
  <a class="card" href="${p.file}">
    <div class="tag">${p.tag}</div>
    <div class="f"><span class="m">${p.tex}</span></div>
    <div class="t">${p.title}</div>
    <div class="d">${p.desc}</div>
  </a>`).join('');
</script>
</body>
</html>
